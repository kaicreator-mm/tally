# Inherited Go maintenance on main; NOT the Tally v2 Node24 release gate.
# Path-scope auto-runs to Go changes; manual runs remain available.
# backend:local executes on the selected runner, where 'image: bash'
# does not supply a Go toolchain. Do not modify the entire agent fleet for v2.
when:
  - event: [push]
    branch: [main]
    path:
      include:
        - '**/*.go'
        - 'go.mod'
        - 'go.sum'
        - 'sqlc.yaml'
        - 'migrations/**'
  - event: [manual]
    branch: [main]

labels:
  backend: local

steps:
  - name: verify-legacy-go
    image: bash
    commands:
      - set -euo pipefail
      - 'test -n "${CI_COMMIT_SHA:-}"'
      - 'test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"'
      - |
        if ! command -v go >/dev/null 2>&1; then
          echo "LEGACY_GO_VERIFY_ENV_BLOCKED: selected runner has no Go toolchain; not a v2 Node failure"
          exit 77
        fi
      - go version
      - go build ./...
      - go test ./...

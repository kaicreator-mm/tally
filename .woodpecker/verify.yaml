when:
  - event: [push, manual]
    branch: [main]

# ECF elastic workers run the agent with backend=local (VM-is-the-sandbox):
# steps execute on the Alpine host (node24+go+python+git preinstalled).
labels:
  backend: local

steps:
  - name: verify
    image: bash
    commands:
      - uname -a && git --version && node -v && go version && python3 -V
      - test -d .git && git rev-parse HEAD
      - go build ./...
      - go test ./... 2>&1 | tail -20

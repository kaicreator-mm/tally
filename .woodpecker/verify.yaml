when:
  - event: [push, manual]
    branch: [main]

# Route to ECF elastic agents (docker backend, baked kaicreator/builder image).
# Standard clone: plugin-git:2.10.1 (pre-pulled on workers) + forge credentials.
labels:
  backend: docker

# Override the server-level default clone plugin (a host binary path for the
# local agent) with the pre-pulled OCI plugin for docker agents.
clone:
  - name: git
    image: woodpeckerci/plugin-git:2.10.1
    pull: false
    settings:
      depth: 1

steps:
  - name: verify
    image: kaicreator/builder:1.0
    pull: false
    commands:
      - go version && git --version
      - test -d .git && git rev-parse HEAD
      - go build ./...
      - go test ./... 2>&1 | tail -20

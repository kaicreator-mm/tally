# Tally v2 ALM workspace source gate. Windows Codex evidence is Host-local, not Docker OS-isolation evidence.
when:
  - event: [pull_request, push, manual]
    branch: [version/v2]
    path:
      include:
        - 'web/v2/**'
        - 'apps/tally-web/**'
        - 'packages/tally-engineering-business/**'
        - 'packages/tally-github-c/src/project-intake.mjs'
        - 'packages/tally-github-c/test/project-intake.test.mjs'
        - 'packages/tally-github-c/src/maintenance-effects.mjs'
        - 'packages/tally-github-c/test/maintenance-effects.test.mjs'
        - 'experiments/v2/project-intake/**'
        - 'experiments/v2/maintenance/**'
        - 'experiments/v2/release/**'
        - 'experiments/v2/selected-business-build/**'
        - '.woodpecker/v2-alm-workspace.yaml'
  - event: [pull_request, push, manual]
    branch: [task/tally-i92-k3]
  - event: [pull_request, push, manual]
    branch: [task/tally-i219-k3]

labels:
  backend: local

steps:
  - name: alm-workspace-exact-head-node24
    image: bash
    commands:
      - set -euo pipefail
      - 'echo "WP_PIPELINE_NUMBER=${CI_PIPELINE_NUMBER:-unknown} WP_PIPELINE_EVENT=${CI_PIPELINE_EVENT:-unknown}"'
      - 'echo "WP_AGENT_ID=${CI_AGENT_ID:-unknown}"'
      - 'echo "WP_STEP=${CI_STEP_NAME:-unknown}/${CI_STEP_NUMBER:-unknown}"'
      - 'echo "WP_PIPELINE_URL=${CI_PIPELINE_URL:-unknown}"'
      - 'echo "ALM_WORKSPACE_HEAD=$(git rev-parse HEAD)"'
      - 'echo "ALM_WORKSPACE_PIPELINE_COMMIT=${CI_COMMIT_SHA:-unknown}"'
      - test -n "${CI_COMMIT_SHA:-}"
      - git checkout --detach "$CI_COMMIT_SHA"
      - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      - node --version
      - test "$(node -p 'process.versions.node.split(".")[0]')" = 24
      - git diff --check

  - name: alm-workspace-range-trailers
    image: bash
    commands:
      - set -euo pipefail
      - 'echo "WP_PIPELINE_NUMBER=${CI_PIPELINE_NUMBER:-unknown} WP_STEP=${CI_STEP_NAME:-unknown}"'
      - |
        if [ "${CI_PIPELINE_EVENT:-}" = "pull_request" ] && [ -n "${CI_COMMIT_TARGET_BRANCH:-}" ]; then
          git fetch --quiet origin "+refs/heads/${CI_COMMIT_TARGET_BRANCH}:refs/ci-base/target" || { echo "FAIL: cannot fetch target branch ${CI_COMMIT_TARGET_BRANCH}"; exit 1; }
          if ! base="$(git merge-base refs/ci-base/target HEAD)"; then
            echo "CI_TRAILER_DEEPEN_REQUIRED=${CI_COMMIT_TARGET_BRANCH}"
            git fetch --quiet --unshallow origin "+refs/heads/${CI_COMMIT_TARGET_BRANCH}:refs/ci-base/target" || { echo "FAIL: cannot unshallow target branch ${CI_COMMIT_TARGET_BRANCH}"; exit 1; }
            base="$(git merge-base refs/ci-base/target HEAD)" || { echo "FAIL: no merge-base with ${CI_COMMIT_TARGET_BRANCH}"; exit 1; }
          fi
          echo "CI_TRAILER_BASE=${base} CI_TRAILER_HEAD=${CI_COMMIT_SHA}"
          ./scripts/check-trailers.sh "$base" "$CI_COMMIT_SHA"
        else
          echo "CI_TRAILER_BASE=HEAD (push/manual: single subject commit)"
          git log -1 --format=%B HEAD | grep -qi '^Refs:'
        fi
      - echo TALLY_V2_ALM_WORKSPACE_TRAILERS_PASS

  - name: alm-workspace-tests
    image: bash
    commands:
      - set -euo pipefail
      - 'echo "WP_STEP=${CI_STEP_NAME:-unknown}/${CI_STEP_NUMBER:-unknown}"'
      - npm --prefix packages/tally-engineering-business install --ignore-scripts --no-package-lock --no-save --no-audit --no-fund --registry=https://registry.npmmirror.com ajv@8.17.1
      - files="$(find web/v2 -type f -name '*.test.mjs' -print)"
      - test -n "$files"
      - node --test $files packages/tally-engineering-business/test/business-policy.test.mjs packages/tally-github-c/test/project-intake.test.mjs experiments/v2/project-intake/host-project.test.mjs packages/tally-github-c/test/maintenance-effects.test.mjs experiments/v2/maintenance/host-maintenance.test.mjs experiments/v2/release/installed-journey.test.mjs
      - 'node web/v2/journey-browser-e2e.mjs --no-browser > "${TMPDIR:-/tmp}/journey-browser-witness.json"'
      - 'grep -q ''"ok": true'' "${TMPDIR:-/tmp}/journey-browser-witness.json"'
      - 'grep -q ''"hostExecution": "INJECTED_RUN_SEAM"'' "${TMPDIR:-/tmp}/journey-browser-witness.json"'
      - 'grep -q ''"realWindowsCodex": "NOT_RUN"'' "${TMPDIR:-/tmp}/journey-browser-witness.json"'
      - 'grep -q ''"browser": "GUI_NOT_PROVEN"'' "${TMPDIR:-/tmp}/journey-browser-witness.json"'
      - echo TALLY_V2_ALM_WORKSPACE_SOURCE_TESTS_PASS
      - echo TALLY_V2_J06_BROWSER_JOURNEY_SOURCE_TESTS_PASS_V74_V75_V76_V82
      - echo TALLY_V2_J06_REAL_BROWSER_GUI_NOT_PROVEN_IN_DOCKER
      - echo TALLY_V2_ALM_WORKSPACE_REAL_GITHUB_PROJECT_EFFECT_NOT_RUN
      - echo TALLY_V2_ALM_WORKSPACE_WINDOWS_OS_ISOLATION_NOT_RUN_IN_DOCKER
  - name: alm-workspace-tally-web-node24
    image: bash
    commands:
      - set -euo pipefail
      - 'echo "TALLY_WEB_HEAD=$(git rev-parse HEAD)"'
      - test "$(node -p 'process.versions.node.split(".")[0]')" = 24
      # UI lanes (#228-#231, #233-#235): pure-TS model tests run without any
      # npm install by design (Node >=24 native type stripping).
      - 'files="$(find apps/tally-web/src -type f -name "*.test.ts" -print)"'
      - test -n "$files"
      - node --test $files
      - node --check web/v2/journey-client.mjs
      # Build the production bundle the ALM server serves at /app (feature
      # gate UI-E #232). Dependencies resolve from the npmmirror cache.
      - npm --prefix apps/tally-web install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmmirror.com
      - npm --prefix apps/tally-web rebuild esbuild rollup --registry=https://registry.npmmirror.com
      - npm --prefix apps/tally-web run build
      - test -f apps/tally-web/dist/index.html
      - echo TALLY_V2_TALLY_WEB_BUILD_PASS
  - name: alm-workspace-release-panel-negative
    image: bash
    commands:
      - set -euo pipefail
      - 'echo "T07C_RELEASE_NEGATIVE_HEAD=$(git rev-parse HEAD)"'
      # J07c: the Release panel stays read-only until a fresh selected K/Host
      # permit exists; no enabled control and no advisory-PASS promotion.
      - grep -q 'data-release-action="merge" disabled aria-disabled="true"' web/v2/release-view.mjs
      - grep -q 'data-release-action="tag" disabled aria-disabled="true"' web/v2/release-view.mjs
      - grep -q 'data-release-action="publish" disabled aria-disabled="true"' web/v2/release-view.mjs
      - grep -q 'INDEPENDENT_HOST_ADMISSION_NOT_CONNECTED' web/v2/release-controller.mjs
      - grep -q 'CSRF_OR_ORIGIN' web/v2/journey-server.mjs
      - grep -q 'verifyReleaseSeamResult' web/v2/journey-server.mjs
      - grep -q 'id="release-app"' web/v2/journey-view.html
      - grep -q 'release-bootstrap.mjs' web/v2/journey-view.html
      # Installed journey receipts never become independent RQ.
      - grep -q 'CAPTURE_REQUIRES_INDEPENDENT_VERIFICATION' experiments/v2/release/installed-journey.mjs
      - grep -q 'qualification:.NOT_QUALIFIED.' experiments/v2/release/installed-journey.mjs
      - echo TALLY_V2_ALM_WORKSPACE_RELEASE_PANEL_NEGATIVE_PASS

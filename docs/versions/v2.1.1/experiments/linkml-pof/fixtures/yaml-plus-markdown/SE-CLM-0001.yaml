applicability: "Claim about the SWEBOK Guide v4.0a taxonomy; not a claim that the whole discipline has exactly 18 mutually exclusive areas."
explanation: "The claim is scoped to the taxonomy presented by SWEBOK Guide v4.0a."
limitations:

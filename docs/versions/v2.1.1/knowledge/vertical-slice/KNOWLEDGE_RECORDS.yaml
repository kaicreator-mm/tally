claims:
  - claim_id: SE-CLM-0001
    claim_type: TAXONOMY_FACT
    statement: "SWEBOK Guide v4.0a organizes its reference knowledge into 18 Knowledge Areas."
    evidence_refs:
      - SE-EVD-0001
    applicability: "Claim about the SWEBOK Guide v4.0a taxonomy; not a claim that the whole discipline has exactly 18 mutually exclusive areas."
    assumptions: []
    limitations:
      - "The Guide is not the complete body of knowledge."
      - "The 18 KAs are not assumed to be mutually exclusive."
    status: PROPOSED
  - claim_id: SE-CLM-0002
    claim_type: TAXONOMY_FACT
    statement: "SWEBOK Guide v4.0a identifies eleven related disciplines."
    evidence_refs:
      - SE-EVD-0002
    applicability: "Claim about the related-discipline list in this edition."
    assumptions: []
    limitations:
      - "The Guide does not characterize the full knowledge of each related discipline."
    status: PROPOSED
  - claim_id: SE-CLM-0003
    claim_type: SCOPE_LIMITATION
    statement: "SWEBOK Guide v4.0a is a guide to the body of knowledge and does not claim to be a complete reproduction of all Software Engineering knowledge."
    evidence_refs:
      - SE-EVD-0003
    applicability: "Applies to interpretation of SWEBOK v4.0a as a reference."
    assumptions: []
    limitations:
      - "This is a statement about the Guide's declared scope, not a claim that its taxonomy is poor or unusable."
    status: PROPOSED
  - claim_id: SE-CLM-0004
    claim_type: TAXONOMY_STRUCTURE
    statement: "SWEBOK v4.0a presents its topic organization hierarchically, generally at two or three levels."
    evidence_refs:
      - SE-EVD-0004
    applicability: "Describes the Guide's topic organization, not all graph relationships in the discipline."
    assumptions: []
    limitations:
      - "A hierarchical topic organization does not imply every concept has exactly one parent."
    status: PROPOSED
  - claim_id: SE-CLM-0005
    claim_type: CURRICULUM_TAXONOMY_FACT
    statement: "CS2023 defines 17 Computer Science Knowledge Areas, with Software Engineering as one area."
    evidence_refs:
      - SE-EVD-0005
    applicability: "Claim about the CS2023 curriculum framework."
    assumptions: []
    limitations:
      - "Curriculum structure is not a complete professional Software Engineering taxonomy."
    status: PROPOSED
  - claim_id: SE-CLM-0006
    claim_type: CURRICULUM_TAXONOMY_FACT
    statement: "The CS2023 Software Engineering area lists nine Knowledge Units."
    evidence_refs:
      - SE-EVD-0006
    applicability: "Claim about the CS2023 Software Engineering curriculum area."
    assumptions: []
    limitations:
      - "Knowledge Units are not equivalent to SWEBOK Knowledge Areas."
    status: PROPOSED
  - claim_id: SE-CLM-0007
    claim_type: CURRICULUM_TOPIC_FACT
    statement: "The CS2023 SE-Tools unit includes software configuration management/version control, release management, testing tools and process automation/continuous integration."
    evidence_refs:
      - SE-EVD-0007
    applicability: "Claim about the SE-Tools Knowledge Unit in CS2023."
    assumptions: []
    limitations:
      - "This does not imply that all configuration management or operations knowledge is contained in SE-Tools."
    status: PROPOSED

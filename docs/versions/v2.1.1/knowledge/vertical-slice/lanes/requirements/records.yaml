  CS2023 Software Engineering knowledge unit "SE-Requirements: Product
  Requirements" plus registry-verified SE Overview / Core Hours anchors.
  SWEBOK v4.0a remains under source-identity hold (#325), so no professional
  body-of-knowledge evidence is cited and every claim is scoped to the CS2023
  curriculum. All knowledge records are PROPOSED or PENDING_REVIEW; none is
  ACCEPTED. Source entities are not stored in this lane file; the validation
  harness derives shared Source records from SOURCE_REGISTRY.yaml.
review_policy: "No record is ACCEPTED until a human reviewer verifies source, locator, interpretation, applicability and rights."

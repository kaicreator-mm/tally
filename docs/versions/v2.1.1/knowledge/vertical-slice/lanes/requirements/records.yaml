  principles:
    - id: se:PRI-REQ-EXPECT-CHANGE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-06"
      label: Expect requirements change
      statement: >-
        Requirements on a software product should be expected to change over the
        product's lifetime, and when they change the effect of the change — what
        must be modified as a result — needs to be understood.
      rationale: >-
        The CS2023 SE preamble frames software engineering projects as usually
        multi-version, with features added or removed to meet product requirements
        over an expected lifespan, and the SE-Requirements unit includes product
        evolution (understanding the effect of changed requirements and what
        changes are needed) as a topic.
      scope_description: "Derived within CS2023 SE curriculum scope (SE Preamble plus SE-Requirements Non-core topic 8); not asserted as a professional-consensus principle."
      applicability: "Products with an expected multi-release lifespan in which requirements evolve."
      exceptions:
        - "Single-delivery or throwaway artifacts that are explicitly not expected to evolve."
      limitations:
        - "Product evolution is a Non-core (elective) topic in CS2023, so the curriculum itself does not make change-impact analysis mandatory for all programs."
        - "Strength of the principle beyond curriculum scope is untested in this lane (no empirical evidence cited)."

  practices:
    - id: se:PRA-REQ-MULTI-SOURCE-ELICITATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-06"
      label: Multi-source, multi-method requirements elicitation
      intent: >-
        Reduce single-source bias in the gathered requirement set by deliberately
        combining requirement sources and gathering methods.
      description: >-
        Elicit requirements from multiple source groups — users, administrators and
        support personnel are the curriculum's examples — using multiple gathering
        methods such as surveys, interviews and behavioral analysis, as presented in
        the CS2023 SE-Requirements elicitation topic.
      preconditions:
        - "Access to at least two distinguishable requirement source groups."
        - "A chosen combination of gathering methods appropriate to the product context."
      steps:
        - "Identify the requirement source groups touching the product (for example users, administrators, support personnel)."
        - "Select gathering methods (for example surveys, interviews, behavioral analysis) suited to each group."
        - "Collect and record elicited requirements with source and method provenance."
        - "Compare and merge results across sources and methods, flagging conflicts for resolution."
      expected_outcomes:
        - "A requirement set reflecting more than one source group and more than one gathering method."
        - "Recorded source and method provenance for elicited requirements."
      risks:
        - "Sources may be unavailable or unrepresentative."
        - "Different methods yield requirements at incompatible levels of detail."
        - "Merging across sources surfaces conflicts that must be resolved, adding effort."
      scope_description: "Operationalizes CS2023 SE-Requirements KA Core topic 3 (elicitation sources and methods) at curriculum-scope fidelity; not a professional-standard procedure."
      applicability: "Products with multiple stakeholder groups; the example lists are illustrative, not exhaustive."
      evidence_refs:
        - se:EVD-REQ-ELICITATION-SOURCES-METHODS
      claim_refs:
        - se:CLM-REQ-ELICITATION-MULTI-SOURCE
    - id: se:PRA-REQ-PROTOTYPE-VALIDATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-06"
      label: Prototype-based requirement validation
      intent: >-
        Use a prototype both to surface new requirements and to validate or confirm
        an existing requirement set.
      description: >-
        Build a lightweight representation of the software system — the curriculum's
        learning-outcome examples include a mock-up or MVP — and use the same
        artifact for eliciting requirements and for validating or confirming them
        with stakeholders.
      preconditions:
        - "A candidate requirement set to validate, or an elicitation target."
        - "Stakeholders able to react to a prototype."
        - "Capacity to build and discard a minimal or throwaway artifact."
      steps:
        - "Choose the prototype fidelity needed for the decision at hand (mock-up, MVP, etc.)."
        - "Build the minimal prototype covering the requirements in question."
        - "Walk stakeholders through the prototype, recording reactions as newly elicited or confirmed/refuted requirements."
        - "Update the requirement set and record which requirements the prototype validated."
      expected_outcomes:
        - "Requirements confirmed, refuted or newly elicited through stakeholder reaction to the prototype."
      risks:
        - "Stakeholders may mistake a throwaway prototype for the product direction."
        - "Prototype fidelity may over- or under-represent the real system, biasing feedback."
        - "Prototype effort can exceed the value of the validated decisions."
      scope_description: "Operationalizes CS2023 SE-Requirements Non-core topic 7 (prototyping as a tool for both eliciting and validating/confirming requirements); an elective curriculum topic, not a mandated practice."
      applicability: "Requirement sets whose correctness is hard to assess in the abstract and where stakeholders can inspect an artifact."
      evidence_refs:
        - se:EVD-REQ-PROTOTYPE-AND-CHANGE
      claim_refs:
        - se:CLM-REQ-PROTOTYPE-DUAL-ROLE

  patterns:
    - id: se:PAT-REQ-USER-STORY-SPECIFICATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-06"
      label: User-story-structured functional specification
      problem: >-
        Functional requirements need a documentation and structuring method that
        stakeholders can read and that designers and implementers can trace to
        their work.
      context: >-
        A team specifying the functional scope of a new product or feature chooses
        among documented structuring methods such as use cases and user stories,
        per the CS2023 SE-Requirements instruction to use at least one such method.
      forces:
        - "Stakeholder readability versus implementation traceability."
        - "The chosen method must support design and implementation, not only description."
        - "Each specific approach has its own strengths and weaknesses."
        - "Team familiarity differs across methods."
      solution: >-
        Express each functional requirement as a short user story (actor,
        capability, purpose) — or a comparable structured unit — and keep the chosen
        structure uniform across the requirement set, following the curriculum's
        example methods for documenting and structuring functional requirements.
      consequences:
        - "A uniform, stakeholder-readable functional requirement set whose entries can be traced into design and implementation work."
        - "The choice of method explicitly shapes how well the specification supports later design and implementation."
      tradeoffs:
        - "User stories are lightweight and readable but carry less structured interaction detail than full use cases; use cases capture more detail at higher documentation cost."
      scope_description: "CS2023 SE-Requirements KA Core topic 1 curriculum scope (use cases / user stories as the named example methods); not a claim that user stories dominate other methods."
      evidence_refs:
        - se:EVD-REQ-FUNCTIONAL-REQ-METHODS

  anti_patterns:
    - id: se:ANT-REQ-IMPLICIT-QUALITY-ATTRIBUTES
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-06"
      label: Implicit or deferred quality attributes
      symptoms:
        - "Quality concerns such as security, usability and performance surface late as retrofit requests rather than stated requirements."
        - "The requirement set contains only functional items; quality expectations are assumed to be understood."
        - "Design and implementation decisions lack explicit quality anchors to be checked against."
      causes:
        - "Treating non-functional requirements as separate from the 'real' (functional) requirements."
        - "No owner or method for capturing quality attributes alongside functional requirements."
        - "Confusing software that works once with software that keeps working under quality constraints."
      consequences:
        - "Quality attributes surface as late, expensive rework in design and implementation."
        - "Unstated quality expectations diverge between stakeholders, producing validation disputes."
        - "Security, usability and performance risks are discovered after structural decisions are fixed."
      remediation: >-
        Name quality attributes explicitly as requirements — following the CS2023
        placement of non-functional requirements (Quality Attributes) as a core
        requirements topic with security, usability and performance as examples —
        and capture them with the same documentation discipline as functional
        requirements.
      scope_description: "Lane-level characterization grounded in the CS2023 SE-Requirements unit (KA Core topics 1 and 4); the counterproductive nature of this approach is a SEK-06A synthesis inference (see se:EVD-REQ-SYNTHESIS-QA-DEFERRED), not a statement made by the CS2023 report."
      evidence_refs:
        - se:EVD-REQ-SYNTHESIS-QA-DEFERRED

  decision_models:
    - id: se:DM-REQ-FUNCTIONAL-DOC-METHOD
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-06"
      decision_question: "Which method should a team use to document and structure the functional requirements of a product or feature?"
      options:
        - "Use cases"
        - "User stories"
        - "A defined combination of both, or another structured method, applied uniformly"
      criteria:
        - "How well the method supports design and implementation."
        - "Strengths and weaknesses of the specific approach."
        - "Team familiarity with the method."
        - "Stakeholder readability of the resulting specification."
      constraints:
        - "At least one documentation and structuring method must actually be used (CS2023 topic 1a)."
        - "The chosen method applies uniformly across the requirement set for consistency."
      procedure: >-
        For each candidate method, assess it against the agreed criteria for the
        product context — the CS2023 curriculum frames the comparison axes as the
        method's support for design and implementation and its approach-specific
        strengths and weaknesses — then select one method (or a defined
        combination) and record the selection rationale with the requirement set.
      tradeoffs:
        - "A lighter method such as user stories is faster and more readable but less detailed; a heavier method such as full use cases captures interaction detail at higher documentation cost."
      scope_description: "Structured around CS2023 SE-Requirements KA Core topic 1 (subtopics 1a-1c); curriculum-scope decision aid, not a professional-standard decision procedure."
      evidence_refs:
        - se:EVD-REQ-FUNCTIONAL-REQ-METHODS
      claim_refs:
        - se:CLM-REQ-FUNCTIONAL-DOC-METHODS


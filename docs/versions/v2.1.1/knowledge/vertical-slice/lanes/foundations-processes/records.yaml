    - id: se:CLM-07A-STAGES-NOT-SEQUENTIAL
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      statement: >-
        SWEBOK Guide v4.0a KA10's six general life cycle stages — concept,
        development, production, utilization, support and retirement — are
        explicitly not presumed to be sequential: the specification of the
        life cycle for a software system includes the transitions between the
        stages, and specific life cycles have specific stages, meaningful to
        the project's stakeholders, that fit into the general stages.
      claim_kind: DEFINITION
      scope_description: "SWEBOK Guide v4.0a Chapter 10 section 2.6 (printed pages 10-7 to 10-8); the Guide's general stage model."
      applicability: "Interpreting lifecycle-stage descriptions within the KA10 lens; guards against reading a stage list as a mandated sequence."
      assumptions: []
      exceptions: []
      limitations:
        - "The stage list is a general framework; specific life cycles redefine stages within it."
      uncertainty: []

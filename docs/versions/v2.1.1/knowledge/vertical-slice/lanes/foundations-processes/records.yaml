    - id: se:CLM-07A-LIFECYCLE-VS-MODEL
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      statement: >-
        In SWEBOK Guide v4.0a KA10, a software life cycle model (SLCM) and a
        life cycle are distinct: a project-specific sequence of activities is
        created by mapping the activities of a standard onto a selected SLCM,
        so a life cycle is created in conformance with the life cycle model;

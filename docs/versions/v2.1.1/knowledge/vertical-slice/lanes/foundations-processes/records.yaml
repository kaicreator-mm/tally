  evidence_records:
    - id: se:EVD-07A-KA10-PROCESS-DEFINITION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07A-SWEBOK-KA10-FUNDAMENTALS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA10 frames an engineering process as a set of
        interrelated activities that transform one or more inputs into outputs
        while consuming resources, and defines a process description as
        covering required inputs, transforming activities and the generated
        outputs; the output of one process can be an input to another process,
        and processes may include controls (directives, constraints) and
        enabling mechanisms (tools, technologies, workforce, infrastructure).
        The KA states that no ideal process, or set of processes, exists —
        software processes must be selected, adapted and applied as
        appropriate for each project and each organizational context — and
        that software engineering process management should be supported by
        empirical measurement.
      context: "SWEBOK Guide v4.0a Chapter 10 sections 1.1-1.2, printed pages 10-1 to 10-3; process fundamentals before the life cycle sections."
      method: "Direct inspection of the official SWEBOK v4.0a PDF (SHA-256 0c9db4da0b2425c58cf778b99131eb31bb6c188e98b67163a549a1366d96e511) on 2026-11-07 at PDF page indices 220-222; text extracted with pypdf and paraphrased originally."
      result: "The process-definition family, the no-ideal-process statement and the empirical-measurement requirement were confirmed for the lane's process-scope claims."
      limitations:
        - "The Guide's definitions are surveyed generally accepted knowledge; the section does not prescribe which process any project must use."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07A-KA10-LIFECYCLE-STRUCTURE
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07A-SWEBOK-KA10-LIFECYCLE-DEFINITION
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA10 defines a life cycle as the evolution of a system,
        product, service, project or other human-made entity from conception
        through retirement, and presents the life cycle of a software system
        as comprising all processes, activities and tasks from the ideation of
        the system to its retirement, including production, operation and
        evolution, as well as acquisition and supply when needed. Section 2.1
        enumerates four process categories: technical processes; technical
        management processes; organizational project-enabling processes; and
        agreement processes. Section 2.2 adds that life cycle processes are
        interrelated — each process's inputs and outputs may depend on other
        processes — and that the specification of life cycles is a powerful
        tool for implementing an engineering approach to the creation,
        operation and retirement of software systems.
      context: "SWEBOK Guide v4.0a Chapter 10 sections 2.1-2.2, printed pages 10-3 to 10-4; life cycle definition, process categories and rationale."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 222-224; original paraphrase."
      result: "The life cycle definition, the four-category process taxonomy and the interrelated-processes rationale were confirmed."
      limitations:
        - "The category enumeration follows the reference the Guide cites (ISO/IEC/IEEE 12207:2017); the normative standard text itself was not admitted in this corpus."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07A-KA10-LIFECYCLE-MODELS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07A-SWEBOK-KA10-LIFECYCLE-MODELS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA10 sections 2.3-2.5 distinguish a life cycle from a
        life cycle model: a project-specific sequence of activities is created
        by mapping the activities of a standard onto a selected software life
        cycle model (SLCM), so a life cycle is created in conformance with the
        model. Examples of well-known life cycle models named for product
        development are the waterfall model, the V-model, the incremental
        model, the spiral model and the Agile model. The sections characterize
        paradigms: predictive life cycles (scope, time and cost determined
        early; requirements treated as a closed set), iterative life cycles
        (scope generally determined early while time and cost estimates are
        routinely modified as understanding increases), evolutionary life
        cycles (requirements introduced in successive steps), incremental life
        cycles (deliverable produced through iterations that successively add
        functionality within a predetermined time frame) and continuous
        development (frequent releases through automated tools). Waterfall is
        described as predictive and document-driven with a strict phase order;
        the spiral model as evolutionary and risk-driven; and Agile as claiming
        openness to change, with the Guide naming several misconceptions —
        that Agile is a method in itself, that it is faster because no
        documents are produced, and that it has a limited or unstructured set
        of methods and practices.
      context: "SWEBOK Guide v4.0a Chapter 10 sections 2.3-2.5, printed pages 10-5 to 10-7; life cycle model concepts, paradigms and named model families."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 224-226; original paraphrase."
      result: "The model-versus-life-cycle distinction, the named model families, the paradigm definitions and the Agile misconceptions were confirmed."
      limitations:
        - "The Guide surveys generally accepted model families; it does not rank their effectiveness, and its topic citations are not comprehensive."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07A-KA10-STAGES-ADAPTATION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07A-SWEBOK-KA10-MANAGEMENT-ADAPTATION
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA10 section 2.6 lists six general stages of a software
        system's life cycle — concept, development, production, utilization,
        support and retirement — and states they are not supposed to be
        sequential: the specification of the life cycle includes the
        transitions between stages, and specific life cycles have their own
        stages, meaningful to the project's stakeholders, that fit into the
        general ones. Section 2.8 presents software life cycle adaptation as
        identifying the relevant characteristics of the software system and
        the stakeholders' needs, selecting appropriate standards or documents
        internal to the organization, selecting a development strategy/life
        cycle model, stages and processes, and documenting the decisions and
        rationale; the adaptation does not require keeping the provided names
        or including all of the processes. Section 2.9 records practical
        considerations: estimations and measurements are essential, wrong or
        uncertain estimations in the context of a life cycle will lead to
        failure, and working with large processes without producing
        deliverables along the way increases uncertainty; discussions of
        predictive versus Agile life cycles should be supported by realistic
        process and product estimations and measurements.
      context: "SWEBOK Guide v4.0a Chapter 10 sections 2.6-2.9, printed pages 10-7 to 10-9; stage model, process management levels, adaptation and practical considerations."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 226-228; original paraphrase."
      result: "The six-stage model with non-sequential transitions, the adaptation activity with documented rationale, and the estimation/measurement lessons were confirmed."
      limitations:
        - "The stages and adaptation steps are presented as generally accepted guidance, not as a mandated tailoring procedure."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07A-KA10-ASSESSMENT
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07A-SWEBOK-KA10-ASSESSMENT
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA10 section 3 presents software process assessment and
        improvement approaches grounded in empirical evidence: the classic
        Shewhart-Deming plan-do-check-act (PDCA) paradigm, already discussed
        and applied in the 1950s, described as an opportunity to meet the
        widely recognized need for empirical evidence to make decisions such
        as choosing, assessing or improving a process; the Goal Question
        Metric (GQM) approach, based on Basili's Quality Improvement
        Paradigm, which sets goals that can be measured, changes something and
        evaluates the effect of the change; framework-based methods that use a
        process reference model and a process assessment model — the Guide
        names CMM, CMMI and the ISO/IEC 33000 series (also known as SPICE); and,
        for Agile life cycles, iteration retrospectives that analyze what went
        well and what did not, understand why, and set improvement actions,
        forming a continuous learning loop.
      context: "SWEBOK Guide v4.0a Chapter 10 section 3 (3.1-3.4), printed pages 10-9 to 10-10; process assessment and improvement approaches."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 228-229; original paraphrase."
      result: "The PDCA, GQM, framework-based and retrospective approaches and their shared empirical-evidence framing were confirmed."
      limitations:
        - "The section surveys the approaches; it does not compare their effectiveness empirically within the Guide."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07A-KA11-MODELING-PRINCIPLES
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07A-SWEBOK-KA11-MODELING
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        The SWEBOK v4.0a KA11 introduction states that software engineering
        models and methods impose structure on software engineering to make it
        systematic, repeatable and ultimately more success-oriented: models
        provide an approach to problem-solving, a notation and procedures for
        model construction and analysis, while methods provide an approach to
        the systematic specification, design, construction, testing and
        verification of the end-item software and associated work products.
        Models and methods vary widely in scope — from addressing a single
        software life cycle phase to covering the complete software life
        cycle — and the KA focuses on those that encompass multiple phases
        regardless of the type of life cycle process model, such as iterative
        and Agile ones. Section 1.1 gives three general modeling principles:
        model the essentials (abstract away nonessential information to keep
        models manageable and useful); provide perspective (views such as
        structural, behavioral, temporal or organizational, each with its own
        notation, vocabulary, methods and tools); and enable effective
        communications. Section 1.2 defines completeness, consistency and
        correctness as properties of models within the chosen notation and
        tooling, and describes a model as an abstraction or simplification of
        a system comprising an aggregation of abstractions that together
        describe only the selected aspects, perspectives or views needed to
        make informed decisions.
      context: "SWEBOK Guide v4.0a Chapter 11 introduction and sections 1.1-1.2, printed pages 11-1 to 11-3; the modeling foundation for the lane's model-level records."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 232-234; original paraphrase."
      result: "The structure-imposing purpose, the scope range, the three modeling principles and the model-property definitions were confirmed."
      limitations:
        - "The KA's scope statement is a characterization of the knowledge area, not evidence that any particular modeling method is effective."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07A-KA11-MODEL-ANALYSIS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07A-SWEBOK-KA11-ANALYSIS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA11 section 3 presents the analysis techniques used so
        that constructed models are complete, consistent and correct enough to
        serve their intended purpose for stakeholders: analyzing for
        completeness (the degree to which all specified requirements have been
        implemented and verified, checked with tooling, state-space
        reachability or review); for consistency (the model contains no
        conflicting requirements, assertions, constraints, functions or
        component descriptions); for correctness (syntactic correctness in the
        modeling language and semantic correctness of what is represented);
        for traceability (mapping and controlling the dependency relationships
        among work products; the Guide states use of traceability typically
        improves the management of software work products and software process
        quality and enables change-impact analysis); and for interaction
        (examining communications or control-flow relations among model parts,
        including via simulation).
      context: "SWEBOK Guide v4.0a Chapter 11 section 3 (3.1-3.5), printed pages 11-5 to 11-7; model analysis techniques."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 236-238; original paraphrase."
      result: "The five analysis techniques and the stated benefits of traceability were confirmed."
      limitations:
        - "The techniques are named with brief characterizations; the Guide does not prescribe which technique applies to which modeling language."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07A-KA12-QUALITY-OVERLOAD
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07A-SWEBOK-KA12-QUALITY-CONCEPTS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        The SWEBOK v4.0a KA12 introduction states the term software quality is
        overloaded: it may refer to the desirable characteristics of software
        products, to the extent to which a particular software product has
        those characteristics (software product quality), or to the processes,
        tools and techniques used to achieve those characteristics (software
        process quality). The KA surveys definitions — Phil Crosby's
        conformance to requirements, Watts Humphrey's fitness for use, IBM's
        market-driven quality, and definitions under which quality is the
        capability of a software product to satisfy stated and implied needs
        under specified conditions, or the degree to which a software product
        meets established requirements while depending on how accurately those
        requirements represent stakeholder needs, wants and expectations —
        noting both share the premise of conformance to requirements. The KA
        distinguishes software quality from software quality requirements
        ("the -ilities"): quality requirements are attributes of, or
        constraints on, functional requirements. Software process quality is
        observable in process characteristics such as efficiency,
        effectiveness, usability and learnability, and defects in the process
        will likely show up as defects in the resulting software product.
        Section 1 adds that software requirements are expected to define the
        required software quality attributes and influence the measurement
        methods and acceptance criteria for assessing quality, that software
        quality should be planned early and assessed at many milestones during
        the software life cycle, that software quality assurance activities
        must be adapted to accommodate different life cycles such as Agile
        software development, and it defines error, defect (fault) and failure
        as distinct terms per the cited standards; the value-and-costs topic
        frames cost of software quality as conformance cost (appraisal plus
        prevention) and nonconformance cost.
      context: "SWEBOK Guide v4.0a Chapter 12 introduction and section 1 (incl. 1.1-1.2), printed pages 12-1 to 12-4; quality concepts at model level."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 245-248; original paraphrase."
      result: "The three-way term overload, the surveyed definition family, the quality-versus-quality-requirements boundary, the process-quality characteristics and the life-cycle-linked quality planning statements were confirmed."
      limitations:
        - "The definitions are attributed to their authors/organizations within the Guide; recording them is not an endorsement of any single definition."
        - "Model-level scope only: quality assurance and V&V process detail is out of this lane's scope."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07A-KA12-DEPENDABILITY
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07A-SWEBOK-KA12-DEPENDABILITY
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA12 section 1.4 presents software dependability and
        integrity levels: system and software dependability regroups several
        related quality characteristics — availability, reliability,
        maintainability and supportability, safety, and security — as the main
        quality requirement, aside from basic functionality, where system
        failure may have severe consequences. An integrity level is defined as
        a value representing project-unique characteristics (for example
        complexity, criticality, risk, safety level, security level, desired
        performance and reliability) that define the importance of the system,
        software or hardware to the user, and defining integrity levels is
        presented as a method of risk management. An assurance case is
        described as a reasoned, auditable artifact created to support the
        contention that its claims are satisfied, containing claims about
        properties, arguments that logically link the evidence and assumptions
        to the claims, and a body of evidence and assumptions.
      context: "SWEBOK Guide v4.0a Chapter 12 section 1.4 (incl. 1.4.1-1.4.2), printed pages 12-5 to 12-6; model-level composition of quality characteristics."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 249-250; original paraphrase."
      result: "The dependability composition, the integrity-level definition and the assurance-case structure were confirmed."
      limitations:
        - "Model-level claim only; the engineering of individual characteristics (reliability, performance) is out of this lane's scope (SEK-07 lane 07D)."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07A-KA18-ENG-PROCESS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07A-SWEBOK-KA18-ENG-PROCESS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA18 opens with the IEEE definition of engineering as
        the application of a systematic, disciplined, quantifiable approach to
        structures, machines, products, systems or processes, and states that
        as the theory and practice of software engineering mature, it is
        increasingly apparent the discipline is based on skills and knowledge
        common to all engineering disciplines. Section 1 summarizes the
        engineering process, common to all engineering disciplines, as
        necessarily iterative — knowledge gained at any point may be relevant
        to earlier steps, triggering iteration — across the steps: understand
        the real problem (using root cause analysis techniques to discover the
        underlying problem needing a solution, because the problem that needs
        to be solved is not always the problem engineers are asked to solve);
        define the selection criteria; identify all reasonable, technically
        feasible solutions (the best solution is rarely the first that comes
        to mind); evaluate each solution against the selection criteria;
        select the preferred option; and monitor the performance of the
        selected solution, because the process necessarily depends on
        estimates and those estimates can be wrong.
      context: "SWEBOK Guide v4.0a Chapter 18 introduction and section 1, printed pages 18-1 to 18-2; engineering foundations for the lane's process and systems-thinking scope."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 366-367; original paraphrase."
      result: "The IEEE engineering definition, the common-foundations statement and the six-step iterative engineering process were confirmed."
      limitations:
        - "The section is an explicit high-level summary; the KA refers the fuller discussion to the Software Engineering Economics KA."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07A-KA18-DESIGN-ABSTRACTION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07A-SWEBOK-KA18-DESIGN-ABSTRACTION
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA18 sections 2-3 present engineering design and
        abstraction foundations: a product's design will affect or even
        determine its life cycle costs, and software design is guided by the
        features to be implemented and the quality attributes to be achieved;
        in engineering, most problems have many solutions and the focus is
        finding a feasible solution that best meets the needs presented,
        economically; and design problems are generally considered wicked
        problems — per the KA's account, the term coined by Horst Rittel, with
        the McConnell-explained paradox that a wicked problem can be defined
        only by solving it, or solving part of it, so it must be solved once
        to define it clearly and solved again to create a solution that works.
        Abstraction is described as an indispensable problem-solving technique
        — the process and result of generalization that reduces information to
        focus on the big picture; engineers work at levels of abstraction
        connected through encapsulated interfaces, levels may be organized
        into hierarchies, and multiple alternate abstractions of the same
        problem (for example a class diagram, a state chart and a sequence
        diagram at the same level) complement rather than supersede one
        another, though keeping alternate abstractions in sync is sometimes
        difficult.
      context: "SWEBOK Guide v4.0a Chapter 18 sections 2-3 (incl. 2.2 and 3.4), printed pages 18-2 to 18-4; design-as-wicked-problem and alternate-abstraction foundations."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 367-369; original paraphrase."
      result: "The life-cycle-cost effect of design, the quality-attribute guidance for design, the wicked-problem characterization and the alternate-abstraction concept were confirmed."
      limitations:
        - "The KA notes engineering design's scope is generally viewed as broader than software design; the lane uses these foundations only for its process/modeling scope."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07A-SYNTHESIS-UNIVERSAL-LIFECYCLE
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07A-SWEBOK-KA10-FUNDAMENTALS
      evidence_type: SYNTHESIS
      statement: >-
        Lane synthesis (SEK-07A): combining KA10's statement that no ideal
        process or set of processes exists (processes must be selected,
        adapted and applied per project and organizational context), KA10's
        presentation of multiple model families and paradigms (predictive,
        iterative, evolutionary, incremental; waterfall through Agile) with
        named misconceptions about Agile, and KA10's practical-consideration
        lesson that lifecycle discussions should be supported by realistic
        estimations and measurements, mandating one life cycle model
        universally contradicts the inspected sections themselves: model fit
        is presented as contextual and adaptation as a required, documented
        activity. This is not a sentence that appears in SWEBOK.
      context: "Cross-section inference combining verified KA10 statements (sections 1.1, 2.3-2.5 and 2.9); lane-marked synthesis supporting the anti-pattern record."
      method: "Lane-level combination of three verified evidence records from the same knowledge area (se:EVD-07A-KA10-PROCESS-DEFINITION, se:EVD-07A-KA10-LIFECYCLE-MODELS, se:EVD-07A-KA10-STAGES-ADAPTATION)."
      result: "Provides the inference trail motivating se:ANT-07A-UNIVERSAL-LIFECYCLE-MANDATE."
      limitations:
        - "Synthesis inference, not a direct SWEBOK statement."
        - "No empirical case evidence in this lane tests the anti-pattern's consequences."
      uncertainty:
        - "Whether real organizations that mandate a single model always incur the listed consequences is untested in this lane."
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false

  concepts:
    - id: se:CON-07A-SOFTWARE-LIFE-CYCLE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Software life cycle (SWEBOK KA10 sense)
      definition: >-
        The evolution of a software system from conception through retirement;
        in SWEBOK KA10's presentation, the life cycle of a software system
        comprises all processes, activities and tasks from the ideation of the
        system to its retirement, including production, operation and
        evolution, as well as acquisition and supply when needed, considering
        both the business and the technical needs of stakeholders.
      concept_kind: TERM
      synonyms:
        - software development life cycle
      scope_description: "Defined at SWEBOK Guide v4.0a KA10 section 2.1 fidelity for this lane; aligned with the Guide's cited general definitions, not with any normative ISO clause."
      evidence_refs:
        - se:EVD-07A-KA10-LIFECYCLE-STRUCTURE
    - id: se:CON-07A-SLCM
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Software life cycle model (SLCM)
      definition: >-
        A model with which a specific software life cycle is created in
        conformance: a project-specific sequence of activities is produced by
        mapping the activities of a standard onto the selected model. SWEBOK
        KA10 names waterfall, V-model, incremental, spiral and Agile as
        well-known examples and keeps the model concept distinct from the life
        cycle itself.
      concept_kind: TERM
      scope_description: "SWEBOK Guide v4.0a KA10 sections 2.3-2.5 fidelity; used as the Guide defines it, not as any single method brand."
      evidence_refs:
        - se:EVD-07A-KA10-LIFECYCLE-MODELS
    - id: se:CON-07A-SOFTWARE-QUALITY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Software quality (SWEBOK KA12 overloaded sense)
      definition: >-
        An overloaded term spanning, per SWEBOK KA12, the desirable
        characteristics of software products, software product quality (the
        extent a particular product has those characteristics), and software
        process quality (the processes, tools and techniques used to achieve
        those characteristics); the definitions the KA surveys share a
        conformance-to-requirements premise.
      concept_kind: TERM
      scope_description: "SWEBOK Guide v4.0a KA12 introduction fidelity; explicitly a multi-sense term, not a single normative definition."
      evidence_refs:
        - se:EVD-07A-KA12-QUALITY-OVERLOAD
    - id: se:CON-07A-QUALITY-REQUIREMENT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Software quality requirement (the -ilities)
      definition: >-
        An attribute of, or a constraint on, functional requirements — the
        "-ilities" shorthand — distinguished in SWEBOK KA12 from software
        quality itself; software requirements are expected to define the
        required quality attributes and to influence the measurement methods
        and acceptance criteria for assessing quality.
      concept_kind: QUALITY_ATTRIBUTE
      scope_description: "SWEBOK Guide v4.0a KA12 fidelity for model-level use; engineering detail of specific attributes stays out of this lane."
      evidence_refs:
        - se:EVD-07A-KA12-QUALITY-OVERLOAD
    - id: se:CON-07A-ABSTRACTION-LEVELS
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Levels of abstraction and alternate abstractions
      definition: >-
        Per SWEBOK KA18, abstraction reduces information about a concept,
        problem or observable phenomenon to focus on the big picture; work
        proceeds at levels of abstraction connected through encapsulated
        interfaces, the levels may be organized in hierarchies, and multiple
        alternate abstractions of the same problem (for example a class
        diagram, a state chart and a sequence diagram) complement rather than
        supersede one another.
      concept_kind: ABSTRACTION
      scope_description: "SWEBOK Guide v4.0a KA18 sections 3.1-3.4 fidelity, applied here to software engineering modeling."
      evidence_refs:
        - se:EVD-07A-KA18-DESIGN-ABSTRACTION
    - id: se:CON-07A-WICKED-PROBLEM
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Wicked problem (engineering design sense)
      definition: >-
        A problem that can be defined only by solving it, or solving part of
        it: per the account in SWEBOK KA18 (term attributed to Horst Rittel,
        paradox explained via McConnell), a wicked problem must be solved once
        to define it clearly and solved again to create a solution that works;
        design problems are generally considered wicked problems.
      concept_kind: TERM
      scope_description: "SWEBOK Guide v4.0a KA18 section 2.2 fidelity; used for engineering-design foundations, not as a general epistemology claim."
      evidence_refs:
        - se:EVD-07A-KA18-DESIGN-ABSTRACTION

  knowledge_claims:

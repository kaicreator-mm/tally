      statement: >-
        SWEBOK Guide v4.0a KA10 organizes software life cycle processes into
        four categories — technical processes; technical management processes;
        organizational project-enabling processes; and agreement processes —
        and frames a software system's life cycle as comprising all processes,
        activities and tasks from ideation to retirement, including
        production, operation and evolution, as well as acquisition and supply
        when needed.
      claim_kind: TAXONOMY_STATEMENT
      scope_description: "SWEBOK Guide v4.0a Chapter 10 sections 2.1-2.2 (printed pages 10-3 to 10-4); the Guide's process-category taxonomy as presented."
      applicability: "Reference mapping for classifying software engineering processes within the lifecycle lens; not a claim of exhaustive coverage."
      assumptions: []

    - id: se:CLM-07A-ADAPTATION-DOCUMENTED
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      statement: >-
        SWEBOK Guide v4.0a KA10 presents software life cycle adaptation as
        identifying the relevant characteristics of the software system and
        the stakeholders' needs, selecting appropriate standards or
        organization-internal documents, selecting a development strategy/life
        cycle model, stages and processes, and documenting the decisions and
        rationale; the adaptation does not require keeping the provided names

  principles:
    - id: se:PRI-07A-TAILOR-DONT-ADOPT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Select and adapt the life cycle; never adopt a model as a mandate
      statement: >-
        A software life cycle model should be selected and adapted to the
        differential characteristics of the software system, its stakeholders
        and the organization — with the adaptation decisions and their
        rationale documented — rather than any single model being adopted as a
        universal mandate.
      rationale: >-
        SWEBOK KA10 states that no ideal process or set of processes exists
        and that processes must be selected, adapted and applied as
        appropriate for each project and organizational context; it presents
        life cycle adaptation as an explicit activity (identify
        characteristics, select standards/strategy/model/stages/processes,
        document decisions and rationale) that does not require keeping
        standard names or including all processes; and its practical
        considerations add that lifecycle discussions should be supported by
        realistic estimations and measurements.
      scope_description: "Derived within SWEBOK Guide v4.0a KA10 inspected sections (1.1, 2.8, 2.9); professional-BOK generally accepted knowledge, not a universal engineering law."
      applicability: "Teams and organizations choosing or tailoring software life cycle models."
      exceptions:
        - "Contractual or regulatory contexts that prescribe a specific process standard may constrain the adaptation space (recorded here as an exception without admitting the normative text)."
      limitations:
        - "The principle's strength beyond the Guide's presentation is untested in this lane (no empirical case evidence cited)."
      evidence_refs:
        - se:EVD-07A-KA10-PROCESS-DEFINITION
        - se:EVD-07A-KA10-STAGES-ADAPTATION
      claim_refs:
        - se:CLM-07A-NO-UNIVERSAL-PROCESS
        - se:CLM-07A-ADAPTATION-DOCUMENTED
    - id: se:PRI-07A-KEEP-VIEWS-DISTINCT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Keep lifecycle, process and quality lenses distinct but explicitly related
      statement: >-
        Lifecycle models, engineering processes and quality models classify
        the same engineering effort from different perspectives; they should
        be kept as distinct views connected by explicit cross-cutting
        relations rather than merged into one universal hierarchy.
      rationale: >-
        The inspected SWEBOK KAs keep the lenses apart while relating them:
        KA10 carries the process/lifecycle lens, KA12 discusses quality as a
        basic concept appearing across many knowledge areas and distinguishes
        product quality from process quality, and KA11 states models and
        methods span multiple life cycle phases regardless of the type of life
        cycle process model. A single merged tree would erase distinctions the
        sources themselves make.
      scope_description: "SEK-07A lane structuring principle (lane-level synthesis grounded in the inspected section scopes of KA10, KA11 and KA12); it governs how this lane's taxonomy views are modeled."
      applicability: "Knowledge organization of SE process/lifecycle/quality content; usable as a modeling discipline for multi-view engineering taxonomies."
      exceptions: []
      limitations:
        - "A lane-level structuring rationale, not a source sentence; it inherits the coverage limits of the inspected sections."
      evidence_refs:
        - se:EVD-07A-KA11-MODELING-PRINCIPLES
        - se:EVD-07A-KA12-QUALITY-OVERLOAD
      claim_refs:
        - se:CLM-07A-MODELS-STRUCTURE-SE

  practices:
    - id: se:PRA-07A-LIFECYCLE-ADAPTATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Life cycle tailoring with documented rationale
      intent: >-
        Fit the project life cycle to the software system and organization
        instead of adopting a model wholesale, and leave an auditable record
        of the fit decisions.
      description: >-
        Following SWEBOK KA10's adaptation topic: identify the differential
        characteristics of the software system and the stakeholders' needs,
        select the appropriate standards or organization-internal documents,
        select a development strategy/life cycle model, stages and processes,
        and document the decisions and rationale; the adaptation need not keep
        the standard names or include every process.
      preconditions:
        - "Knowledge of the product characteristics (e.g., stakeholders' needs, product size or complexity) and of the organizational context."
        - "Access to candidate standards or internal process documents."
      steps:
        - "Identify the relevant characteristics of the software system and its stakeholders."
        - "Select the appropriate standards or organization-internal documents."
        - "Select the development strategy and life cycle model, the stages and the processes."
        - "Record the adaptation decisions and their rationale; drop or rename elements deliberately rather than silently."
        - "Support the tailored life cycle with metrics/measure definitions that yield realistic process and product estimations and measurements."
      expected_outcomes:
        - "A project life cycle in conformance with a selected model, adapted to the system's characteristics, with documented rationale."
        - "Measurement definitions able to report process and product status during execution."
      risks:
        - "Wrong or uncertain estimations in the context of the life cycle will lead to failure (KA10 practical considerations)."
        - "Working with large processes without producing deliverables along the way increases uncertainty."
      scope_description: "Operationalizes SWEBOK Guide v4.0a KA10 sections 2.8-2.9 at professional-BOK fidelity."
      applicability: "Any project defining or tailoring a software life cycle; normative constraints may bound the tailoring space."
      evidence_refs:
        - se:EVD-07A-KA10-STAGES-ADAPTATION
      claim_refs:
        - se:CLM-07A-ADAPTATION-DOCUMENTED
    - id: se:PRA-07A-GQM-ASSESSMENT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Goal-question-metric style process assessment
      intent: >-
        Ground process-assessment and improvement decisions in empirical
        evidence rather than opinion.
      description: >-
        Following SWEBOK KA10 section 3: set goals that can be measured,
        change something, and then evaluate the effect of the change — an
        improvement has occurred when the evaluation is positive;
        framework-based assessments (process reference model plus process
        assessment model) and Agile retrospectives instantiate the same
        empirical loop.
      preconditions:
        - "A running process whose goals can be stated measurably."
        - "Willingness to introduce a change and re-measure."
      steps:
        - "State the improvement goal in measurable terms."
        - "Define the questions and metrics that will indicate whether the goal is met."
        - "Introduce the planned change."
        - "Evaluate the effect using the defined metrics; retain the change as an improvement only when the evaluation is positive."
      expected_outcomes:
        - "Process decisions (choosing, assessing, improving) supported by empirical evidence."
      risks:
        - "Unrealistic or imprecise measurement definitions undermine the evaluation."
      scope_description: "Operationalizes SWEBOK Guide v4.0a KA10 section 3 (3.1-3.4) at professional-BOK fidelity."
      applicability: "Teams assessing or improving software engineering processes, including retrospective-driven improvement in Agile life cycles."
      evidence_refs:
        - se:EVD-07A-KA10-ASSESSMENT
      claim_refs:
        - se:CLM-07A-ASSESSMENT-EMPIRICAL
    - id: se:PRA-07A-MULTI-VIEW-MODELING
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Multi-perspective modeling with synchronized views
      intent: >-
        Keep different engineering concerns visible in their own views
        instead of overloading a single model.
      description: >-
        Following SWEBOK KA11's modeling principles (model the essentials;
        provide perspective; enable effective communications) and KA18's
        alternate abstractions: for each concern choose a view with its own
        notation and vocabulary, abstract away nonessential information, and
        keep the resulting alternate abstractions complementary and
        synchronized.
      preconditions:
        - "Identified stakeholders and a decision about which aspects or features pose the questions driving the modeling effort."
        - "A chosen modeling notation per view."
      steps:
        - "Determine which aspects or features pose the questions that motivate the model."
        - "Choose the views (e.g., structural, behavioral) appropriate to those concerns."
        - "Model only the essentials in each view, abstracting nonessential information."
        - "Record the assumptions each view makes about its context so reuse can validate them."
        - "Keep alternate abstractions consistent; review synchronization whenever any view changes."
      expected_outcomes:
        - "A set of complementary views whose union describes exactly the selected aspects needed to make the motivating decisions."
      risks:
        - "A single model can give the illusion of complete understanding (KA11 cautions models are abstractions with missing information)."
        - "Keeping alternate abstractions in sync is sometimes difficult (KA18)."
      scope_description: "Operationalizes SWEBOK Guide v4.0a KA11 sections 1.1-1.2 plus KA18 sections 2-3 (alternate abstractions) at inspected-section fidelity."
      applicability: "Modeling software at any life cycle phase; the practice is independent of which life cycle model the project uses."
      evidence_refs:
        - se:EVD-07A-KA11-MODELING-PRINCIPLES
        - se:EVD-07A-KA18-DESIGN-ABSTRACTION
      claim_refs:
        - se:CLM-07A-MODELS-STRUCTURE-SE

  patterns:
    - id: se:PAT-07A-INCREMENTAL-DELIVERY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Incremental delivery within an iterative life cycle
      problem: >-
        Long-running large processes without intermediate deliverables
        increase uncertainty, and product understanding grows while the
        project runs, so a single late delivery compounds estimation error and
        feedback latency.
      context: >-
        A software product whose requirements understanding increases as the
        team works, developed under a life cycle that permits repeated
        cycles; SWEBOK KA10 presents incremental and iterative life cycles and
        continuous development as established paradigms for exactly this
        situation.
      forces:
        - "Early stakeholder feedback versus iteration coordination overhead."
        - "Predictive scope stability versus changing understanding."
        - "Per-iteration deliverable completeness versus overall completeness only after the final iteration."
      solution: >-
        Structure the life cycle as a series of iterations that successively
        add functionality within agreed time frames (an incremental life
        cycle, per the Guide's paradigm definitions), keeping metrics and
        measure definitions realistic so process and product estimations track
        status; in Agile-family models the same structure appears as small
        incremental deliveries with requirements open to change.
      consequences:
        - "Earlier stakeholder feedback and reduced uncertainty compared with working long stretches without deliverables."
        - "The deliverable contains the necessary and sufficient capability to be considered complete only after the final iteration (per the Guide's incremental definition)."
      tradeoffs:
        - "Incremental development requires requirements definition, design, implementation and testing to occur in an overlapping, iterative manner rather than a strict sequence; integration discipline grows with iteration count."
      scope_description: "Grounded in SWEBOK Guide v4.0a KA10 sections 2.4, 2.5 and 2.9 (paradigm definitions and the no-deliverables lesson); one paradigm among several the Guide presents, not a universal prescription."
      evidence_refs:
        - se:EVD-07A-KA10-LIFECYCLE-MODELS
        - se:EVD-07A-KA10-STAGES-ADAPTATION

  anti_patterns:
    - id: se:ANT-07A-UNIVERSAL-LIFECYCLE-MANDATE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Universal life cycle mandate
      symptoms:
        - "One life cycle model (predictive or Agile) is mandated for all projects regardless of system characteristics or organizational context."
        - "Life cycle adoption decisions exist without documented adaptation rationale."
        - "Model-choice debates (e.g., waterfall versus Agile) proceed without realistic estimations or measurements."
      causes:
        - "Treating any process model as universally mandatory rather than as a paradigm to conform to and tailor."
        - "Misconceptions about the chosen model (that Agile is a method in itself; that Agile is faster because no documents are needed; that Agile has a limited or unstructured practice set)."
        - "Skipping the adaptation activity: no identification of characteristics, no deliberate selection of model/stages/processes, no documented rationale."
      consequences:
        - "Process-to-project mismatch: a model's assumptions (e.g., closed requirement sets in predictive cycles) collide with the project's actual change profile."
        - "Wrong or uncertain estimations within the mismatched life cycle lead to failure, per the Guide's practical considerations."
        - "Long stretches without deliverables when large mandated processes produce nothing interim, increasing uncertainty."
      remediation: >-
        Select and adapt the life cycle per SWEBOK KA10: identify the
        system's differential characteristics and stakeholder needs, choose
        and tailor the model, stages and processes, document the decisions and
        rationale, and support the result with realistic estimations and
        measurements; treat model-family debates as empirical questions
        requiring measurement, not identity debates.
      scope_description: "Lane-level characterization grounded in SWEBOK Guide v4.0a KA10 sections 1.1, 2.3-2.5 and 2.9; the counterproductive nature of a universal mandate is a SEK-07A synthesis inference (see se:EVD-07A-SYNTHESIS-UNIVERSAL-LIFECYCLE), not a statement made by the Guide."
      evidence_refs:
        - se:EVD-07A-SYNTHESIS-UNIVERSAL-LIFECYCLE

  decision_models:
    - id: se:DM-07A-LIFECYCLE-MODEL-SELECTION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      decision_question: "Which development life cycle model should a software project conform to, and how should it be tailored?"
      options:
        - "A predictive model (e.g., waterfall or V-model)"
        - "An incremental or iterative model"
        - "An evolutionary, risk-driven model (e.g., spiral)"
        - "An Agile model"
        - "A hybrid: a selected model deliberately tailored to the system's stages and processes"
      criteria:
        - "Requirements stability (closed set versus open to change)."
        - "Need for early risk reduction (risk-driven versus document- or code-driven)."
        - "Ability to deliver usable increments within agreed time frames."
        - "Stakeholder communication cadence and trust."
        - "Product size and complexity; organizational context."
      constraints:
        - "No ideal process exists: the choice must fit the project and organizational context (SWEBOK KA10 section 1)."
        - "Adaptation does not require keeping the standard names or including all processes; decisions and rationale must be documented (KA10 section 2.8)."
        - "The tailored life cycle needs metrics/measure definitions yielding realistic estimations and measurements (KA10 section 2.9)."
      procedure: >-
        Identify the differential characteristics of the software system and
        its stakeholders; assess requirements stability and expected change
        (predictive life cycles assume a closed requirement set;
        Agile-family models claim openness to change); evaluate the candidate
        models against the criteria, using the Guide's paradigm
        characterizations (predictive, iterative, evolutionary, incremental)
        as comparison axes; select and tailor the stages and processes; record
        the selection and adaptation rationale; monitor with realistic
        estimations and measurements and revisit the choice if measurement
        accuracy proves uncertain.
      tradeoffs:
        - "Predictive models fix scope, time and cost early but resist change; incremental and Agile models absorb change but shift effort into iteration coordination and integration; the spiral model adds risk-analysis overhead."
      scope_description: "Structured from SWEBOK Guide v4.0a KA10 sections 1.1 and 2.3-2.9; a professional-BOK decision aid, not a normative selection procedure."
      evidence_refs:
        - se:EVD-07A-KA10-LIFECYCLE-MODELS
        - se:EVD-07A-KA10-STAGES-ADAPTATION
        - se:EVD-07A-KA10-PROCESS-DEFINITION
      claim_refs:
        - se:CLM-07A-LIFECYCLE-VS-MODEL
        - se:CLM-07A-NO-UNIVERSAL-PROCESS

  coverage_gaps:
    - id: se:GAP-07A-ISO-NORMATIVE-LIFECYCLE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Normative lifecycle and quality-model standard content not admitted
      target_scope_ref: se:VIEW-07A-SWEBOK-PROCESS-LIFECYCLE
      gap_kind: SOURCE_GAP
      description: >-
        The registry lists ISO/IEC/IEEE 12207:2026, ISO/IEC/IEEE 15288:2023
        and ISO/IEC 25010:2023 as ACCESS_RESTRICTED metadata-only sources; no
        normative text, clause or characteristic list may be ingested,
        summarized or cited. This lane's lifecycle and quality-model content
        therefore comes exclusively from directly inspected SWEBOK v4.0a
        sections; SWEBOK's own attribution of the process categories to
        ISO/IEC/IEEE 12207:2017 is reported as the Guide's citation, not as
        verified normative content.
      severity: MEDIUM
      coverage_status: OPEN
      impact: >-
        No record in this lane claims ISO normative terminology or the 25010
        quality-model characteristics; cross-checking SWEBOK's lifecycle and
        quality summaries against the normative standards remains impossible
        until a permitted human-access review exists.
      resolution_notes:
        - "Obtain a permitted human review procedure for the standards (or a future open edition) before any normative claim; until then keep the ISO sources bibliographic-only."
      evidence_refs: []

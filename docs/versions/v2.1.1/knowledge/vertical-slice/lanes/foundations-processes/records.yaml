scope_note: >-
  Foundations-processes vertical-slice lane (SEK-07A) grounded in directly
  reinspected sections of the SWEBOK Guide v4.0a: KA10 Software Engineering
  Process (sections 1-3: process fundamentals, life cycles and life cycle
  models, management/adaptation, process assessment), KA11 Software Engineering
  Models and Methods (introduction, modeling sections 1 and 3, at model level),
  KA12 Software Quality (introduction and fundamentals sections 1.1-1.4 at
  quality-model level), and KA18 Engineering Foundations (sections 1-3). The
  lane keeps lifecycle, process and quality as distinct taxonomy views related
  by explicit cross-cutting edges; no process model is treated as universally
  mandatory. ISO/IEC/IEEE 12207/15288 and ISO/IEC 25010 remain metadata-only
  registry sources; no normative ISO content is cited. CS2023 carries no
  knowledge unit for this scope, so no CS2023 content records are admitted.
  All knowledge records remain PROPOSED or PENDING_REVIEW; none is ACCEPTED.
  Source entities are not stored in this lane file; the validation harness
  derives them from SOURCE_REGISTRY.yaml.
review_policy: "No record is ACCEPTED until a human reviewer verifies source, locator, interpretation, applicability and rights."

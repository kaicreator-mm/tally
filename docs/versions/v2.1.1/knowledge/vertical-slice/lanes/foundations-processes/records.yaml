      claim_kind: DEFINITION
      scope_description: "SWEBOK Guide v4.0a Chapter 10 sections 2.3-2.5 (printed pages 10-5 to 10-7); professional-BOK definitions and paradigm characterizations."
      applicability: "Terminology mapping for lifecycle-model discussions grounded in this lane; other sources may use the terms differently."

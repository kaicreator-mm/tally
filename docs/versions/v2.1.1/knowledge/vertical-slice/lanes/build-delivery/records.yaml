  principles:
    - id: se:PRI-07E-BUILD-FROM-CONTROLLED-SOURCE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Build and deliver from one controlled source
      statement: >-
        Integration and delivery outputs should be produced by building the
        correct versions of the configuration items with the appropriate
        configuration data from a single controlled code source — with the
        supporting tools and build instructions under configuration control —
        so that what is verified is what is delivered and previous releases
        can be reproduced.
      rationale: >-
        SWEBOK KA6 section 2.2 requires environments to be coherent and
        synchronized with production and reports the DevOps recommendation
        that environments be automated and built from a single code repository
        (single source of truth); SWEBOK KA8 section 6.1 defines building as
        constructing the correct SCI versions with appropriate configuration
        data, requires the ability to reproduce previous releases, and places
        supporting tools and build instructions under SCM control for exact
        rebuilds.
      scope_description: "Derived within the scope of the inspected SWEBOK KA6 2.2 and KA8 6.1 sections; professional-BOK grounded but not asserted as a universal law of delivery."
      applicability: "Products delivered through multi-environment pipelines where verification results must transfer to production and past versions may need re-creation."
      exceptions:
        - "Deliverables with no expected re-creation need (one-shot disposables) weaken the reproduction element, though the single-source element still applies."
      limitations:
        - "No empirical evidence in this lane tests the principle's effect on delivery outcomes (see se:GAP-07E-NO-EMPIRICS)."
        - "The single-repository automation element is presented in KA6 as a DevOps recommendation; the principle inherits that scoping."
      evidence_refs:
        - se:EVD-07E-SWEBOK-KA6-ENVIRONMENTS
        - se:EVD-07E-SWEBOK-KA8-BUILDING

  practices:
    - id: se:PRA-07E-CI-PIPELINE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Continuous-integration pipeline over the shared source
      intent: >-
        Give the team early, automated, ground-truth indication of whether the
        current shared head/trunk revision builds and passes basic tests.
      description: >-
        Run an automated pipeline that is triggered when changes are committed
        to the shared source-control repository: retrieve a fresh copy of the
        complete source, compile and link, run the configured automated checks
        (static analysis of coding standards, unit tests, coverage metrics,
        documentation extraction as configured), and pass the resulting
        artifacts to the release management process, recording build and test
        results as the shared-code ground truth.
      preconditions:
        - "A shared source-control repository with monitoring capability."
        - "An automated build for the project and at least basic automated tests."
        - "Agreement on which branch/area of the repository triggers the pipeline."
      steps:
        - "Monitor the source control system for changes committed to the target branch or area."
        - "On commit, retrieve a fresh copy of the complete source code."
        - "Execute the commands to compile and link the code."
        - "Run the configured automated checks (static analysis, unit tests, coverage, documentation extraction)."
        - "Record build and test outcomes as the ground-truth state of the shared code; pass resulting artifacts to the release management process."
      expected_outcomes:
        - "Every committed change receives automated build-plus-test feedback on a fresh copy of the source."
        - "The current head/trunk state (build and test success) is visible to the team without manual verification."
        - "Build artifacts are produced consistently and flow to release management."
      risks:
        - "Slow pipelines delay feedback and can discourage frequent integration."
        - "Non-hermetic builds may pass locally but behave differently in the pipeline (hermeticity is one of the curriculum's named build-systems values)."
        - "Unstable automated checks erode trust in the ground-truth signal."
      scope_description: "Operationalizes the SWEBOK KA8 6.1 commit-triggered pipeline description at BOK fidelity, with the CS2023 SE-Tools CI topic and ground-truth outcome as curriculum anchor; not a vendor-specific pipeline recipe."
      applicability: "Teams with a shared repository and automated build capability; the configured checks scale with project context."
      evidence_refs:
        - se:EVD-07E-SWEBOK-KA8-BUILDING
        - se:EVD-07E-CS2023-TOOLS-KU
      claim_refs:
        - se:CLM-07E-CI-PIPELINE-TRIGGER
        - se:CLM-07E-CI-PRELIMINARY-VALIDATION
    - id: se:PRA-07E-REHEARSED-ROLLBACK
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Planned and rehearsed rollback before production deployment
      intent: >-
        Ensure a production deployment that causes defects or degradation can
        be quickly and easily returned to a working state.
      description: >-
        Before a new version is deployed to production, develop a rollback and
        data migration plan as part of release risk assessment and rehearse
        the rollback; where automation is available, let automated surveillance
        trigger the rollback when the deployed change fails its validation
        period.
      preconditions:
        - "A release or version whose deployment risk has been assessed."
        - "A defined rollback path (environment-based or application-based release strategy) covering the software and its data."
        - "Capability to execute and rehearse the rollback before production deployment."
      steps:
        - "Assess the risk of the given release during release/version planning."
        - "Develop the rollback and data migration plan covering the new version and its database changes."
        - "Rehearse the rollback before deploying the new version to production."
        - "After deployment, monitor the deployed change through its validation period and trigger the rehearsed rollback when problems arise."
      expected_outcomes:
        - "Production incidents from a new version can be answered by a rehearsed, quick return to the previous working state."
      risks:
        - "Data migrations without a rehearsed reverse path can make rollback impossible even when the plan exists."
        - "Unrehearsed rollback plans fail under incident pressure."
      scope_description: "Operationalizes SWEBOK KA6 sections 3.3 and 2.1.1 at BOK fidelity; the automation element reflects the section's DevOps framing."
      applicability: "Production deployments whose failure or degradation would require restoring the previous state."
      evidence_refs:
        - se:EVD-07E-SWEBOK-KA6-ROLLBACK
        - se:EVD-07E-SWEBOK-KA6-RELEASE-PLANNING
      claim_refs:
        - se:CLM-07E-ROLLBACK-REHEARSED
    - id: se:PRA-07E-ENV-AUTOMATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Environment parity through automated single-source builds
      intent: >-
        Make development, testing/QA, preproduction and production
        environments coherent and synchronized so verification results
        transfer to production.
      description: >-
        Define the delivery-path environments (development, testing/QA,
        preproduction, production), automate their creation, and build them
        from a single code repository so all environments share the same code
        source (single source of truth) and stay synchronized with the
        production environment — the direction SWEBOK KA6 2.2 associates with
        infrastructure as code.
      preconditions:
        - "Identified environment stages along the delivery path."
        - "Environment definitions that can be expressed and executed as code."
        - "A single code repository holding environment and product sources."
      steps:
        - "Identify the environments needed at the project's stages (development, testing/QA, preproduction, production)."
        - "Express environment creation as automated, code-controlled definitions."
        - "Build all environments from the same single code source."
        - "Keep environments synchronized with the production environment as changes land."
      expected_outcomes:
        - "Verification performed in a non-production environment reflects the production environment's configuration."
        - "Environment drift becomes visible as code divergence rather than undocumented difference."
      risks:
        - "Full production parity can be constrained by external systems or licensing not expressible as code."
        - "Automated environment maintenance itself becomes a deliverable that must be staffed."
      scope_description: "Operationalizes SWEBOK KA6 section 2.2 at BOK fidelity; the automation/single-source element is the section's DevOps recommendation."
      applicability: "Multi-environment delivery pipelines; strongest where environment definitions are fully code-expressible."
      evidence_refs:
        - se:EVD-07E-SWEBOK-KA6-ENVIRONMENTS
      claim_refs:
        - se:CLM-07E-ENV-SINGLE-SOURCE

  patterns:
    - id: se:PAT-07E-PIPELINE-GATED-DELIVERY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Commit-triggered pipeline with gated artifact promotion
      problem: >-
        Changes integrated into a shared source need automated build-and-test
        verification before their artifacts flow toward delivery, and verified
        artifacts need to be packaged with their contents documented and
        deployed into environments consistently.
      context: >-
        A multi-developer project with a shared source-control repository and
        a delivery path of environments (verification and production), as
        described in the SWEBOK KA8 6.1/6.2 continuous-integration and
        continuous-delivery pipeline descriptions and the CS2023 SE-Tools
        build-systems/CI topics.
      forces:
        - "Verification freshness: every commit should be checked, not only scheduled integration points."
        - "Reproducibility: the build must construct correct CI versions with appropriate configuration data so artifacts can be re-created."
        - "Verification depth versus speed: more checks slow the pipeline while faster feedback favors fewer."
        - "Artifact provenance: packaged contents must be known and traceable (SBOM, version description documentation)."
        - "Recovery safety: promotion should preserve a way back (rollback support)."
      solution: >-
        Establish a pipeline that is initiated automatically on every commit
        to the target branch: retrieve a fresh copy of the complete source,
        build with the appropriate configuration data, run the configured
        automated checks (static analysis, unit tests, coverage), produce
        versioned artifacts with their contents documented (for example an
        SBOM and release documentation), and promote the packaged artifacts
        into an environment for verification or production use only through
        the pipeline's gates.
      consequences:
        - "The current head/trunk build-and-test state is continuously available as ground truth for the shared code."
        - "Delivered artifacts carry documented contents and reproducible provenance."
        - "Promotion decisions and verification results are tied to specific built versions."
      tradeoffs:
        - "Pipeline construction and maintenance cost is traded for manual-verification reduction."
        - "Heavier gate checks increase confidence but delay delivery feedback."
      scope_description: "Pattern packaging is lane-level structure over the directly inspected SWEBOK KA8 6.1/6.2 pipeline descriptions and the CS2023 SE-Tools CI/build topics; it is not a named pattern in either source."
      evidence_refs:
        - se:EVD-07E-SWEBOK-KA8-BUILDING
        - se:EVD-07E-SWEBOK-KA8-RELEASE-MGMT

  anti_patterns:
    - id: se:ANT-07E-MANUAL-HANDOFF-DEPLOYMENT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Manual hand-off deployment
      symptoms:
        - "A finished application is transferred from the development team to a separate operations team that performs the deployment."
        - "Deployment steps are executed mostly by hand rather than through automated steps."
        - "Deployment outcomes differ run to run and depend on who executes them."
      causes:
        - "Organizational separation of development from deployment responsibility."
        - "Deployment steps (packaging, configuration, server and database setup, installation, launch, smoke testing) not automated."
      consequences:
        - "SWEBOK KA6 3.2 characterizes the resulting processes as inefficient from both time and quality perspectives."
        - "Slow, irregular deployments delay the availability of fixes and features."
        - "Manual steps introduce variation that undermines verification results obtained earlier in the pipeline."
      remediation: >-
        Automate the deployment steps — packaging the code, generating
        configuration files, restarting servers, configuring servers and
        databases, installing the software, launching execution and executing
        smoke testing — as SWEBOK KA6 3.2 reports under DevOps, keeping the
        deployment executable by the same pipeline that built and verified the
        artifacts.
      scope_description: "The counterproductive characterization is directly stated in SWEBOK KA6 section 3.2 (inefficient in time and quality); the anti-pattern packaging (symptoms/causes/remediation structure) is lane-level arrangement of that inspected contrast, not a named anti-pattern in the source."
      evidence_refs:
        - se:EVD-07E-SWEBOK-KA6-DEPLOY-RELEASE

  decision_models:
    - id: se:DEC-07E-RELEASE-STRATEGY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      decision_question: "Which release strategy should a team use to reduce the risk of deploying a change to production?"
      options:
        - "Environment-based release: deploy the new version to a staging environment before wider release"
        - "Application-based release: ship with feature toggles that enable or disable code sections via configuration"
        - "Canary release: partial, time-limited deployment of the change with an evaluation deciding whether to proceed"
        - "Direct full deployment without a staged strategy"
      criteria:
        - "Ability to evaluate the change before complete exposure."
        - "Rollback support (both strategy categories can support rollback per SWEBOK KA6 3.3)."
        - "Blast radius if the change misbehaves."
        - "Infrastructure and environment cost of maintaining the strategy."
        - "Speed of feedback to the team."
      constraints:
        - "A planned and rehearsed rollback must exist before production deployment (SWEBOK KA6 3.3)."
        - "Release risk is assessed during release/version planning, together with the rollback and data migration plan (SWEBOK KA6 2.1.1)."
        - "Once deployed to the targeted production environment, making the feature available to users is a business decision (SWEBOK KA6 3.2)."
      procedure: >-
        Assess the risk of the given release in release/version planning;
        classify the candidate approaches into the environment-based and
        application-based families and weigh them against the criteria
        (evaluation before full exposure, rollback support, blast radius,
        cost, feedback speed); select the strategy (or a combination); define
        the evaluation window and observation for staged exposure; define and
        rehearse the rollback and data migration plan; obtain the business
        release decision before making features available to users.
      tradeoffs:
        - "Staged strategies reduce risk but add environment or configuration complexity and delay full availability."
        - "Feature toggles decouple deployment from release but add configuration management burden of their own."
      scope_description: "Structured from SWEBOK Guide v4.0a KA6 sections 3.2, 3.3 and 2.1.1; a curriculum-free professional-BOK decision aid that structures judgment rather than deciding automatically."
      evidence_refs:
        - se:EVD-07E-SWEBOK-KA6-DEPLOY-RELEASE
        - se:EVD-07E-SWEBOK-KA6-ROLLBACK
        - se:EVD-07E-SWEBOK-KA6-RELEASE-PLANNING
      claim_refs:
        - se:CLM-07E-RELEASE-STRATEGY-FAMILIES
        - se:CLM-07E-ROLLBACK-REHEARSED
        - se:CLM-07E-RELEASE-PLANNING-TASKS


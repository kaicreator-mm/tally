scope_note: >-
  Integration, build, CI/CD and delivery vertical-slice lane (SEK-07E) grounded in
  directly inspected SWEBOK Guide v4.0a KA6 Software Engineering Operations
  sections (2.1.1 Operations Plan release planning, 2.2 Development and
  Operational Environments, 3.2 Deployment/Release Engineering, 3.3 Rollback and
  Data Migration), SWEBOK KA8 Software Configuration Management sections
  (1.3-1.4 SCM planning incl. the continuous-integration characterization,
  2.5-2.6 relationships/SBOM and software libraries, 6 with 6.1 Software
  Building and 6.2 Software Release Management), and the CS2023 Software
  Engineering knowledge unit SE-Tools: Tools and Environments (build systems,
  continuous integration, dependency management, release management topics).
  Configuration-management theory beyond build/integration boundaries,
  implementation practices, reliability/SRE operations detail, maintenance
  evolution and planning/estimation stay in their sibling lanes. All knowledge
  records remain PROPOSED or PENDING_REVIEW; none is ACCEPTED. Source entities
  are not stored in this lane file; the validation harness derives shared Source
  records from SOURCE_REGISTRY.yaml.
review_policy: "No record is ACCEPTED until a human reviewer verifies source, locator, interpretation, applicability and rights."

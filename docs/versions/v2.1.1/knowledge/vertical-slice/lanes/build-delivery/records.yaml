    - id: se:EVD-07E-SWEBOK-KA6-RELEASE-PLANNING
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07E-SWEBOK-KA6-RELEASE-PLANNING
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA6 section 2.1.1 states that once individual requests are
        received and validated, the release or version planning activity
        requires operations engineers to identify the target availability dates
        of individual requests, agree on the content of subsequent releases or
        versions, identify potential conflicts and develop alternatives, assess
        the risk of a given release and develop a rollback and data migration
        plan in case problems arise, and inform all stakeholders.
      context: "SWEBOK Guide v4.0a Chapter 6 subsection 2.1.1, printed page 6-7."
      method: "Direct inspection of the official SWEBOK v4.0a PDF (SHA-256 0c9db4da0b2425c58cf778b99131eb31bb6c188e98b67163a549a1366d96e511) on 2026-11-07; text extracted at the verified page index and paraphrased originally."
      result: "The release/version planning task list was confirmed for the professional-BOK scoped claim."
      limitations:
        - "The section describes the planning activity from the operations engineer's role; it does not prescribe a universal release-planning procedure for all contexts."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07E-SWEBOK-KA6-ENVIRONMENTS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07E-SWEBOK-KA6-ENVIRONMENTS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA6 section 2.2 describes the overall software process as
        requiring different environments at different stages — typically the
        development environment, the testing or quality assurance environment,
        the preproduction environment and the production environment — and
        states that to build quality into the product and reduce the risks of
        releasing software in production, engineers must ensure the different
        environments are coherent and synchronized with the production
        environment. It reports that DevOps recommends the creation of all the
        different environments be automated and built from a single code
        repository, that in mature DevOps organizations environment creation is
        completely automated and available as a service, and that all
        environments need to be built from the same code source (single source
        of truth), which leads to the concept of infrastructure as code.
      context: "SWEBOK Guide v4.0a Chapter 6 subsection 2.2, printed pages 6-7 to 6-8."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The environment typology, the coherence/synchronization requirement and the single-source automation recommendation were confirmed."
      limitations:
        - "The single-repository and automation recommendation is presented by the Guide as a DevOps recommendation, not as a universally mandated practice."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07E-SWEBOK-KA6-DEPLOY-RELEASE
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07E-SWEBOK-KA6-DEPLOY-RELEASE
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA6 section 3.2 defines deployment as the installation of
        a specified version of software to a given environment (for example an
        integration test environment or production) and release as making a
        feature or set of features available to all customers or a segment of
        customers. It lists release control activities from ISO/IEC/IEEE 12207
        (identify and record release requests, identify the software system
        elements in a release, approval, and tracking releases in their
        specified environments). It contrasts traditional processes — an
        application ready for deployment is transferred from a development team
        to an operations team responsible for deployment that is mostly done
        manually, which the Guide characterizes as inefficient from both time
        and quality perspectives — with the DevOps call to automate the
        deployment steps: packaging the code, generating configuration files,
        restarting servers, configuring servers and databases, installing the
        software on the servers, launching execution, and smoke testing. It
        groups risk-reducing release engineering strategies into
        environment-based strategies (deploying the new version to a staging
        environment) and application-based strategies (toggles such as feature
        toggles enabling or disabling code sections via configuration
        parameters). It describes the canary release testing technique as a
        partial, time-limited deployment of a change with an evaluation that
        helps decide whether to proceed with complete deployment, notes tools
        that observe newly started software and automatically roll back changes
        that do not pass the validation period, and states that once the
        application platform is deployed in the targeted production
        environment, the decision to make it available to users (release it)
        becomes a business decision.
      context: "SWEBOK Guide v4.0a Chapter 6 subsection 3.2, printed page 6-10."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page index; original paraphrase."
      result: "The deployment/release definitions, release control activities, the manual-vs-automated deployment contrast, the two release strategy families, the canary technique and the business-decision framing were confirmed."
      limitations:
        - "The section characterizes traditional manual hand-off processes as inefficient without citing quantitative evidence in the inspected text."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07E-SWEBOK-KA6-ROLLBACK
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07E-SWEBOK-KA6-ROLLBACK
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA6 section 3.3 describes rollback and data migration as
        the terms used for the process of returning software and its database
        to a state where they work properly, and states that software engineers
        ensure that when a new version of the software and its databases have
        been modified and deployed to production, they can easily and quickly
        be rolled back in case the new version causes defects or product
        degradation; this means a planned and rehearsed rollback is done before
        a new version is deployed in production. It adds that DevOps processes
        automate the process, that automated surveillance can trigger rollback
        and data migration to a previous state so quickly the end user does not
        notice the problem, and that both release strategy categories
        (environment-based and application-based, from section 3.2) can be used
        to support rollback.
      context: "SWEBOK Guide v4.0a Chapter 6 subsection 3.3, printed pages 6-10 to 6-11."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The rollback definition, the rehearse-before-deploy requirement, the automation/surveillance note and the strategy-category linkage were confirmed."

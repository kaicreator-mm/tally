    - id: se:EVD-07E-SWEBOK-KA8-PLANNING-CI
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07E-SWEBOK-KA8-PLANNING
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA8 section 1.3 directs that branching and merging
        strategies be carefully planned and communicated because they affect
        many SCM activities, defining a branch as a set of evolving source file
        versions and merging as combining different changes to the same file.
        It notes that the chosen software development life cycle model affects
        SCM activities — for instance, many software development approaches use
        continuous integration, which is characterized by frequent
        build-test-deploy cycles, so SCM activities must be planned
        accordingly — and section 1.4 records that the SCM plan is a living
        document whose subordinate procedures define, among day-to-day
        matters, which branching strategies will be used, how frequently builds
        will occur, and how often automated tests of all kinds will be run.
      context: "SWEBOK Guide v4.0a Chapter 8 subsections 1.3 and 1.4, printed pages 8-3 to 8-5."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The branching/merging planning rule, the continuous-integration characterization and the SCMP subordinate-procedure examples were confirmed."
      limitations:
        - "The build-test-deploy cycle phrase is the Guide's characterization of CI at planning level; the section does not prescribe specific tooling or pipeline structure."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07E-SWEBOK-KA8-LIBRARIES
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07E-SWEBOK-KA8-LIBRARIES
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA8 section 2.5 defines a Software Bill of Materials
        (SBOM) as a formal record containing the details and supply chain
        relationships of the CIs used in building software, with SBOM CIs
        frequently called components — source code, libraries, modules and
        other artifacts that can be open source or proprietary, free or paid —
        and notes that relationships between CIs can be tracked in an SBOM.
        Section 2.6 defines a software library as a controlled collection of
        source code, scripts, object code, documentation and related artifacts,
        states that source code is stored in a version control system providing
        traceability and security for the baselines developed and that multiple
        development streams are supported in version control systems linked to
        the binary objects derived during the build process, which are
        typically stored in a repository that should contain cryptographic
        hashes used to perform the physical configuration audit. It also states
        that the definitive media library contains the release baseline(s) of
        the artifacts that can be deployed to the test, stage and production
        systems, and that the release management process depends on these
        software libraries to manage the artifacts deployed.
      context: "SWEBOK Guide v4.0a Chapter 8 subsections 2.5 and 2.6, printed pages 8-8 to 8-9."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The SBOM definition, the software library/definitive media library roles and the release-management dependency on libraries were confirmed."
      limitations:
        - "The section names library concepts and roles; it does not prescribe a specific repository or artifact-store architecture."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07E-SWEBOK-KA8-BUILDING
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07E-SWEBOK-KA8-BUILDING
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA8 section 6 frames release as distributing software and
        related artifacts outside the development activity, including internal
        releases and distribution to customers, and states that when different
        versions of a software item are available for delivery, re-creating
        specific versions and packaging the correct materials for version
        delivery are frequently necessary, with the software library a key
        element in release and delivery tasks. Section 6.1 defines software
        building as constructing the correct versions of SCIs, using the
        appropriate configuration data, into a software package for delivery to
        a customer or other recipient such as a testing team; build instructions
        help ensure the proper build steps are taken in the correct sequence;
        in addition to building for new releases, SCM must usually be able to
        reproduce previous releases for recovery, testing, maintenance or
        additional release purposes; and to rebuild an exact copy of a
        previously built SCI, supporting tools and associated build
        instructions must be under SCM control to ensure availability of the
        correct tool versions. It notes that the build process and products are
        often subject to software quality verification, that build outputs may
        become records of quality, security or regulatory compliance, and that
        the SBOM listing the artifacts included in the build is an important CM
        output. On continuous integration it states that software building is
        performed automatically when changes to CIs are committed to a source
        control repository: tools running on a local or cloud-based server
        monitor the project's source control system and initiate a pipeline of
        steps undertaken every time a change is committed to a particular
        branch, configured to retrieve a fresh copy of the complete source code
        and execute the necessary commands to compile and link the code, often
        combined with steps to validate coding standards via automated static
        analysis, execute unit tests, determine code coverage metrics, or
        extract documentation from the source code, with the resulting
        artifacts then deployed through the release management process.
      context: "SWEBOK Guide v4.0a Chapter 8 section 6 introduction and subsection 6.1, printed page 8-13."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page index; original paraphrase."
      result: "The building definition, the reproduction and tool-control requirements, the SBOM-as-build-output note and the commit-triggered pipeline description were confirmed."
      limitations:
        - "The pipeline description is a generally accepted characterization, not a mandate of specific pipeline stages for every project."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07E-SWEBOK-KA8-RELEASE-MGMT
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07E-SWEBOK-KA8-RELEASE-MGMT
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA8 section 6.2 states that software release management
        encompasses the identification, packaging and delivery of the elements
        of a product (for example an executable program, documentation, release
        notes or configuration data), and that given product changes can occur
        continually, one concern is determining when to issue a release, with
        the severity of the problems addressed by the release and measurements
        of the fault densities of prior releases affecting this decision. The
        packaging task identifies which product items are to be delivered and
        selects the correct variants for the product's intended application;
        the information documenting the physical contents of a release is the
        version description document (VDD); release notes describe new
        capabilities, known problems and platform requirements; the package
        contains installation or upgrade instructions, complicated by users
        holding versions several releases old; release management may need to
        track the product's distribution to customers or target systems, and a
        mechanism to help ensure the released item's integrity (for example a
        digital signature) can be implemented. On continuous delivery it states
        that a pipeline is established to build software continuously as
        described in 6.1, and the resulting build artifacts — executable code
        and libraries — can be combined into an installation package and
        deployed into an environment for verification or production use.
      context: "SWEBOK Guide v4.0a Chapter 8 subsection 6.2, printed pages 8-13 to 8-14."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The release management scope, the when-to-release criteria, the VDD/release-notes/packaging elements, the integrity mechanism and the continuous-delivery pipeline were confirmed."
      limitations:
        - "The section describes generally accepted release management activities; fault-density-driven release timing is presented as an influence on the decision, not a formula."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07E-SYNTHESIS-CI-ALIGNMENT
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07E-CS2023-SE-TOOLS-KU
      evidence_type: SYNTHESIS
      statement: >-
        Lane synthesis (SEK-07E): the CS2023 SE-Tools learning outcome that
        positions CI systems as a ground-truth for the state of the team's
        shared code (build and test success) and the SWEBOK KA8 description of
        CI as commit-triggered automated building with compile, link and
        automated checks align on the same function — automated build-plus-test
        verification of the current shared head/trunk — even though the two
        sources express it at different authority levels (curriculum outcome vs
        professional-BOK process description). This combined reading is not a
        sentence that appears in either source.
      context: "Cross-source inference combining one CS2023 learning outcome (outcome 5 of SE-Tools) with the SWEBOK KA8 6.1 continuous-integration description; explicitly a lane-level synthesis."
      method: "Lane-level comparison of two verified evidence records (se:EVD-07E-CS2023-TOOLS-OUTCOMES and se:EVD-07E-SWEBOK-KA8-BUILDING) from two different permitted sources."
      result: "Provides the inference trail for the alignment claim se:CLM-07E-CI-ALIGNMENT-SYNTHESIS."
      limitations:
        - "Synthesis inference, not a statement in either source."
        - "Alignment of function does not establish that either source endorses the other's authority level."
      uncertainty:
        - "Whether every practice described as CI in industry matches this aligned function is untested in this lane."
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false

  concepts:
    - id: se:CON-07E-CONTINUOUS-INTEGRATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Continuous Integration (SWEBOK KA8 / CS2023 dual-anchored sense)
      definition: >-
        A working practice in which changes committed to a shared source-control
        repository automatically trigger building the software and running
        automated checks: SWEBOK KA8 6.1 describes tools monitoring the
        repository that initiate a pipeline retrieving a fresh copy of the
        complete source, compiling and linking, often combined with automated
        static analysis, unit tests and coverage metrics; CS2023 SE-Tools
        characterizes CI as the use of automation and automated tests to do
        preliminary validation that the current head/trunk revision builds and
        passes basic tests.
      concept_kind: MECHANISM
      synonyms:
        - CI
      scope_description: "Defined at the fidelity of the two inspected anchors (SWEBOK v4.0a KA8 section 6.1 and CS2023 SE-Tools KA Core topic 4b); not asserted as a single canonical industry definition."
      applicability: "Teams with a shared source-control repository and automated build capability."
      evidence_refs:
        - se:EVD-07E-SWEBOK-KA8-BUILDING
        - se:EVD-07E-CS2023-TOOLS-KU
    - id: se:CON-07E-DEPLOYMENT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Deployment (SWEBOK KA6 sense)
      definition: >-
        The installation of a specified version of software to a given
        environment, such as deploying code into an integration test
        environment or deploying code in production, as defined in SWEBOK KA6
        section 3.2.
      concept_kind: TERM
      scope_description: "SWEBOK Guide v4.0a KA6 section 3.2 terminology scope; distinct from the release concept recorded separately."
      applicability: "Environment-oriented delivery discussions anchored in the inspected SWEBOK sections."
      evidence_refs:
        - se:EVD-07E-SWEBOK-KA6-DEPLOY-RELEASE
    - id: se:CON-07E-RELEASE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Release (two recorded SWEBOK senses)
      definition: >-
        The term release carries two recorded senses in the SWEBOK sections
        this lane inspected: KA6 section 3.2 — making a feature or set of
        features available to all customers or a segment of customers, which
        becomes a business decision once the platform is deployed in the
        targeted production environment; and KA8 section 6 — distributing
        software and related artifacts outside the development activity,
        including internal releases and distribution to customers. Both senses
        are recorded side by side; this lane does not merge them into one
        definition.
      concept_kind: TERM
      synonyms: []
      scope_description: "Terminological variance preserved across SWEBOK Guide v4.0a KA6 section 3.2 and KA8 section 6; the variance itself is asserted by se:CLM-07E-SWEBOK-RELEASE-TERM-VARIANCE."
      applicability: "Reading delivery-related SWEBOK-derived records; sense must be disambiguated per context."
      evidence_refs:
        - se:EVD-07E-SWEBOK-KA6-DEPLOY-RELEASE
        - se:EVD-07E-SWEBOK-KA8-RELEASE-MGMT
    - id: se:CON-07E-REPRODUCIBLE-BUILD
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Reproducible build
      definition: >-
        A build outcome in which the correct versions of the software
        configuration items are constructed with the appropriate configuration
        data such that a specific version can be re-created: SWEBOK KA8 6.1
        requires the ability to reproduce previous releases and places
        supporting tools and build instructions under SCM control so an exact
        copy of a previously built item can be rebuilt; CS2023 SE-Tools names
        reproducible builds/configuration as a core SCM-and-version-control
        topic.
      concept_kind: TERM
      synonyms: []
      scope_description: "Grounded in SWEBOK Guide v4.0a KA8 section 6.1 and CS2023 SE-Tools CS Core topic 1a; describes the SCM-side re-creation capability, not bit-level build determinism standards."
      applicability: "Build and release processes that must re-create specific past versions."
      evidence_refs:
        - se:EVD-07E-SWEBOK-KA8-BUILDING
        - se:EVD-07E-CS2023-TOOLS-KU
    - id: se:CON-07E-SBOM
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Software Bill of Materials (SBOM)
      definition: >-
        A formal record containing the details and supply chain relationships
        of the configuration items (components: source code, libraries,
        modules and other artifacts, open source or proprietary) used in
        building software, as defined in SWEBOK KA8 section 2.5; KA8 section
        6.1 names the SBOM listing the artifacts included in the build as an
        important configuration management output.
      concept_kind: TERM
      synonyms:
        - SBOM
      scope_description: "SWEBOK Guide v4.0a KA8 sections 2.5 and 6.1 terminology scope; format standards for SBOMs are outside this lane's inspected sections."
      applicability: "Build-output inventory and supply-chain traceability discussions anchored in the inspected sections."
      evidence_refs:
        - se:EVD-07E-SWEBOK-KA8-LIBRARIES
        - se:EVD-07E-SWEBOK-KA8-BUILDING


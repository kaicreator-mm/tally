        configuring servers and databases, installing the software, launching
        execution, and executing smoke testing).
      claim_kind: PRACTICE_CLAIM
      scope_description: "SWEBOK Guide v4.0a KA6 section 3.2 (printed page 6-10); a characterization in the professional BOK of generally accepted content, given without quantitative evidence in the inspected text."

  evidence_records:
    # --- CS2023 SE-Reliability evidence (heading-anchored KU locator) ---
    - id: se:EVD-07D-CS2023-SE-RELIABILITY-KU
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07D-CS2023-SE-RELIABILITY-KU
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        The CS2023 SE-Reliability knowledge unit comprises six KA Core topics
        (the reliability concept; identifying reliability requirements for
        different kinds of software; defects as the cause of failures and the
        minimum-defect goal; software reliability versus system reliability and
        failure behavior; the defect injection and removal cycle; and comparing
        the error-budget approach with the error-free approach) and five
        Non-core topics (software reliability models; fault tolerance techniques
        and models; software reliability engineering practices; dependent and
        independent failure domains; measurement-based analysis of software
        reliability). Its KA Core illustrative learning outcomes include
        determining the level of reliability a system requires, explaining the
        problems in achieving very high reliability, and understanding
        fault-minimization approaches applicable at each lifecycle stage.
      context: "SE knowledge unit 'SE-Reliability: Software Reliability'; curriculum topic structure, KA Core topics 1-6 and Non-core topics 7-11."
      method: "Read the SE-Reliability unit topic list in the official Body of Knowledge full text obtained via a text-extraction service on 2026-11-07; heading-anchored KU locator inside the registry-verified SE section page span."
      result: "The unit's topic inventory and learning outcomes were confirmed for the taxonomy-node definition and for scoping which topics are core versus elective."
      limitations:
        - "Curriculum topic inventory; not a professional reliability-engineering syllabus."
      uncertainty:
        - "The KU subsection's printed page number was not independently confirmed; heading-anchored citation is used."
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07D-CS2023-RELIABILITY-CONCEPT
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07D-CS2023-SE-RELIABILITY-KU
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        CS2023's first core reliability topic defines the concept of reliability
        as the probability of failure or the mean time between failures, and
        treats faults as the cause of failures.
      context: "SE-Reliability: Software Reliability, KA Core topic 1."
      method: "Read the SE-Reliability topic list in the extracted full text on 2026-11-07; heading-anchored KU locator."
      result: "The dual quantification (probability of failure; mean time between failures) and the fault-to-failure causal framing were confirmed."
      limitations:
        - "The topic names the two quantifications without elaborating measurement procedure; procedural detail is not in this anchor."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07D-CS2023-DEFECT-INJECTION-REMOVAL
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07D-CS2023-SE-RELIABILITY-KU
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        CS2023 teaches that software failures are caused by defects (bugs), so
        for high reliability the goal is to have minimum defects: by injecting
        fewer defects in the first place — through better training, education
        and planning — and by removing most of the injected defects, through
        testing, code review and similar approaches. A paired core topic covers
        the defect injection and removal cycle and different approaches for
        defect removal.
      context: "SE-Reliability: Software Reliability, KA Core topics 3 and 5."
      method: "Read the SE-Reliability topic list in the extracted full text on 2026-11-07; heading-anchored KU locator."
      result: "The two-lever minimum-defect framing (inject fewer; remove more) and the injection/removal cycle topic were confirmed."
      limitations:
        - "The topic names example levers (training, education, planning; testing, code review) without ranking their effectiveness."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07D-CS2023-ERROR-BUDGET
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07D-CS2023-SE-RELIABILITY-KU
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        CS2023's sixth core reliability topic asks students to compare the
        "error budget" approach to reliability with the "error-free" approach
        and to identify domains where each is relevant.
      context: "SE-Reliability: Software Reliability, KA Core topic 6."
      method: "Read the SE-Reliability topic list in the extracted full text on 2026-11-07; heading-anchored KU locator."
      result: "The error-budget/error-free comparison is confirmed as core curriculum content, phrased as a comparison-and-domain-mapping exercise rather than a verdict that one approach wins."
      limitations:
        - "The curriculum poses the comparison; it does not itself enumerate which domains suit which approach."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07D-CS2023-FAULT-TOLERANCE-CONTEXT
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07D-CS2023-SE-RELIABILITY-KU
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        CS2023 lists software fault tolerance techniques and models as a
        Non-core topic and makes their contextual differences explicit through
        two contrasting examples: crashing a flight-critical system is strongly
        avoided, while crashing a data-processing system before corrupt data is
        written to storage is highly valuable. The same unit also lists (also
        Non-core) identifying dependent and independent failure domains and
        their impact on system reliability.
      context: "SE-Reliability: Software Reliability, Non-core topics 8 (with 8a) and 10."
      method: "Read the SE-Reliability non-core topic list in the extracted full text on 2026-11-07; heading-anchored KU locator."
      result: "The consequence-driven contrast in tolerated failure responses and the failure-domain topic were confirmed as elective curriculum content."
      limitations:
        - "Both topics are Non-core (elective) in the CS2023 curriculum model; the examples are illustrative, not a taxonomy of fault-tolerance strategies."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07D-CS2023-MEASUREMENT-TELEMETRY
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07D-CS2023-SE-RELIABILITY-KU
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        CS2023 lists, as a Non-core topic, measurement-based analysis of
        software reliability, exemplified by telemetry, monitoring and
        alerting, dashboards, and release qualification metrics.
      context: "SE-Reliability: Software Reliability, Non-core topic 11."
      method: "Read the SE-Reliability non-core topic list in the extracted full text on 2026-11-07; heading-anchored KU locator."
      result: "The measurement-based analysis topic and its four named instrument families were confirmed as elective curriculum content."
      limitations:
        - "The topic names instrument families without prescribing metrics definitions or alerting thresholds."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW

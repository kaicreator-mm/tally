        SE-Reliability unit lists measurement-based analysis (telemetry,
        monitoring and alerting, dashboards, release qualification metrics) as
        its reliability-analysis topic. On that combined reading, running an
        operated software service without a measurement/telemetry feedback
        loop leaves its reliability, capacity and availability unobserved, so
        deviations are discovered by stakeholders rather than by evidence.
      context: "Cross-source inference combining SWEBOK Guide v4.0a KA6 section 4.3 with CS2023 SE-Reliability Non-core topic 11; this is not a sentence that appears in either source."

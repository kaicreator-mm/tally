scope_note: >-
  Reliability, resilience and performance vertical-slice lane (SEK-07D) grounded
  in the CS2023 Software Engineering knowledge unit "SE-Reliability: Software
  Reliability" (heading-anchored, verbatim topic extraction of 2026-11-07) plus
  directly reinspected SWEBOK Guide v4.0a sections: KA6 Software Engineering
  Operations sections 1.6, 2.3, 2.4, 2.5 and 4.3 (operations-side availability,
  capacity, failover and evidence-based monitoring) and KA12 Software Quality
  sections 1.4 and 2.3.1 (failure-risk-reduction engineering and reliability
  measurement), read from the official hash-verified PDF binary on 2026-11-07.
  KA12 model-level quality definitions are deliberately not cited (SEK-07A owns
  the quality-model level); this lane cites only engineering sections. All
  knowledge records remain PROPOSED or PENDING_REVIEW; none is ACCEPTED. Source
  entities are not stored in this lane file; the validation harness derives
  shared Source records from SOURCE_REGISTRY.yaml.
review_policy: "No record is ACCEPTED until a human reviewer verifies source, locator, interpretation, applicability and rights."

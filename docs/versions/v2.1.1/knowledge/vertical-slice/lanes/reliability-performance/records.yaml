        faults treated as the cause of failures.
      claim_kind: DEFINITION
      scope_description: "CS2023 SE knowledge unit SE-Reliability: Software Reliability, KA Core topic 1; a curriculum-scope characterization, not a professional-standard definition."
      applicability: "Interpreting reliability discussions within the CS2023 curriculum model; aligns with SWEBOK's failure-rate measurement name but neither source is treated as definitive."
      assumptions: []
      exceptions: []
      limitations:
        - "The topic names two quantifications without measurement procedure; this claim does not import one."

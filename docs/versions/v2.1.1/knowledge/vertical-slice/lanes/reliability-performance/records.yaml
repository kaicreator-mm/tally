      statement: >-
        SWEBOK v4.0a KA6 section 4.3 states that software engineering
        operations activities monitor capacity, continuity and availability,
        and that in a DevOps mindset hope should not be a strategy: engineers
        should instead be informed about system quality and operational health
        with evidence, in the form of key performance indicators available to
        stakeholders in real time. The named evidence sources are production
        system monitoring and product telemetry; actionable verification and
        validation results before and after release to production; end-user
        activity and resource use; impact analysis results; inter- and
        intra-related dependencies required for system operation; configuration
        changes unrelated to approved deployment tasks; and security and
        resilience performance capability.
      context: "SWEBOK Guide v4.0a Chapter 6 section 4.3, printed page 6-11."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page index; original paraphrase."

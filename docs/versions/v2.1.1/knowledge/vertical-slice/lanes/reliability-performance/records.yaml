      statement: >-
        SWEBOK v4.0a KA12 section 2.3.1 states that software quality
        measurements support decision-making and names three widely used
        software quality measurements: error density (number of errors per unit
        size of documents or software), defect density (number of defects found
        divided by the size of the software) and failure rate (mean time to
        failure). It further states that reliability models are built from
        failure data collected during software testing or from software in
        service, and can therefore be used to estimate the probability of
        future failures and to assist in decisions about when to stop testing.

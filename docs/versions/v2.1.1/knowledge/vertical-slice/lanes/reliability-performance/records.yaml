      review_status: PENDING
    - id: se:CLM-07D-HIGH-RELIABILITY-DEFECT-MINIMIZATION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      statement: >-
        The CS2023 curriculum teaches that because software failures are caused
        by defects, high reliability pursues a minimum of defects through two
        levers — injecting fewer defects (better training, education and
        planning) and removing most injected defects (testing, code review and
        similar) — and devotes a separate core topic to the defect injection
        and removal cycle.
      claim_kind: PRACTICE_CLAIM
      scope_description: "CS2023 SE-Reliability KA Core topics 3 and 5; a curriculum teaching expectation, not a professional-consensus claim."
      applicability: "Reading or teaching the CS2023 reliability curriculum; usable by practitioners only as curriculum guidance."
      assumptions: []
      exceptions: []
      limitations:
        - "The curriculum names example levers without comparing their effectiveness."
      uncertainty: []
      evidence_refs:
        - se:EVD-07D-CS2023-DEFECT-INJECTION-REMOVAL
      review_status: PENDING
    - id: se:CLM-07D-ERROR-BUDGET-COMPARISON
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      statement: >-
        The CS2023 curriculum treats the choice between the "error budget"
        approach to reliability and the "error-free" approach as core
        reliability knowledge, framing it as a comparison in which the domains
        where each approach is relevant must be identified.
      claim_kind: PRACTICE_CLAIM
      scope_description: "CS2023 SE-Reliability KA Core topic 6; curriculum-scope comparative topic, not a verdict that either approach is universally superior."
      applicability: "Reliability strategy discussions that accept curriculum framing; the curriculum itself does not enumerate the domains."
      assumptions: []
      exceptions: []
      limitations:
        - "The topic poses the comparison and domain mapping; no domain mapping is carried by the anchor."
      uncertainty: []
      evidence_refs:
        - se:EVD-07D-CS2023-ERROR-BUDGET
      review_status: PENDING
    - id: se:CLM-07D-FAULT-TOLERANCE-CONTEXT-DEPENDENCE
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      statement: >-
        The CS2023 curriculum teaches that fault tolerance is context-dependent
        — its illustrative contrast is that crashing a flight-critical system
        is strongly avoided while crashing a data-processing system before
        corrupt data is written to storage is highly valuable — and lists this
        under Non-core (elective) fault tolerance techniques and models.
      claim_kind: PRACTICE_CLAIM
      scope_description: "CS2023 SE-Reliability Non-core topic 8 (with subtopic 8a); elective curriculum scope with illustrative, not exhaustive, examples."
      applicability: "Choosing failure-response strategies where consequence classes differ; the examples are the curriculum's illustrations, not a strategy taxonomy."
      assumptions: []
      exceptions: []

  decision_models:
    - id: se:DEC-07D-ERROR-BUDGET-OR-ERROR-FREE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      decision_question: "Which reliability approach — error budget or error-free — fits a given software domain, and how much defect-minimization effort should follow from that choice?"
      options:
        - "Error budget approach: tolerate a quantified amount of unreliability and govern against the budget."
        - "Error-free approach: pursue minimum defects without a tolerated-error allowance."
        - "A domain-partitioned combination, where different service classes follow different approaches."
      criteria:
        - "Consequence class of failure in the domain (the fault-tolerance context contrast: crash-avoided versus crash-valuable)."
        - "Whether a quantified reliability target (probability of failure / mean time between failures) is definable for the service."
        - "Cost of the defect-minimization levers (training/education/planning for injection; testing/code review for removal)."
      constraints:
        - "The CS2023 curriculum requires the comparison and domain mapping to be made explicitly, not a default to one approach (KA Core topic 6)."
        - "High reliability is pursued by minimizing defects — inject fewer, remove more — wherever the error-free side is chosen."
      procedure: >-
        Classify the domain's failure consequences; determine whether failures
        can be quantified against a budget or must be driven toward zero; map
        the domain to the approach whose assumption about tolerable failure
        matches that classification, following the comparison the CS2023
        topic prescribes; then size the two defect-minimization levers
        accordingly.
      tradeoffs:
        - "An error budget makes residual unreliability explicit and governable but requires quantified targets; an error-free stance avoids budgeting failure but concentrates cost in defect minimization."
      scope_description: "Structured around CS2023 SE-Reliability KA Core topic 6 (comparison framing) with topics 3/5 (defect-minimization levers) and Non-core topic 8a (consequence context); curriculum-scope decision aid."
      evidence_refs:
        - se:EVD-07D-CS2023-ERROR-BUDGET
        - se:EVD-07D-CS2023-DEFECT-INJECTION-REMOVAL
        - se:EVD-07D-CS2023-FAULT-TOLERANCE-CONTEXT
      claim_refs:
        - se:CLM-07D-ERROR-BUDGET-COMPARISON
        - se:CLM-07D-HIGH-RELIABILITY-DEFECT-MINIMIZATION
    - id: se:DEC-07D-CAPACITY-INVESTMENT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      decision_question: "When and how should capacity be added or reshaped so the service keeps meeting agreed service-level targets?"
      options:
        - "Add capacity ahead of forecast demand."
        - "Ride current capacity and accept the SLA risk."
        - "Reshape demand or architecture (sizing and modeling of new/changed services) instead of adding raw capacity."
      criteria:
        - "Current and forecast workload against the agreed service-level targets in the SLA."
        - "Observed resource-utilization data at an appropriate level."
        - "Costed options for meeting the business requirements (the capacity plan's own currency)."
      constraints:
        - "Capacity must exist at all times for current and future agreed demand; reaction to workload variation must be predictable."
        - "The capacity plan is produced at a suitable frequency (at least annually per the SWEBOK-relayed requirement) and must document costed options."
      procedure: >-
        Assemble utilization data and workload forecasts; size and model the
        candidate changes; build the costed options against the SLA targets;
        recommend the option that achieves the agreed targets at acceptable
        cost, and record the decision in the recurring capacity plan.
      tradeoffs:
        - "Early capacity addition costs money before demand materializes; late addition risks SLA breach when variation arrives."
      scope_description: "SWEBOK Guide v4.0a KA6 section 2.4 fidelity (relaying ISO/IEC/IEEE 20000-1); professional-BOK decision aid for services with SLA targets."
      evidence_refs:
        - se:EVD-07D-SWEBOK-CAPACITY-MGMT
      claim_refs:
        - se:CLM-07D-SWEBOK-CAPACITY-FORECASTING

  cases:
    # --- SEK-09F real incident cases (reviewed intake #365 / PR #366; merged by SEK-09H #368) ---
    # Both cases are PENDING_REVIEW / synthetic: false. Neither is a Counterexample:
    # they do not challenge a specific qualified claim, so no counterexample edge is asserted.
    - id: se:CASE-09F-CF-KV-DEPENDENCY
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-08"
      label: Cloudflare 2025 Workers KV shared dependency availability incident
      case_kind: POSTMORTEM
      context: "Cloudflare Workers KV served as a shared storage dependency for several production services, with some infrastructure backed by a single third-party provider."
      problem: "The third-party storage disruption degraded KV and propagated outages to dependent products; geographic reach of service access did not eliminate shared backing dependency risk."
      intervention: "Investigated alternative storage and dependent-service degradation/recovery; published plans for provider redundancy, failover safeguards and controlled cache restoration."
      outcome: "Cloudflare reported 2 hours 28 minutes of impact and no data loss; subsequent architecture changes were described but their long-term empirical benefit is not measured in this intake."
      lessons:
        - "Model end-to-end critical dependencies rather than inferring availability from distributed front ends alone."
        - "Treat measured resilience and recovery claims as distinct from a postmortem's planned future changes."
      synthetic: false
      evidence_refs:
        - se:EVD-09F-CF-SHARED-DEPENDENCY
        - se:EVD-09F-CF-REMEDIATION
        - se:EVD-09F-CF-REDESIGN
    - id: se:CASE-09F-GH-DB-FAILOVER
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-08"
      label: GitHub 2018 database replication divergence after failover
      case_kind: POSTMORTEM
      context: "A network partition affected GitHub.com's East/West MySQL replication and orchestration during October 21–22, 2018."
      problem: "After failover the two sites had divergent writes, making immediate fail-back unsafe and causing degraded metadata availability."
      intervention: "Responders paused some dependent processing, prioritized data integrity and rebuilt/recovered database replication before restoring normal topology."
      outcome: "The first-party report records a prolonged recovery with site degradation and backlog handling; exact recovery tradeoffs are bound to the original incident report."
      lessons:
        - "Leader/failover completion and cross-site state convergence are distinct facts."
        - "Document safety and availability tradeoffs in a particular architecture without generalizing to all database systems."
      synthetic: false
      evidence_refs:
        - se:EVD-09F-GH-REPLICATION
        - se:EVD-09F-GH-RECOVERY


    - id: se:EVD-07D-SWEBOK-AVAILABILITY-SLA
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07D-SWEBOK-KA6-AVAILABILITY-SLA
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA6 section 2.3 presents service availability and
        continuity as managed properties: they must be managed so customer
        commitments are met; they are defined as nonfunctional requirements
        early in a project (the section points to the Software Quality KA);
        operations engineers plan, design, implement and test the proper
        infrastructure; software availability is measured and recorded;
        unplanned nonavailability is investigated and acted on; and service
        reports produce availability and continuity indicators against
        service-level targets. The service-level management process monitors
        the agreed level of service, including workload characteristics,
        performance and availability trend information and customer
        satisfaction, and defining, agreeing and documenting service-level
        agreements (SLAs) helps clarify the full range of operations service
        obligations.
      context: "SWEBOK Guide v4.0a Chapter 6 section 2.3, printed page 6-8."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page index; original paraphrase."
      result: "The manage-measure-investigate loop and the SLA clarification role were confirmed for the availability claim and the SLA-anchored pattern."
      limitations:
        - "The section describes generally accepted operations activities, not a mandated availability-management process for every service."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07D-SWEBOK-CAPACITY-MGMT
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07D-SWEBOK-KA6-CAPACITY
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA6 section 2.4, relaying ISO/IEC/IEEE 20000-1, describes
        software capacity management as ensuring the software product has the
        capacity, at all times, to meet current and future agreed-upon demands
        created by the customer's business needs: current and expected business
        requirements should be understood and translated into specific,
        documented requirements; the reaction to workload or environment
        variations should be predictable; and data on current and previous
        components and on resource utilization at an appropriate level should
        be captured and analyzed to support the process. Capacity management is
        called the focal point for all performance and capacity issues, should
        support development of new and changed services by sizing and modeling
        them, and produces a capacity plan (at a suitable frequency, at least
        annually) documenting actual infrastructure performance and expected
        requirements, with costed options and recommended solutions for
        achieving the agreed service-level targets in the SLA.
      context: "SWEBOK Guide v4.0a Chapter 6 section 2.4, printed page 6-8."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page index; original paraphrase."
      result: "The forecast-translate-analyze-plan loop, the annual capacity plan and the costed-options framing were confirmed for the capacity claim and decision model."
      limitations:
        - "The section relays an ISO/IEC/IEEE 20000-1 need; the underlying standard's normative text is not itself admitted (registry ISO sources are metadata-only)."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07D-SWEBOK-FAILOVER-INEVITABLE
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07D-SWEBOK-KA6-DR-FAILOVER
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA6 section 2.5 states that after a major service failure
        or disaster, backups of data, documents and software plus any equipment
        or staff necessary for service restoration should be quickly available;
        that the need for successful recovery should influence the choice of
        backup and recovery methods (full or incremental), how frequently
        restore points are established, where they are stored and how long
        they are retained; and that preparedness and regular testing of
        backup, disaster recovery and failover should be constantly rehearsed
        as the production environment changes (testing disaster recovery
        requires stopping the service, identifying the checkpoint state and
        triggering the failover process). It further states that software
        engineers should understand that failure is inevitable, that automated
        failover daemons can reduce recovery time drastically, and that to
        achieve this software applications should include failure-handling
        logic, which must be planned during development.
      context: "SWEBOK Guide v4.0a Chapter 6 section 2.5, printed pages 6-8 to 6-9."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The failure-is-inevitable stance, the planned-during-development failure-handling logic and the rehearsal requirement were confirmed for the plan-for-failure principle and the failover practice."
      limitations:
        - "The section names approaches (automated failover daemons, full/incremental backups) without comparative reliability data."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false

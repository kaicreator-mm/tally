        software-intensive systems, names three complementary techniques for
        reducing failure risk — avoidance, detection and removal, and damage
        limitation — and states that these techniques impact software
        functional requirements, performance requirements and development
        processes. It adds that increasing risk implies increasing software
        quality assurance and more rigorous review techniques, and describes
        the assurance case as a reasoned, auditable artifact supporting the
        contention that claims are satisfied, containing claims about
        properties, arguments that logically link the evidence and assumptions
        to the claims, and a body of evidence and assumptions supporting the
        arguments.
      context: "SWEBOK Guide v4.0a Chapter 12 section 1.4 (including 1.4.1/1.4.2 context), printed pages 12-5 to 12-6."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."

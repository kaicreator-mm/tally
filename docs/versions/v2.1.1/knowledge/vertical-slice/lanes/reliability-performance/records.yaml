  principles:
    - id: se:PRI-07D-PLAN-FOR-FAILURE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Expect failure and engineer the response during development
      statement: >-
        Failure of an operated software service should be treated as inevitable,
        and the failure response — failure-handling logic in the application,
        automated failover, and rehearsed backup/disaster-recovery procedures —
        should be planned during development rather than improvised after an
        outage, with the tolerated response matched to the failure's
        consequences in the specific domain.
      rationale: >-
        SWEBOK Guide v4.0a KA6 section 2.5 states that failure is inevitable,
        that automated failover daemons can drastically reduce recovery time,
        that applications should include failure-handling logic which must be
        planned during development, and that preparedness must be constantly
        rehearsed as production changes; CS2023's fault-tolerance topic adds
        that the tolerated response is context-dependent (crash avoidance in
        flight-critical systems versus crash-before-corruption in
        data-processing systems).
      scope_description: "Derived within SWEBOK KA6 section 2.5 professional-BOK scope plus the CS2023 SE-Reliability Non-core topic 8 contrast; not asserted as a universal engineering law."
      applicability: "Long-lived operated software services where recovery time and failure consequences matter."
      exceptions:
        - "Throwaway or single-shot artifacts that are explicitly not expected to survive failure."
      limitations:
        - "No empirical case evidence in this lane measures how much rehearsed failover reduces recovery time; the Guide's 'drastically' is qualitative."
        - "The CS2023 anchor for context-dependence is a Non-core (elective) topic."
    - id: se:PRI-07D-EVIDENCE-OVER-HOPE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Operate on measured evidence, not assumption
      statement: >-
        Operational decisions about a software service's reliability, capacity,
        continuity and availability should be driven by observed evidence —
        telemetry, monitoring and alerting, dashboards and release
        qualification measurements available to stakeholders in real time —
        rather than by assumption or hope.
      rationale: >-
        SWEBOK Guide v4.0a KA6 section 4.3 states that in a DevOps mindset hope
        should not be a strategy and that engineers should be informed about
        system quality and operational health with real-time KPI evidence;
        CS2023's SE-Reliability unit lists measurement-based analysis
        (telemetry, monitoring and alerting, dashboards, release qualification
        metrics) as its reliability-analysis topic.
      scope_description: "Combines a SWEBOK KA6 operations-control norm with a CS2023 elective topic; professional-guidance and curriculum framings are kept distinct in the underlying evidence."
      applicability: "Operated services with stakeholders who consume operational health information."
      exceptions:
        - "Pre-operational artifacts with no runtime observation surface."
      limitations:
        - "The CS2023 anchor is Non-core (elective); the SWEBOK norm is stated for a DevOps mindset, which the Guide itself presents as an approach rather than a universal requirement."

  practices:
    - id: se:PRA-07D-DEFECT-INJECTION-REMOVAL
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Two-lever defect minimization (inject fewer, remove more)
      intent: >-
        Raise software reliability by minimizing the defects that cause
        failures, working both levers the curriculum names: preventing defect
        injection and removing injected defects.
      description: >-
        Pursue high reliability through a minimum-defect goal: reduce defect
        injection through better training, education and planning, and remove
        most injected defects through testing, code review and comparable
        removal approaches, treating injection and removal as a cycle rather
        than a one-time phase, as presented in the CS2023 SE-Reliability unit.
      preconditions:
        - "A development process in which both prevention activities (training, education, planning) and removal activities (testing, code review) can be resourced."
      steps:
        - "Identify the defect classes historically injected by the team and the lifecycle stages where they enter."
        - "Apply injection-prevention measures (training, education, planning) targeted at those classes and stages."
        - "Apply removal measures (testing, code review and similar approaches) sized to catch the remaining injected defects."
        - "Track the injection/removal cycle over releases so prevention reduces what removal must catch."
      expected_outcomes:
        - "A declining share of injected defects surviving to operation."
        - "Recorded linkage between prevention/removal activities and observed defect classes."
      risks:
        - "Prevention without removal leaves early-injected defects in place; removal without prevention keeps the cycle expensive."
        - "Removal effort can exceed the reliability actually required (see the error-budget comparison for requirement-setting)."
      scope_description: "Operationalizes CS2023 SE-Reliability KA Core topics 3 and 5 at curriculum fidelity; the example levers are the curriculum's, not an exhaustive program."
      applicability: "Development contexts pursuing high reliability through defect minimization; the curriculum does not rank the levers."
      evidence_refs:
        - se:EVD-07D-CS2023-DEFECT-INJECTION-REMOVAL
      claim_refs:
        - se:CLM-07D-HIGH-RELIABILITY-DEFECT-MINIMIZATION
    - id: se:PRA-07D-CAPACITY-PLANNING
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Forecast-driven capacity planning with costed options
      intent: >-
        Ensure the service has capacity, at all times, to meet current and
        future agreed demand, and make capacity reactions predictable.
      description: >-
        Translate business predictions and workload estimates into specific
        documented capacity requirements; capture and analyze data on current
        and previous components and on resource utilization; size and model
        new and changed services; and produce a recurring capacity plan (SWEBOK
        relays at least annually) documenting actual infrastructure
        performance, expected requirements and costed options for achieving
        the service-level targets in the SLA.
      preconditions:
        - "Agreed service-level targets (SLA) against which capacity options are judged."
        - "Access to workload/business forecasts and to component and resource-utilization data."
      steps:
        - "Understand current and expected business requirements for the service in terms of what the business must deliver."
        - "Translate business predictions and workload estimates into specific, documented requirements."
        - "Capture and analyze component and resource-utilization data at an appropriate level."
        - "Size and model new and changed services against the data."
        - "Produce the capacity plan with actual performance, expected requirements and costed options; recommend the option that meets the agreed targets."
      expected_outcomes:
        - "A documented, periodically refreshed capacity plan tied to SLA targets."
        - "Predictable reaction to workload or environment variation."
      risks:
        - "Forecasts can be wrong; a plan without utilization data drifts into guesswork."
        - "Costed options can favor short-term savings over the agreed targets."
      scope_description: "Operationalizes SWEBOK Guide v4.0a KA6 section 2.4 (relaying ISO/IEC/IEEE 20000-1) at professional-BOK fidelity; the ISO standard's own text is not admitted."
      applicability: "Operated services with agreed service-level targets and observable workload."
      evidence_refs:
        - se:EVD-07D-SWEBOK-CAPACITY-MGMT
      claim_refs:
        - se:CLM-07D-SWEBOK-CAPACITY-FORECASTING
    - id: se:PRA-07D-RELIABILITY-TELEMETRY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Measurement-based reliability telemetry loop
      intent: >-
        Give engineers and stakeholders real-time evidence about system quality
        and operational health so reliability, capacity, continuity and
        availability decisions rest on observation.
      description: >-
        Instrument the service with the measurement families the anchors name
        — telemetry, monitoring and alerting, dashboards, and release
        qualification measurements — and surface the resulting indicators to
        stakeholders in real time, so that unplanned nonavailability and
        capacity/availability trends are investigated from data rather than
        discovered by customers.
      preconditions:
        - "An operating service with an observable runtime surface."
        - "Stakeholders defined to receive the indicators."
      steps:
        - "Select the instrument families (telemetry, monitoring/alerting, dashboards, release qualification metrics) and what each must reveal."
        - "Instrument production monitoring and product telemetry as the primary evidence source."
        - "Define alerting on the indicators that signify degrading reliability, capacity, continuity or availability."
        - "Review capacity, continuity and availability indicators against service-level targets; investigate unplanned deviations."
        - "Feed observed failure and utilization data back into capacity planning and reliability measurement."
      expected_outcomes:
        - "Real-time indicator coverage of the operational-health dimensions the anchors name."
        - "Investigations triggered by measured deviations instead of stakeholder reports."
      risks:
        - "Indicator volume without curation becomes noise that hides real deviations."
        - "Telemetry gaps leave the very dimensions being claimed as observed actually unobserved."
      scope_description: "Operationalizes CS2023 SE-Reliability Non-core topic 11 together with SWEBOK KA6 sections 4.3 and 2.3; curriculum-elective and professional-norm bases are recorded separately in the underlying evidence."
      applicability: "Operated services whose reliability and capacity must be steered by evidence."
      evidence_refs:
        - se:EVD-07D-CS2023-MEASUREMENT-TELEMETRY
        - se:EVD-07D-SWEBOK-MONITOR-EVIDENCE
      claim_refs:
        - se:CLM-07D-MEASUREMENT-BASED-RELIABILITY
        - se:CLM-07D-SWEBOK-EVIDENCE-NOT-HOPE
    - id: se:PRA-07D-FAILOVER-REHEARSAL
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Rehearsed failover and recovery preparedness
      intent: >-
        Reduce recovery time after inevitable failures by preparing, automating
        and repeatedly testing the failover and recovery path.
      description: >-
        Plan failure-handling logic during development so automated failover
        can operate; choose backup and recovery methods (full or incremental),
        restore-point frequency, storage location and retention under the
        influence of the need for successful recovery; and constantly rehearse
        backup, disaster-recovery and failover testing as the production
        environment changes, including the disruptive test path of stopping
        the service, identifying the checkpoint state and triggering failover.
      preconditions:
        - "Failure-handling logic designed into the application during development."
        - "A production environment in which a disruptive failover test can be scheduled."
      steps:
        - "Design the failure-handling logic and automated failover path with the application."
        - "Decide backup/recovery methods, restore-point frequency, storage and retention from the recovery requirement."
        - "Schedule rehearsals triggered by production changes (SWEBOK's constant-rehearsal framing)."
        - "Run the disruptive test: stop the service, identify the checkpoint state, trigger failover, verify recovery."
        - "Record outcomes and repair the recovery path where the rehearsal fails."
      expected_outcomes:
        - "A failover and recovery path whose behavior is known from rehearsal, not assumption."
        - "Reduced recovery time through automation of the failover step."
      risks:
        - "Disruptive rehearsal itself causes the outage it is meant to prevent if scheduled badly."
        - "Unrehearsed recovery paths silently rot as production drifts from the documented environment."
      scope_description: "Operationalizes SWEBOK Guide v4.0a KA6 section 2.5 at professional-BOK fidelity."
      applicability: "Services with recovery-time concerns; the disruptive test path applies where stopping the service is acceptable."
      evidence_refs:
        - se:EVD-07D-SWEBOK-FAILOVER-INEVITABLE
      claim_refs:
        - se:CLM-07D-SWEBOK-FAILURE-INEVITABLE

  patterns:
    - id: se:PAT-07D-CONTEXT-DEPENDENT-FAULT-RESPONSE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Consequence-matched failure response
      problem: >-
        A software system needs a failure response, but the right response
        differs by what the failure costs in that domain: the same crash that
        is unacceptable in one context is the safest available action in
        another.
      context: >-
        A service whose failures have domain-specific consequences — the
        CS2023 curriculum's contrasting cases are a flight-critical system,
        where crashing is strongly avoided, and a data-processing system, where
        crashing before corrupt data reaches storage is highly valuable — being
        designed with SWEBOK's requirement that failure-handling logic be
        planned during development.
      forces:
        - "Consequences of continued operation versus consequences of stopping differ per domain."
        - "Automated failover presupposes failure-handling logic built into the application."
        - "The failure response must be chosen before the failure occurs, during development."
      solution: >-
        Classify the service's failure modes by consequence (corruption risk,
        safety risk, availability loss), then select and build the matched
        response for each class — fail-safe stop where corruption or safety
        dominates, failover-continued operation where availability dominates —
        implementing the chosen responses as planned failure-handling logic so
        automated failover daemons can execute them.
      consequences:
        - "The failure response matches what each failure actually costs, rather than a uniform policy."
        - "Failover automation has deterministic logic to execute because the response was designed in."
      tradeoffs:
        - "Consequence classification takes design effort up front; a uniform response is cheaper to build but misfits at least one consequence class."
      scope_description: "Pattern shaped from CS2023 SE-Reliability Non-core topic 8a's contextual contrast plus SWEBOK KA6 section 2.5's planned failure-handling logic; the two consequence cases are the curriculum's illustrations."
      evidence_refs:
        - se:EVD-07D-CS2023-FAULT-TOLERANCE-CONTEXT
        - se:EVD-07D-SWEBOK-FAILOVER-INEVITABLE
    - id: se:PAT-07D-SLA-ANCHORED-AVAILABILITY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: SLA-anchored availability management loop
      problem: >-
        A operated service must meet customer availability commitments, but
        availability is invisible unless it is defined early, measured, and
        compared against an agreed target.
      context: >-
        A software service with customers and agreed commitments, entering a
        project where SWEBOK KA6 expects availability and continuity to be
        defined as nonfunctional requirements early, with infrastructure
        planned, designed, implemented and tested for them.
      forces:
        - "Availability commitments exist (customer expectations) but are ambiguous until documented in an SLA."
        - "Unplanned nonavailability is only actionable if it is detected and investigated."
        - "Stakeholders need indicators they can read against the agreed targets."
      solution: >-
        Define availability and continuity early as nonfunctional requirements;
        agree and document the SLA that clarifies the full range of operations
        obligations; build the supporting infrastructure; then run the loop —
        measure and record availability, investigate unplanned nonavailability
        and act, monitor workload/performance/availability trends via the
        service-level management process, and report availability and
        continuity indicators against the service-level targets.
      consequences:
        - "Availability becomes a managed, evidenced property with a defined target and an investigation path."
        - "The SLA turns diffuse customer expectations into checkable operations obligations."
      tradeoffs:
        - "SLA definition and indicator reporting add coordination overhead; without them, availability disputes have no shared reference."
      scope_description: "SWEBOK Guide v4.0a KA6 section 2.3 fidelity; a professional-BOK pattern for operated services, not a universal mandate."
      evidence_refs:
        - se:EVD-07D-SWEBOK-AVAILABILITY-SLA

  anti_patterns:
    - id: se:ANT-07D-HOPE-BASED-OPERATIONS
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Hope-based operations (no measurement feedback loop)
      symptoms:
        - "Operational decisions about reliability, capacity or availability are made from assumption or schedule pressure rather than observed indicators."
        - "Unplanned nonavailability, capacity exhaustion or degrading reliability is discovered by stakeholders rather than by monitoring or alerting."
        - "No real-time evidence surface (telemetry, dashboards, release qualification measurements) exists for the service's operational health."
      causes:
        - "Treating measurement instrumentation as optional overhead rather than as the feedback mechanism for reliability."
        - "Confusing absence of reported problems with absence of problems."
        - "No owner for the monitoring/alerting/telemetry loop the curriculum and Guide both name."
      consequences:
        - "Deviations are detected late, after they have already affected users."
        - "Capacity and availability claims cannot be evidenced against service-level targets, inviting disputes."
        - "Reliability work loses its data foundation: failure data never accumulates, so reliability measurement and stop-testing decisions have nothing to draw on."
      remediation: >-
        Build the measurement feedback loop the anchors name — production
        monitoring and product telemetry, monitoring and alerting, dashboards
        and release qualification metrics — surface real-time indicators to
        stakeholders, and route operational decisions through that evidence,
        per SWEBOK KA6 section 4.3's norm that hope should not be a strategy.

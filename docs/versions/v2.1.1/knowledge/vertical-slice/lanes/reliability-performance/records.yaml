  concepts:
    - id: se:CON-07D-SOFTWARE-RELIABILITY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Software Reliability (failure-quantified)
      definition: >-
        The reliability of software characterized quantitatively: CS2023's
        reliability topic frames it as the probability of failure or the mean
        time between failures, with faults as the cause of failures; SWEBOK
        v4.0a's quality-measurement section names failure rate (mean time to
        failure) among the widely used quality measurements.
      concept_kind: QUALITY_ATTRIBUTE
      synonyms:
        - failure rate
      scope_description: "Anchored to the CS2023 SE-Reliability topic 1 quantifications and SWEBOK KA12 2.3.1 measurement names; not asserted as a complete professional definition of reliability."
      evidence_refs:
        - se:EVD-07D-CS2023-RELIABILITY-CONCEPT
        - se:EVD-07D-SWEBOK-RELIABILITY-MEASURES
    - id: se:CON-07D-ERROR-BUDGET
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Error budget (reliability approach)
      definition: >-
        One of the two reliability approaches CS2023 asks students to compare:
        the "error budget" approach to reliability, contrasted in the
        curriculum with the "error-free" approach, with the relevance of each
        to be identified per domain.
      concept_kind: TERM
      synonyms: []
      scope_description: "Defined only as far as the CS2023 SE-Reliability KA Core topic 6 sentence goes; the curriculum names the two approaches without defining budget mechanics."
      evidence_refs:
        - se:EVD-07D-CS2023-ERROR-BUDGET
    - id: se:CON-07D-FAULT-TOLERANCE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Fault tolerance (context-dependent response)
      definition: >-
        The capability of software to keep operating acceptably in the presence
        of faults, realized through fault tolerance techniques and models;
        CS2023 teaches that the tolerated response is context-dependent (a
        crash may be strongly avoided in a flight-critical system yet highly
        valuable in a data-processing system before corrupt data is written),
        and SWEBOK v4.0a requires failure-handling logic to be planned during
        development for automated failover to work.
      concept_kind: MECHANISM
      synonyms: []
      scope_description: "CS2023 Non-core topic 8 (with 8a) plus SWEBOK KA6 section 2.5 scope; not a survey of fault-tolerance technique families."
      evidence_refs:
        - se:EVD-07D-CS2023-FAULT-TOLERANCE-CONTEXT
        - se:EVD-07D-SWEBOK-FAILOVER-INEVITABLE
    - id: se:CON-07D-SERVICE-LEVEL-AGREEMENT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Service-Level Agreement (SLA)
      definition: >-
        The agreed, documented statement of the level of service an operations
        provider owes its customers; per SWEBOK v4.0a KA6 it is the instrument
        that clarifies the full range of operations service obligations, while
        the service-level management process monitors the agreed level of
        service including workload characteristics, performance and
        availability trend information.
      concept_kind: TERM
      synonyms:
        - SLA
      scope_description: "Defined at SWEBOK Guide v4.0a KA6 section 2.3 fidelity (operations-services context); other communities may define SLA variants this anchor does not cover."
      evidence_refs:
        - se:EVD-07D-SWEBOK-AVAILABILITY-SLA

  knowledge_claims:

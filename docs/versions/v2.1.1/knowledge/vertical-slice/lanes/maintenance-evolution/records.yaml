      label: Refactoring
      definition: >-
        A software reengineering technique that aims to reorganize a program
        without changing its behavior, per SWEBOK Guide v4.0a KA7 section 4.2,
        seeking to improve the internal structure and maintainability of
        software; CS2023 additionally names standard refactoring patterns, IDE
        refactoring tools and static-analysis support among its curriculum
        topics and describes refactoring as a remedy for technical debt.
      concept_kind: MECHANISM

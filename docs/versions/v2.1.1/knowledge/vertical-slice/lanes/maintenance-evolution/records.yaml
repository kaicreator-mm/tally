  evidence_records:
    - id: se:EVD-07F-SWEBOK-MAINT-DEFINITION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07F-SWEBOK-KA7-MAINT-DEF
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA7 defines software maintenance as the totality of
        activities required to provide cost-effective support for software in
        operation, with activities performed during a pre-delivery stage
        (planning for post-delivery operations, maintainability, and logistics
        support for the transition from development to maintenance) and a
        post-delivery stage (software surveillance, modification, training, and
        operating or interfacing with a help desk). Citing ISO/IEC/IEEE 14764,
        it states the objective of software maintenance as modifying existing
        software while preserving its integrity, and notes the maintenance phase
        begins after a warranty or post-implementation support period while
        maintenance activities occur much earlier.
      context: "SWEBOK Guide v4.0a Chapter 7 Introduction and section 1.1 Definitions and Terminology, printed pages 7-1 to 7-2."
      method: "Direct inspection of the official SWEBOK v4.0a PDF (SHA-256 0c9db4da0b2425c58cf778b99131eb31bb6c188e98b67163a549a1366d96e511) on 2026-11-07; text extracted at the verified page indices with pypdf 7.0.0 and paraphrased originally."
      result: "The maintenance definition, the pre-/post-delivery stage split and the ISO/IEC/IEEE 14764 objective were confirmed for the lane's foundational definition claim and concept."
      limitations:
        - "The ISO/IEC/IEEE 14764 standard itself is registry metadata-only in this project; the objective is cited as SWEBOK reports it, not from the ISO text."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07F-SWEBOK-EVOLUTION-LAWS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07F-SWEBOK-KA7-EVOLUTION
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA7 section 1.5 reports that research by Lehman and
        others over a period of twenty years led to eight laws of software
        evolution, which it names Continuing Change (software must be continually
        adapted or it becomes progressively less satisfactory), Increasing
        Complexity (complexity increases unless work is done to maintain or
        reduce it), Self-Regulation, Invariant Work Rate, Conservation of
        Familiarity, Continuing Growth, Declining Quality and Feedback System.
        It records key findings that maintenance is evolutionary development,
        that maintenance decisions are aided by understanding what happens to
        software over time, and that large software programs are never complete,
        continuing to evolve and growing more complex unless action is taken to
        reduce that complexity.
      context: "SWEBOK Guide v4.0a Chapter 7 section 1.5 Evolution of Software, printed pages 7-3 to 7-4."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase of the eight named laws and the key-findings sentences."
      result: "The eight law names and the evolutionary-development interpretation were confirmed for the lane's evolution claim and principle."
      limitations:
        - "The laws are reported secondhand by SWEBOK as a summary of Lehman's research; the primary Lehman publications are not registered sources in this project."
        - "The paraphrase names all eight laws but restates in full only the two laws the lane's principle uses (Continuing Change, Increasing Complexity)."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07F-SWEBOK-MAINT-CATEGORIES
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07F-SWEBOK-KA7-CATEGORIES
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA7 section 1.6 states that five categories of
        software maintenance have been standardized to classify a maintenance
        request — corrective (reactive repair of discovered problems after
        delivery), preventive (correcting latent faults before they occur in the
        live system), adaptive (keeping the product usable in an evolving
        environment), additive (adding functionality or features with relatively
        large additions) and perfective (enhancements for users, documentation
        improvement and recoding to improve performance, maintainability or other
        attributes) — that ISO/IEC/IEEE 14764 regroups these as either
        corrections or enhancements, and that the standard also defines a sixth
        category, emergency maintenance: unscheduled modification performed to
        temporarily keep a system operational pending corrective maintenance.
      context: "SWEBOK Guide v4.0a Chapter 7 section 1.6 Categories of Software Maintenance, printed pages 7-4 to 7-5."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase of the category definitions."
      result: "The five standardized categories, the corrections/enhancements regrouping, the emergency sixth category and the additive-versus-perfective distinction were confirmed."
      limitations:
        - "Category definitions are attributed by SWEBOK to ISO/IEC/IEEE 14764; the ISO text itself was not ingested (registry metadata-only)."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07F-SWEBOK-IMPACT-ANALYSIS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07F-SWEBOK-KA7-IMPACT
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA7 section 2.1.3 describes impact analysis as
        assessing the detailed effects of proposed changes on existing software:
        it is performed after a change request (originating from a modification
        request or problem report) enters the software configuration management
        process; it identifies all systems and software products that would be
        affected by the change request, develops an estimate of the resources
        needed to accomplish the change, and determines the risks involved in
        making it. Maintainers often use the severity of a problem report as a
        guide when deciding how and when to fix, conduct the analysis to identify
        affected components, develop potential solutions and recommend a course
        of action; designing software with maintainability in mind greatly
        facilitates impact analysis.
      context: "SWEBOK Guide v4.0a Chapter 7 section 2.1.3 Impact Analysis, printed page 7-6."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page index; original paraphrase."
      result: "The impact-analysis purpose, its SCM entry point, its identified outputs (affected items, resources, risks) and the severity guidance were confirmed."
      limitations:
        - "The section describes generally accepted activity; it does not prescribe a specific impact-analysis technique or tool."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07F-SWEBOK-MAINTAINABILITY-DEBT
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07F-SWEBOK-KA7-MAINTAINABILITY-DEBT
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA7 section 2.1.4, citing ISO/IEC/IEEE 14764, defines
        maintainability as the capability of the software product to be modified
        (corrections, improvements, adaptation to environment changes, and
        changes in requirements and functional specifications), states it should
        be specified, reviewed and controlled during development to reduce
        maintenance costs, and states that compromised maintainability typically
        increases the burden on the engineers who maintain the software in the
        future — in other words, it creates technical debt. It describes debt
        accumulating when the need to quickly address corrective, emergency and
        additive maintenance tasks, constrained by limited time and understanding
        of the software, leads to immediate but potentially under-considered
        solutions that are often not peer-reviewed, and names three areas to
        investigate in depth when addressing technical debt: code quality versus
        relevance (not all technical debt is urgent), alignment with
        organizational objectives, and process loss (complementary skills of the
        engineers involved).
      context: "SWEBOK Guide v4.0a Chapter 7 section 2.1.4 Maintainability, printed pages 7-6 to 7-7."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The maintainability definition, the maintainability-to-technical-debt linkage, the accumulation mechanism and the three investigation areas were confirmed."
      limitations:
        - "The maintainability definition is attributed to ISO/IEC/IEEE 14764, whose text remains metadata-only in this project."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07F-SWEBOK-ORG-PRIORITIES
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07F-SWEBOK-KA7-ORG-OBJECTIVES
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA7 section 2.2.1 observes that, as a consequence of
        maintenance economics being less visible than development economics,
        adding new features is often given higher priority than other maintenance
        activities such as refactoring, security or performance improvement, and
        that such organizational objectives and constraints must be balanced with
        software maintainability and engineering standards to avoid code decay
        and technical debt. It also notes that applying product management
        approaches to development and maintenance can help organizations
        understand the total cost of operational software over its full life
        cycle and compare the costs and benefits of developing new software
        versus enhancing existing software.
      context: "SWEBOK Guide v4.0a Chapter 7 section 2.2.1 Alignment with Organizational Objectives, printed pages 7-7 to 7-8."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The feature-priority pressure, the balance-against-maintainability requirement and the develop-new versus enhance-existing comparison were confirmed."
      limitations:
        - "The section characterizes common organizational behavior; it does not quantify the priority skew."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07F-SWEBOK-TECH-DEBT-COST
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07F-SWEBOK-KA7-TECH-DEBT-COST
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA7 section 2.3.1 states that technical debt generally
        makes code more expensive to maintain than it has to be and represents
        the effort required to fix problems that remain in the code when an
        application is initially released by the development team. It names size,
        complexity, the number of engineering flaws, and violations of good
        architectural design and coding practices in the source code as
        indicators and techniques that can help engineers measure technical debt,
        and attributes to ISO/IEC/IEEE 14764 a list of maintainability
        improvements (legibility, structured code, reduced complexity, accurate
        comments, error tracing, code-to-design traceability, inspections and
        code reviews). It identifies the uncertain reward for addressing debt —
        or for implementing any potential enhancement — as a common barrier, and
        lists what organizations need to determine: the quality of their current
        software, the extent of their technical debt, the potential savings from
        investing in quality enhancement, and the impact of current quality
        issues on their business. It closes that technical debt is only one of
        several factors contributing to excess unplanned work, and should not be
        handled in isolation but through examination of its root causes.
      context: "SWEBOK Guide v4.0a Chapter 7 section 2.3.1 Technical Debt Cost Estimation, printed page 7-9."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page index; original paraphrase."
      result: "The debt definition, the measurement indicators, the uncertain-reward barrier, the four organizational determinations and the root-cause requirement were confirmed."
      limitations:
        - "The listed maintainability improvements are SWEBOK's report of ISO/IEC/IEEE 14764 suggestions; the ISO text was not ingested."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07F-SWEBOK-REFACTORING
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07F-SWEBOK-KA7-REENGINEERING
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA7 section 4.2 defines software reengineering as the
        examination and alteration of software to reconstitute it in a new form,
        including the subsequent implementation of the new form, noting it is
        often undertaken not to improve maintainability but to replace aging
        legacy software. It defines refactoring as a reengineering technique that
        aims to reorganize a program without changing its behavior, seeking to
        improve the internal structure and maintainability of software, and
        states refactoring techniques can be used during maintenance activities
        to reduce the technical debt of the codebase before and after code
        changes. It further notes that in Agile development the incremental
        nature of continuous integration often requires the code to be
        continuously refactored, supporting volatile life cycles by reducing and
        managing growing complexity while improving developer productivity.
      context: "SWEBOK Guide v4.0a Chapter 7 section 4.2 Software Reengineering, printed pages 7-13 to 7-14."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The reengineering definition including the legacy-replacement purpose, the behavior-preserving refactoring definition, the debt-reduction role before and after changes, and the continuous-refactoring observation were confirmed."
      limitations:
        - "The continuous-integration remark is cited here only as refactoring context; CI/CD delivery mechanics belong to the 07E lane boundary and are not recorded by this lane."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07F-SWEBOK-REVERSE-ENGINEERING
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07F-SWEBOK-KA7-REVERSE-ENGINEERING
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA7 section 4.3 defines reverse engineering as the
        process of analyzing software to identify its components and their
        interrelationships and to create representations of the software in
        another form or at higher levels of abstraction; it is passive, changing
        neither the software nor producing new software. Its named types are
        re-documentation, design recovery and data reverse engineering (recovering
        logical schemata from physical databases), and software visualization
        tools commonly accompany quality assurance features such as quality
        metrics calculation, technical debt estimation and detection of bad
        design and coding practices (code smells).
      context: "SWEBOK Guide v4.0a Chapter 7 section 4.3 Reverse Engineering, printed page 7-14."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page index; original paraphrase."
      result: "The passive-analysis definition, the three named types and the tooling features including debt estimation and code-smell detection were confirmed."
      limitations:
        - "The section names tool categories without evaluating specific tools."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07F-SWEBOK-KA8-SCR-PROCESS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07F-SWEBOK-KA8-CHANGE-CONTROL
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA8 section 3.1 describes the software change request
        (SCR) process as providing formal procedures for submitting and recording
        change requests, evaluating the potential cost and impact of a proposed
        change, and accepting, modifying, deferring or rejecting it; a change
        request may be originated by anyone at any point in the life cycle, with
        the type of change (defect or enhancement) usually recorded, and an
        emergency path usually also exists where changes are implemented with the
        change process performed afterward. Once an SCR is received, a technical
        evaluation — also known as an impact analysis — determines the extent of
        the modifications necessary should the request be accepted. The authority
        for accepting or rejecting proposed changes rests with a configuration
        control board (on smaller projects possibly the leader or an assigned
        individual, with an SCM representative always present), whose composition
        can vary by criticality, nature of the change and life-cycle position.
        Section 3.2 adds that approved SCRs are implemented using defined
        procedures, that a means for tracking which SCRs are incorporated into
        particular software versions and baselines must be provided, and that
        completed changes may undergo configuration audits and quality
        verification including ensuring that only approved changes have been
        made.
      context: "SWEBOK Guide v4.0a Chapter 8 sections 3-3.2 Software Configuration Change Control, printed pages 8-9 to 8-10."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase. Cited for maintenance/change-control relevance only; CI/CD delivery mechanics remain outside this lane."
      result: "The SCR process steps, the impact-analysis technical evaluation, the CCB authority and the implementation tracking and audit close-out were confirmed."
      limitations:
        - "Only the change-control sections of KA8 were inspected; the rest of the SCM knowledge area belongs to other lanes' scope."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07F-CS2023-REFACTORING-KU
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07F-CS2023-REFACTORING-KU
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        The CS2023 SE knowledge unit 'SE-Refactoring: Refactoring and Code
        Evolution' lists as KA Core topics: Hyrum's Law (the Law of Implicit
        Interfaces); backward compatibility, including that compatibility is not
        a property of a single entity but a property of a relationship, and that
        it needs to be evaluated in terms of provider plus consumer(s) or with a
        well-specified model of what forms of compatibility a provider aspires to
        or promises; refactoring, covering standard refactoring patterns (rename,
        inline, outline, etc.), use of refactoring tools in IDEs, application of
        static-analysis tools to identify code in need of refactoring and to
        generate changes, and the value of refactoring as a remedy for technical
        debt; and versioning, covering Semantic Versioning and trunk-based
        development. Its Non-core topic addresses large-scale refactoring —
        techniques for when a refactoring change is too large to commit safely
        or when change cannot be synchronized between a provider and all
        consumers (multiple repositories, consumers with private code) — naming
        the techniques of expressing both old and new APIs so that they can
        co-exist and minimizing the size of behavior changes, and asking why the
        techniques are required ('API consumers I can see' versus 'consumers I
        can't see'). Its illustrative learning outcomes include identifying both
        explicit and implicit behavior of an interface and the potential risks
        from Hyrum's Law, identifying changes that can be broadly considered
        backward compatible, and evaluating whether a proposed change is
        sufficiently safe given the versioning methodology in use.
      context: "CS2023 Software Engineering knowledge unit SE-Refactoring: Refactoring and Code Evolution, KA Core topics 1-4 and Non-core topic 5 with illustrative learning outcomes."
      method: "Read the verbatim topic extraction of the official CS2023 Body of Knowledge PDF produced on 2026-11-07 (full text via extraction service; binary download unavailable from this network); heading-anchored KU locator, printed page not independently confirmed."
      result: "Topics 1-5 with their subtopics and the selected learning outcomes were confirmed against the verbatim extraction."
      limitations:
        - "Curriculum topic titles and outcomes only; the unit does not rank methods or prescribe professional procedure."
        - "Semantic Versioning and trunk-based development are named as versioning topics without the curriculum defining them here."
      uncertainty:
        - "The knowledge unit's printed page number was not independently confirmed; heading-anchored citation within the registry-recorded SE section span is used."
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false

        application is initially released, per SWEBOK Guide v4.0a KA7 section
        2.3.1, which also states debt generally makes code more expensive to
        maintain than it has to be; KA7 section 2.1.4 adds that compromised
        maintainability creates technical debt when quick, under-considered and
        often unreviewed maintenance solutions accumulate.

    - id: se:CLM-07F-SWEBOK-KA8-SCR-PROCESS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      statement: >-
        SWEBOK Guide v4.0a KA8 section 3 presents software configuration change
        control as a process for determining what changes to make, the authority
        for approving them, and support for implementing them: the SCR process
        provides formal procedures for submitting and recording change requests,
        evaluating potential cost and impact, and accepting, modifying, deferring
        or rejecting them; the technical evaluation is also known as an impact
        analysis; authority rests with a configuration control board (or a leader
        or assigned individual on smaller projects); and implementation includes
        tracking which SCRs enter particular versions and baselines, closing with
        audits that verify only approved changes were made.
      claim_kind: PRACTICE_CLAIM
      scope_description: "SWEBOK Guide v4.0a KA8 sections 3-3.2; generally accepted change-control process description, cited here for its maintenance relevance."
      applicability: "Controlled change to configuration items during the software life cycle, including maintenance-phase changes."
      assumptions: []
      exceptions:
        - "The section itself notes an emergency path usually also exists, where changes are implemented first and the change process is performed afterward."
      limitations:
        - "Change-to-CI rules can differ by industrial sector and company; SWEBOK states its description applies where no specific rules exist."
      uncertainty: []
      review_status: PENDING

  principles:
    - id: se:PRI-07F-PRESERVE-INTEGRITY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Preserve integrity while modifying operational software
      statement: >-
        Modifications to operational software should be made in a way that
        preserves the integrity of the existing software product: the objective
        of maintenance is to modify existing software while preserving its
        integrity, and change should flow through analysis and control rather
        than unmanaged direct alteration.
      rationale: >-
        SWEBOK Guide v4.0a KA7 section 1.1 reports the ISO/IEC/IEEE 14764
        objective of software maintenance as modifying existing software while
        preserving its integrity, and KA8 section 3 describes the formal SCR
        evaluation and approval process with end-of-process audits that verify
        only approved changes have been made.
      scope_description: "Derived within SWEBOK v4.0a KA7/KA8 inspected-section scope; not asserted as a universal law beyond professional-BOK report."
      applicability: "Operational software products receiving maintenance modification, plan-based or Agile."
      exceptions:
        - "Emergency maintenance performs unscheduled modification to temporarily keep a system operational, with the formal process performed afterward (SWEBOK KA8 emergency path; KA7 1.6)."
      limitations:
        - "The principle's strength beyond the inspected sections is untested in this lane; no case evidence is cited."
    - id: se:PRI-07F-MANAGE-EVOLUTION-COMPLEXITY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Actively counter complexity growth in evolving software
      statement: >-
        In an evolving software product, growth in complexity must be actively
        countered — for example by refactoring to reduce technical debt — or the
        product becomes progressively less satisfactory to its users; change is
        continuous, so complexity management is a continuing activity rather
        than a one-time fix.
      rationale: >-
        SWEBOK Guide v4.0a KA7 section 1.5 reports Lehman's laws of Continuing
        Change (software must be continually adapted or it becomes progressively
        less satisfactory) and Increasing Complexity (complexity increases unless
        work is done to maintain or reduce it), and section 4.2 presents
        refactoring during maintenance as the behavior-preserving technique for
        improving internal structure and reducing technical debt.
      scope_description: "Derived from SWEBOK KA7 sections 1.5 and 4.2 as BOK-reported findings; the underlying evolution research is cited secondhand and is not lane-verified."
      applicability: "Long-lived software products expected to evolve across multiple releases; short-lived or throwaway artifacts are out of scope."
      exceptions:
        - "Software approaching retirement, where investment in complexity reduction has no payback horizon."
      limitations:
        - "The laws are empirical research summaries reported by SWEBOK; their generalization is contested territory this lane does not adjudicate."

  practices:
    - id: se:PRA-07F-CHANGE-IMPACT-ANALYSIS
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Maintenance impact analysis before change
      intent: >-
        Understand the detailed effects a proposed maintenance change has on
        existing software before implementing it, so that affected items,
        resource needs and risks are known when the change decision is made.
      description: >-
        Translate the modification request or problem report into software terms,
        identify the systems and software products the change would affect,
        estimate the resources needed to accomplish it, determine the risks
        involved, and recommend a course of action — following SWEBOK KA7
        2.1.3, which locates the analysis after the change request enters the
        SCM process and matches KA8 3.1's technical evaluation of an SCR.
      preconditions:
        - "A logged change request (MR or PR) with enough context to translate into software terms."
        - "Maintainer knowledge of the software's structure and content, supported where possible by maintainability-conscious design."
      steps:
        - "Receive the change request through the SCM/SCR process and record its type (defect or enhancement) and severity."
        - "Translate the request into software terms using knowledge of the software's structure and content."
        - "Identify all systems and software products that would be affected by the change."
        - "Estimate the resources needed to accomplish the change and determine the risks involved."
        - "Develop potential solutions and recommend a course of action to the change authority."
      expected_outcomes:
        - "An impact statement covering affected items, resource estimate and risk determination attached to the change request."
        - "A recommendation that the change authority can accept, modify, defer or reject on an informed basis."
      risks:
        - "Analysis cost grows with system size; SWEBOK asks that it be conducted as cost-effectively as possible."
        - "Incomplete structural knowledge yields missed affected items."
      scope_description: "Operationalizes SWEBOK v4.0a KA7 2.1.3 and KA8 3.1 at BOD-described fidelity; not a tool-specific procedure."
      applicability: "Maintenance change requests routed through SCM-controlled change processes."
      evidence_refs:
        - se:EVD-07F-SWEBOK-IMPACT-ANALYSIS
        - se:EVD-07F-SWEBOK-KA8-SCR-PROCESS
      claim_refs:
        - se:CLM-07F-SWEBOK-IMPACT-ANALYSIS-ROLE
    - id: se:PRA-07F-TECH-DEBT-ASSESSMENT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Measured technical-debt assessment before debt decisions
      intent: >-
        Base technical-debt decisions on measured evidence about current
        quality, debt extent, potential savings and business impact instead of
        treating debt work as uniformly urgent or uniformly deferrable.
      description: >-
        Use available tooling and indicators — size, complexity, engineering
        flaw counts and violations of good architectural design and coding
        practices — to measure technical debt, then determine the quality of
        current software, the extent of the debt, the potential savings from
        quality investment and the impact of current quality issues on the
        business, treating debt as one contributor to unplanned work and
        examining root causes rather than handling it in isolation, per SWEBOK
        KA7 2.3.1 with the urgency triage of 2.1.4.
      preconditions:
        - "Access to tooling that computes the debt indicators on the codebase (SWEBOK names static analysis and quality assessment tooling, including visualization tools with debt estimation and code-smell detection)."
        - "A business owner able to state the impact of quality issues on the business."
      steps:
        - "Measure debt indicators (size, complexity, flaws, practice violations) with available tooling."
        - "Triage urgency: not all technical debt is urgent (code quality versus relevance)."
        - "Determine potential savings from investing in quality enhancement."
        - "Determine the impact of current quality issues on the business."
        - "Examine root causes, including team and process factors, before selecting remediation."
      expected_outcomes:
        - "A quantified debt picture with urgency and business-impact attribution that can drive prioritization."
      risks:
        - "Indicator tooling measures proxies; numbers can be gamed or misread."
        - "Uncertain reward is a common barrier; measurement alone does not create stakeholder buy-in."
      scope_description: "Operationalizes SWEBOK v4.0a KA7 2.3.1 (with 2.1.4 triage and 4.3 tooling) at BOK-described fidelity."
      applicability: "Organizations deciding whether and where to invest maintenance capacity in debt reduction."
      evidence_refs:
        - se:EVD-07F-SWEBOK-TECH-DEBT-COST
        - se:EVD-07F-SWEBOK-MAINTAINABILITY-DEBT
      claim_refs:
        - se:CLM-07F-SWEBOK-TECH-DEBT-DEFINITION
    - id: se:PRA-07F-REFACTORING-WITH-TOOLS
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Tool-assisted refactoring around maintenance changes
      intent: >-
        Reduce the technical debt of the codebase around functional change work
        by applying standard refactoring patterns with IDE and static-analysis
        tool support, without changing program behavior.
      description: >-
        Identify code in need of refactoring with static-analysis tools, apply
        standard refactoring patterns (rename, inline, outline, etc.) using IDE
        refactoring tooling, and use refactoring before and after code changes
        during maintenance to reduce technical debt — combining the CS2023
        SE-Refactoring tool topics (3a-3c) with SWEBOK KA7 4.2's placement of
        refactoring in maintenance activity.
      preconditions:
        - "Behavior-preserving safety net (tests or verification) sufficient to detect unintended behavior change."
        - "IDE refactoring support and static-analysis tooling for the language and codebase."
      steps:
        - "Run static analysis to identify code in need of refactoring and to help generate candidate changes."
        - "Select standard refactoring patterns appropriate to the identified problem."
        - "Apply refactorings with IDE tool support around the planned functional change."
        - "Verify behavior is unchanged (regression testing is the maintenance-relevant check per SWEBOK KA7 2.1.2 context)."
      expected_outcomes:
        - "Reduced technical debt and improved internal structure without intended behavior change, applied incrementally alongside maintenance work."
      risks:
        - "Refactorings too large to commit safely require large-scale techniques (see se:PAT-07F-DUAL-API-LARGE-SCALE-REFACTORING)."
        - "Tool-assisted changes can still alter observable behavior; behavior preservation is an aim, not a guarantee."
      scope_description: "Operationalizes CS2023 SE-Refactoring KA Core topics 3a-3c with SWEBOK KA7 4.2 maintenance framing; curriculum and BOK sources are combined at their respective fidelities."
      applicability: "Maintained codebases with tool support and a behavior safety net."
      evidence_refs:
        - se:EVD-07F-CS2023-REFACTORING-KU
        - se:EVD-07F-SWEBOK-REFACTORING
      claim_refs:
        - se:CLM-07F-CS2023-REFACTORING-DEBT-REMEDY

  patterns:
    - id: se:PAT-07F-DUAL-API-LARGE-SCALE-REFACTORING
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Dual-API coexistence for large-scale refactoring
      problem: >-
        A needed refactoring is too large to commit safely, or the change cannot
        be synchronized between the provider and all its consumers (multiple
        repositories, consumers with private code), so a single atomic breaking
        change is not feasible.
      context: >-
        An evolving interface or subsystem whose consumers are not all visible or
        not all controllable at once, per the CS2023 SE-Refactoring Non-core
        large-scale refactoring topic, whose rationale contrasts 'API consumers
        I can see' with 'consumers I can't see'.
      forces:
        - "Old and new forms must both remain usable while consumers migrate."
        - "Behavior changes should stay small enough to evaluate for compatibility."
        - "Unseen consumers may depend on implicit interface behavior (Hyrum's Law topic of the same unit)."
        - "Migration coordination across repositories costs time and organization."
      solution: >-
        Express both the old and the new APIs so that they can co-exist during
        migration, and minimize the size of behavior changes, per the CS2023
        Non-core techniques for large-scale refactoring.
      consequences:
        - "Consumers migrate incrementally instead of in one forced cutover."
        - "Smaller behavior changes are easier to evaluate as backward compatible, consistent with the unit's relational compatibility topic."
        - "The dual-API period itself carries maintenance cost until the old API is retired."
      tradeoffs:
        - "Coexistence plumbing adds temporary complexity that must eventually be removed; the curriculum topic names the techniques without prescribing the retirement timeline."
      scope_description: "CS2023 SE-Refactoring Non-core topic 5 (elective curriculum scope); a curriculum-named technique pair, not a lane-invented procedure."
      evidence_refs:
        - se:EVD-07F-CS2023-REFACTORING-KU

  anti_patterns:
    - id: se:ANT-07F-UNMANAGED-TECH-DEBT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Unmanaged technical-debt accumulation
      symptoms:
        - "The codebase is more expensive to maintain than it has to be; maintenance burden on engineers keeps rising."
        - "Quick fixes land without peer review under corrective, emergency and additive pressure."
        - "New features are consistently prioritized over refactoring, security or performance improvement; code decay sets in."
      causes:
        - "Compromised maintainability: maintainability not specified, reviewed and controlled during development."
        - "Time and comprehension constraints on maintainers producing immediate but under-considered solutions."
        - "Maintenance economics less visible than development economics, so debt cost is not quantified in management reporting."
        - "Uncertain reward for debt work discouraging investment."
      consequences:
        - "Technical debt accumulates and takes additional time and effort to address during later maintenance."
        - "Excess unplanned work grows, with team and process issues compounding the code-level debt."
        - "Program comprehension and subsequent impact analysis become harder as structure degrades."
      remediation: >-
        Measure the debt (size, complexity, flaws, practice violations) with
        available tooling; determine current quality, debt extent, potential
        savings and business impact; triage urgency (not all debt is urgent);
        balance organizational objectives with maintainability and engineering
        standards; and address root causes including team and process factors
        rather than handling debt in isolation — per SWEBOK KA7 2.1.4, 2.2.1
        and 2.3.1, with refactoring (KA7 4.2, CS2023 topic 3) as the named
        remediation technique for code-level debt.
      scope_description: "Grounded in SWEBOK v4.0a KA7 sections 2.1.4, 2.2.1 and 2.3.1, whose text directly characterizes this accumulation pattern and its costs; severity of specific consequences is not evidenced by real cases in this lane."
      evidence_refs:
        - se:EVD-07F-SWEBOK-MAINTAINABILITY-DEBT
        - se:EVD-07F-SWEBOK-ORG-PRIORITIES
        - se:EVD-07F-SWEBOK-TECH-DEBT-COST

  decision_models:
    - id: se:DEC-07F-DEBT-VERSUS-FEATURES
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      decision_question: >-
        When should a maintenance organization invest capacity in reducing
        technical debt (for example refactoring) instead of delivering new
        features?
      options:
        - "Invest in debt reduction (refactoring, quality enhancement) now"
        - "Prioritize new features and defer debt reduction"
        - "Mixed allocation: debt work sized against measured urgency and business impact"
      criteria:
        - "Quality of the current software (measured)."
        - "Extent of technical debt (measured with size, complexity, flaw and practice-violation indicators)."
        - "Potential savings from investing in quality enhancement."
        - "Impact of current quality issues on the business."
        - "Urgency triage: not all technical debt is urgent (code quality versus relevance)."
        - "Alignment of the software architecture with organizational objectives."
      constraints:
        - "Organizational objectives and constraints must be balanced with maintainability and engineering standards to avoid code decay and technical debt."
        - "Debt is only one of several factors contributing to excess unplanned work; team and process issues may dominate."
      procedure: >-
        Measure the debt indicators; record current quality, debt extent,
        potential savings and business impact; triage debt items by urgency;
        compare the measured case for debt reduction against the feature
        roadmap's business objectives; choose an allocation (debt now, features
        now, or mixed) and re-measure after the next interval, examining root
        causes wherever unplanned work stays high. This procedure structures the
        SWEBOK KA7 2.1.4/2.2.1/2.3.1 guidance; the single-procedure form is a
        lane synthesis (see se:EVD-07F-SYNTHESIS-DEBT-PRIORITIZATION).
      tradeoffs:
        - "Debt-first allocation improves future velocity but delays user-visible value; feature-first allocation delivers value now at the risk of code decay."
        - "Mixed allocation needs measurement discipline to avoid becoming an unprincipled split."
      scope_description: "Structured from SWEBOK v4.0a KA7 sections 2.1.4, 2.2.1 and 2.3.1; a lane-structured decision aid, not a professional-standard decision procedure."
      evidence_refs:
        - se:EVD-07F-SYNTHESIS-DEBT-PRIORITIZATION
      claim_refs:
        - se:CLM-07F-SWEBOK-TECH-DEBT-DEFINITION


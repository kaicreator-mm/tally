scope_note: >-
  Implementation / code engineering vertical-slice lane (SEK-07B) grounded in
  direct reinspection of SWEBOK Guide v4.0a KA4 Software Construction
  (Introduction and section 1; subsections 3.3, 3.6, 3.7, 4.1, 4.4, 4.5) from
  the registry-hash-verified official PDF, plus the CS2023 knowledge units
  SE-Construction: Software Construction, SDF-Practices: Software Development
  Practices, the SE-Tools analysis-tooling topic, and the SE-Design code-smell
  topic from the SEK-06 verified anchors pack. Scope covers code structure and
  coding practices, construction quality techniques, integration strategy at
  code level, API design and use, assertions/contracts/defensive programming,
  error and exception handling, static/dynamic analysis at code level, and
  code-level maintainability. It excludes secure-coding content detail (07C),
  CI/CD delivery mechanics (07E), reliability/performance engineering depth
  (07D), refactoring/technical-debt lifecycle depth (07F) and general
  architecture design (SEK-06). All knowledge records remain PROPOSED or
  PENDING_REVIEW; none is ACCEPTED. Source entities are not stored in this
  lane file; the validation harness derives them from SOURCE_REGISTRY.yaml.
review_policy: "No record is ACCEPTED until a human reviewer verifies source, locator, interpretation, applicability and rights."

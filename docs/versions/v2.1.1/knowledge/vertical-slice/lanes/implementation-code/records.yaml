  principles:
    - id: se:PRI-07B-MINIMIZE-COMPLEXITY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Minimize complexity; prefer simple, readable code
      statement: >-
        Software construction should minimize complexity, favoring simple and
        readable code over clever code, because people's limited working-memory
        capacity constrains the complex structures they can hold, and reduced
        complexity benefits essentially every construction activity, testing in
        particular.
      rationale: >-
        SWEBOK Guide v4.0a KA4 section 1.1 grounds the goal in limited human
        working memory (especially over long periods), states the need applies
        to essentially every aspect of software construction and is
        particularly critical to testing, and names standards, modular design
        and construction-focused quality techniques as the supports through
        which reduced complexity is achieved.
      scope_description: "Professional-BOK scope (SWEBOK Guide v4.0a KA4 section 1.1, printed page 4-2); a guide to generally accepted knowledge, not an empirical effect claim."
      applicability: "Construction of code intended to be read, tested and changed by people other than a single author."
      exceptions: []
      limitations:
        - "The Guide states no exceptions to this goal in the inspected text; nothing in this lane may be read as licensing unnecessary complexity."
        - "Strength of the principle beyond the Guide's assertion (for example measured maintainability effects) is untested in this lane; no empirical evidence is cited."

  practices:
    - id: se:PRA-07B-CONSTRUCT-FOR-VERIFICATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Construct for verification
      intent: >-
        Build code so that faults can be readily found by the engineers
        writing it and by testers and users during independent testing and
        operational activities.
      description: >-
        Apply the four technique families SWEBOK KA4 1.3 names for
        constructing for verification: follow coding standards that support
        code reviews and unit testing; organize code so it supports automated
        testing; restrict the use of complex or difficult-to-understand
        language structures; and record software behaviors with logs.
      preconditions:
        - "A coding standard is adopted or adaptable to review and unit-testing needs."
        - "Automated testing is available or planned for the constructed units."
        - "A logging facility is available whose output can be inspected during testing and operations."
      steps:
        - "Align the coding standard with what code reviews and unit tests need to consume (naming, structure, size)."
        - "Organize the code into units and seams that automated tests can exercise in isolation."
        - "Constrain the use of complex or difficult-to-understand language constructs to cases where they are justified and documented."
        - "Record software behaviors with logs at a level usable for fault finding during testing and operations."
      expected_outcomes:
        - "Faults findable by the code's authors during construction as well as by independent testers and users."
      risks:
        - "Standards and structure work add upfront effort that may be misallocated on trivial code."
        - "Logging adds noise and runtime cost if levels are not chosen deliberately."
        - "Restricting language constructs can exclude justified advanced uses if applied without review."
      scope_description: "Operationalizes SWEBOK Guide v4.0a KA4 section 1.3 (printed page 4-4) at professional-BOK fidelity; the Guide names the technique families without thresholds."
      applicability: "Construction work whose output will be reviewed, unit-tested or operated by others."
      evidence_refs:
        - se:EVD-07B-SWEBOK-CONSTRUCT-FOR-VERIFICATION
      claim_refs: []
    - id: se:PRA-07B-INTERFACE-DOCUMENTATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Contract-style interface documentation
      intent: >-
        Make a module's interface expectations explicit enough that consumers
        and reviewers can check use against stated behavior.
      description: >-
        For each constructed module interface, document the interface
        requirements, potentially including formal or informal contracts, pre
        and post conditions and invariants, following the CS2023
        SE-Construction documentation topic; keep implementation documentation
        focused on tricky and non-obvious code, clarifying dataflow and
        computation, and prefer refactoring toward self-explanatory code over
        comments that restate obvious operations.
      preconditions:
        - "A module interface whose behavior can be stated as expectations on inputs, outputs and state."
        - "An agreed notation for contracts, pre/post conditions and invariants (formal or informal)."
      steps:
        - "Enumerate the interface's operations with their inputs, outputs and observable effects."
        - "State contracts, pre and post conditions and invariants for those operations where applicable."
        - "Review implementation comments against the non-obvious-only rule, deleting restatements of common operations."
        - "Where a tricky piece can be refactored to be self-explanatory, refactor before documenting it."
      expected_outcomes:
        - "Interface expectations inspectable by consumers and reviewers independently of the implementation."
        - "Implementation documentation concentrated on genuinely tricky and non-obvious code."
      risks:
        - "Contracts drift from the implementation when either changes without the other."
        - "Full formal contracts may exceed the value on small or stable interfaces."
      scope_description: "Operationalizes CS2023 SE-Construction CS Core topic 2 (subtopics 2a and 2b) at curriculum fidelity; a teaching-scope practice, not a professional documentation standard."
      applicability: "Constructed modules whose interfaces are consumed by other developers or reviewers."
      evidence_refs:
        - se:EVD-07B-CS2023-CONSTRUCTION-KU
      claim_refs: []
    - id: se:PRA-07B-STATIC-ANALYSIS-INTEGRATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Integrate static and dynamic analysis into the development environment
      intent: >-
        Surface code-level faults and code-quality indications early by making
        analysis tooling part of the environment where code is written and
        built.
      description: >-
        Select static and dynamic analysis tools appropriate to the language
        and platform, wire them into the editor/IDE and build workflow, and
        triage their findings in the team's review process; CS2023 SE-Tools
        frames the curriculum expectation as describing how such tools can be
        integrated into the software development environment, and SWEBOK KA4
        3.6 lists static analysis among the primary construction-quality
        techniques.
      preconditions:
        - "Analysis tooling available for the project's language(s) and platform(s)."
        - "A place in the developer workflow (editor, build, or both) where tool output is actually seen."
      steps:
        - "Select static and dynamic analysis tools matching the language, platform and risk profile."
        - "Integrate the tools into the development environment so findings appear where code is written or built."
        - "Triage findings with the review workflow, distinguishing blocking from advisory results."
      expected_outcomes:
        - "Code-level faults and quality indications visible during construction rather than after release."
      risks:
        - "High false-positive rates can erode trust and bury important findings."
        - "Tool sprawl adds maintenance cost without process ownership."
      scope_description: "Operationalizes the CS2023 SE-Tools tool-integration expectation with SWEBOK KA4 3.6's static-analysis placement as the professional-BOK counterpart; selection and triage detail is lane-added procedure, not source text."
      applicability: "Teams constructing code in languages with usable analysis tooling."
      evidence_refs:

  patterns:
    - id: se:PAT-07B-INCREMENTAL-INTEGRATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Incremental integration
      problem: >-
        Individually constructed routines, classes, components and subsystems
        must be combined into a single system while keeping errors locatable
        and progress visible during construction.
      context: >-
        A construction effort in which parts are built and tested separately
        and the team can choose the integration sequence and interim
        scaffolding, as described in SWEBOK Guide v4.0a KA4 section 3.7.
      forces:
        - "Error-location ease versus scaffolding effort."
        - "Progress monitoring versus integration ceremony."
        - "Early usable feedback versus degree of pre-integration testing."
      solution: >-
        Write and test the program in small pieces and combine the pieces one
        at a time, building and integrating a unit (for example a class or
        component) at a time, supported by additional test infrastructure such
        as stubs, drivers and mock objects, so the construction process
        provides early feedback to developers and customers.
      consequences:
        - "The advantages SWEBOK names for incremental integration: easier error location, improved progress monitoring, earlier product delivery and improved customer relations."
        - "Additional test infrastructure (stubs, drivers, mocks) must be built and maintained."
      tradeoffs:
        - "Scaffolding and interim-version testing cost is traded against late-event risk concentration."
      scope_description: "Grounded in SWEBOK Guide v4.0a KA4 section 3.7 at professional-BOK fidelity; the advantage list is hedged in the source ('thought to offer')."
      evidence_refs:
        - se:EVD-07B-SWEBOK-INTEGRATION
    - id: se:PAT-07B-DESIGN-BY-CONTRACT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Design by contract at routine level
      problem: >-
        Routine-level semantics left implicit allow mismatched interface
        assumptions between callers and callees that surface late, and errors
        that creep in when code is modified go unnoticed at the boundary.
      context: >-
        Construction of routines and modules whose interface expectations can
        be stated precisely, in an environment where runtime checks can be
        compiled in during development and compiled out afterwards, as
        described in SWEBOK Guide v4.0a KA4 section 4.4.
      forces:
        - "Precision of stated semantics versus contract authoring effort."
        - "Runtime checking cost versus earlier fault exposure."
      solution: >-
        Include preconditions and postconditions for each routine so each
        routine or class forms a contract with the rest of the program that
        precisely specifies its semantics; implement the checks as assertions
        that are compiled into the code at development time and compiled out
        later so they do not degrade performance.
      consequences:
        - "Clarified routine behavior and faster flushing out of mismatched interface assumptions and modification-introduced errors (stated for assertions in SWEBOK 4.4)."
        - "SWEBOK hedges that design by contract is thought to improve the quality of software construction."
      tradeoffs:
        - "Contract authoring and maintenance effort; production runs without the development-time checks once assertions are compiled out."
      scope_description: "Grounded in SWEBOK Guide v4.0a KA4 section 4.4 at professional-BOK fidelity; the quality-effect claim remains hedged as in the source."
      evidence_refs:
        - se:EVD-07B-SWEBOK-DBC-ERROR

  anti_patterns:
    - id: se:ANT-07B-BIG-BANG-INTEGRATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Big bang (phased) integration as the default strategy
      symptoms:
        - "Faults and interface mismatches surface together in one late integration event instead of progressively."
        - "Error location is difficult because all parts land at once."
        - "Progress between code-complete and integrated is hard to observe."
        - "Feedback to developers and customers arrives late."
      causes:
        - "Treating integration as a terminal milestone rather than an ongoing construction activity."
        - "Deferring integration of component parts until all parts intended for release in a version are complete (SWEBOK's definition of phased integration)."
        - "No interim scaffolding (stubs, drivers, mock objects) or interim-version test points are planned."
      consequences:
        - "Harder fault isolation across simultaneously integrated parts."
        - "Late discovery of integration defects, when structural decisions are already fixed."
        - "Delayed product delivery and customer feedback relative to incremental integration (the contrasts SWEBOK names as incremental's advantages)."
      remediation: >-
        Integrate incrementally: write and test small pieces, combine them one
        at a time with stubs, drivers and mock objects, and determine points
        at which interim versions are tested; or adopt continuous integration
        with an automated pipeline that builds and tests each integration, as
        described in SWEBOK Guide v4.0a KA4 section 3.7.
      scope_description: "Lane-level characterization (SEK-07B): the symptom/causes/consequences framing is a synthesis inversion of SWEBOK 3.7's stated advantages of incremental over phased integration (see se:EVD-07B-SYNTHESIS-BIG-BANG); the Guide names phased/big bang integration and the advantage list but does not itself label it an anti-pattern."
      evidence_refs:
        - se:EVD-07B-SYNTHESIS-BIG-BANG

  decision_models:
    - id: se:DM-07B-INTEGRATION-STRATEGY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      decision_question: "Which integration approach should a construction team use to combine individually constructed components into a system?"
      options:
        - "Phased (big bang) integration: defer integration until all parts intended for release are complete."
        - "Incremental integration: write and test small pieces, combine one at a time (CS2023 additionally names top-down, bottom-up and sandwich variants for comparison)."
        - "Continuous integration: frequent integrations per day, automated by a build-and-test pipeline."
      criteria:
        - "Error locatability when an integration fails."
        - "Progress monitoring and feedback timeliness during construction."
        - "Earliness of product delivery and customer feedback."
        - "Availability and cost of test scaffolding (stubs, drivers, mock objects) and automation."
      constraints:
        - "Incremental integration usually requires additional test infrastructure (SWEBOK 3.7)."
        - "Continuous integration requires an automated build-and-test pipeline (SWEBOK 3.7)."
      procedure: >-
        Inventory the components and their testability; assess what
        scaffolding and automation exist or can be built; compare the
        candidate approaches against the criteria for the project context
        using SWEBOK 3.7's contrast axes and CS2023's compare-and-contrast
        exercise (top-down, bottom-up, sandwich); then record the chosen
        strategy together with its scaffolding and interim-version test
        points.
      tradeoffs:
        - "Phased integration needs no interim scaffolding but concentrates risk in one late event; incremental and continuous integration distribute risk and feedback but require infrastructure."
      scope_description: "Structured from SWEBOK Guide v4.0a KA4 section 3.7 and the CS2023 SE-Construction learning outcome 7 naming top-down/bottom-up/sandwich; a decision aid, not a mandate of one strategy."
      evidence_refs:
        - se:EVD-07B-SWEBOK-INTEGRATION
        - se:EVD-07B-CS2023-CONSTRUCTION-KU
      claim_refs:
        - se:CLM-07B-SWEBOK-INTEGRATION-APPROACHES


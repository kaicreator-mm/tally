    # --- lane synthesis (explicitly marked, PROPOSED) ---
    - id: se:EVD-07B-SYNTHESIS-BIG-BANG
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07B-SWEBOK-KA4-INTEGRATION
      evidence_type: SYNTHESIS
      statement: >-
        Lane synthesis (SEK-07B): reading SWEBOK 3.7's description of phased
        integration (deferring integration of component parts until all parts
        intended for release in a version are complete, "also called big bang
        integration") against its named advantages of incremental integration
        (easier error location, improved progress monitoring, earlier product
        delivery, improved customer relations) yields a failure
        characterization of big bang integration: faults and interface
        mismatches surface together in one late event, error location is
        harder, progress between code-complete and integrated is less
        observable, and feedback to developers and customers arrives later.
        The Guide presents the comparison but does not itself label big bang
        integration an anti-pattern; this inversion is a lane inference, not a
        sentence that appears in the Guide.
      context: "Inference inverting SWEBOK Guide v4.0a Chapter 4 section 3.7's stated incremental-integration advantage list onto its phased-integration description; anchored to the same verified locator."
      method: "Lane-level inversion of one verified section's own contrast; no additional source consulted."
      result: "Provides the inference trail motivating the se:ANT-07B-BIG-BANG-INTEGRATION record."
      limitations:
        - "Synthesis inference, not a statement made by SWEBOK."
        - "No empirical case evidence in this lane supports the severity of the characterized failure modes."
      uncertainty:
        - "Whether real teams using phased integration always incur the characterized failure modes is untested in this lane."
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false

  concepts:
    - id: se:CON-07B-CYCLOMATIC-COMPLEXITY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Cyclomatic complexity (SWEBOK KA4 sense)
      definition: >-
        A static-analysis measure of how difficult code is to test and
        understand, computed as the number of linearly independent paths
        through a program's source code; SWEBOK KA4 1.1 attributes the tool to
        Thomas J. McCabe, Sr. (1976) and notes that ideally there should be at
        least that number of test cases.
      concept_kind: METRIC
      scope_description: "Defined at SWEBOK Guide v4.0a KA4 section 1.1 fidelity; the Guide names the measure and its test-case corollary without prescribing thresholds."
      evidence_refs:
        - se:EVD-07B-SWEBOK-MINIMIZE-COMPLEXITY

  evidence_records:
    # --- SWEBOK v4.0a KA4 evidence (2026-11-07 direct reinspection) ---
    - id: se:EVD-07B-SWEBOK-CONSTRUCTION-DEFINITION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07B-SWEBOK-KA4-INTRO-FUNDAMENTALS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA4 defines software construction as the detailed creation
        and maintenance of software through coding, verification, unit testing,
        integration testing and debugging; states the KA is linked to all other
        KAs but most strongly to Software Design (much design work is performed
        during construction) and Software Testing (engineers unit-test and
        integration-test throughout construction); and notes that boundaries
        among design, construction and testing, if any, vary depending on the
        software life cycle processes used in a project.
      context: "SWEBOK Guide v4.0a Chapter 4 Introduction, printed page 4-1."
      method: "Direct inspection of the official SWEBOK v4.0a PDF (SHA-256 0c9db4da0b2425c58cf778b99131eb31bb6c188e98b67163a549a1366d96e511, 411 pages) on 2026-11-07; text extracted at the verified page indices and paraphrased originally."
      result: "The KA definition, its strongest KA linkages and the life-cycle-dependent boundary statement were confirmed for the subdomain anchor and the relatedness edge."
      limitations:
        - "The Introduction describes linkages between knowledge areas, not measured coupling between activities."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07B-SWEBOK-MINIMIZE-COMPLEXITY
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07B-SWEBOK-KA4-INTRO-FUNDAMENTALS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA4 section 1.1 presents minimizing complexity as one of
        the key goals of software construction, grounded in all people having
        limited ability to hold complex structures and information in working
        memory especially over long periods; states the need applies to
        essentially every aspect of construction and is particularly critical
        to testing; gives cyclomatic complexity as an example static-analysis
        measure of how difficult code is to test and understand (tool developed
        by Thomas J. McCabe, Sr. in 1976, counting linearly independent paths
        through source code, with ideally at least that number of test cases);
        and states reduced complexity is achieved by creating simple and
        readable code rather than clever code, using standards, modular design
        and other specific techniques, with construction-focused quality
        techniques also supporting it.
      context: "SWEBOK Guide v4.0a Chapter 4 section 1.1 Minimizing Complexity, printed page 4-2."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The working-memory rationale, the everywhere-and-testing scope claim, the cyclomatic-complexity example with its test-case corollary and the simple-over-clever rule were confirmed."
      limitations:
        - "The Guide asserts the working-memory rationale and the technique supports; it cites no empirical study for them in the inspected text."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07B-SWEBOK-CONSTRUCT-FOR-VERIFICATION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07B-SWEBOK-KA4-INTRO-FUNDAMENTALS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA4 section 1.3 defines constructing for verification as
        building software in such a way that faults can be readily found by the
        software engineers writing the software as well as by testers and users
        during independent testing and operational activities, and names four
        supporting technique families: following coding standards to support
        code reviews and unit testing, organizing code to support automated
        testing, restricting the use of complex or difficult-to-understand
        language structures, and recording software behaviors with logs.
      context: "SWEBOK Guide v4.0a Chapter 4 section 1.3 Constructing for Verification, printed page 4-4."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The definition and the four named technique families were confirmed for the practice record."
      limitations:
        - "The section names the technique families without prescribing thresholds or tooling."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07B-SWEBOK-CODING-CONSIDERATIONS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07B-SWEBOK-KA4-CODING-QUALITY
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA4 section 3.3 lists the considerations applying to the
        coding activity: techniques for creating understandable source code
        including naming conventions and source code layout; use of classes,
        enumerated types, variables, named constants and similar entities; use
        of control structures; handling of error conditions both anticipated
        and exceptional (for example input of bad data); prevention of
        code-level security breaches (for example buffer overflows or array
        index bounds); resource use through exclusion mechanisms and discipline
        in accessing serially reusable resources including threads and database
        locks; source code organization into statements, routines, classes,
        packages or other structures; code documentation; and code tuning.
      context: "SWEBOK Guide v4.0a Chapter 4 section 3.3 Coding, printed page 4-7."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The enumerated coding-consideration list was confirmed as the professional-BOK scope of the coding activity."
      limitations:
        - "The list is an enumeration of considerations, not a comparative ranking or a mandated procedure."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07B-SWEBOK-QUALITY-TECHNIQUES
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07B-SWEBOK-KA4-CODING-QUALITY
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA4 section 3.6 states that faults introduced during
        construction can cause serious quality problems including security
        vulnerabilities, and lists the primary techniques used to ensure the
        quality of code as it is constructed: unit testing and integration
        testing, test-first development, use of assertions and defensive
        programming, debugging, inspections, technical reviews including
        security-oriented reviews, and static analysis. It adds that the
        technique selection depends on the software constructed and on the
        skill set of the software engineers, and that construction quality
        activities are differentiated from other quality activities by their
        focus on artifacts closely related to code, such as detailed design,
        rather than requirements, high-level designs or plans.
      context: "SWEBOK Guide v4.0a Chapter 4 section 3.6 Construction Quality, printed pages 4-8 to 4-9."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The primary-technique enumeration, the selection dependency and the code-adjacent focus were confirmed."
      limitations:
        - "The section enumerates generally accepted techniques; it does not compare their effectiveness."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07B-SWEBOK-INTEGRATION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07B-SWEBOK-KA4-INTEGRATION
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA4 section 3.7 describes integrating individually
        constructed routines, classes, components and subsystems into a single
        system as a key construction activity, with concerns including planning
        the integration sequence, identifying needed hardware, creating
        scaffolding for interim versions, and determining the degree of
        pre-integration testing. It presents phased integration (also called
        big bang integration) as delaying integration of component parts until
        all parts intended for release in a version are complete, and
        incremental integration as writing and testing the program in small
        pieces and combining the pieces one at a time; incremental integration
        is thought to offer many advantages over phased integration (easier
        error location, improved progress monitoring, earlier product delivery,
        improved customer relations) but usually needs additional test
        infrastructure including stubs, drivers and mock objects. It closes by
        noting continuous integration has been widely adopted in practice: a
        team integrates its work frequently, leading to multiple integrations
        per day, usually automated by a pipeline that builds and tests each
        integration.
      context: "SWEBOK Guide v4.0a Chapter 4 section 3.7 Integration, printed pages 4-9 to 4-10."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The integration-concern list, the phased/incremental contrast with its hedged advantage list, the scaffolding requirement and the CI characterization were confirmed."
      limitations:
        - "The advantage list is presented as 'thought to offer', not as a measured empirical result."
        - "CI delivery-pipeline mechanics beyond the construction-side characterization belong to lane SEK-07E scope."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07B-SWEBOK-API-DESIGN
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07B-SWEBOK-KA4-TECHNOLOGIES
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA4 section 4.1 defines an API as a set of signatures
        exported and available to users of a library or framework, states that
        besides signatures an API should always include statements about the
        program's effects and/or behaviors (its semantics), and lists the
        design goals that an API be easy to learn and memorize, lead to
        readable code, be difficult to misuse, be easy to extend, be complete,
        and maintain backward compatibility; because APIs usually outlast their
        implementations for a widely used library or framework, an API should
        be straightforward and stable. It describes API use as selecting,
        learning, testing, integrating and possibly extending APIs, notes the
        OpenAPI standard for HTTP APIs with code generation, and reports the
        API-first approach of designing and building an application's APIs
        first, usually with an API description language establishing a contract
        for expected behavior.

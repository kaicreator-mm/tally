    - id: se:EVD-07B-SWEBOK-DBC-ERROR
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07B-SWEBOK-KA4-TECHNOLOGIES
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA4 section 4.4 defines an assertion as an executable
        predicate placed in a program that performs runtime checks, notes
        assertions are especially useful in high-reliability programs for
        flushing out mismatched interface assumptions and errors introduced by
        modifications, and that they are typically compiled into the code at
        development time and later compiled out so they do not degrade
        performance. It defines design by contract as a development approach
        in which preconditions and postconditions are included for each routine
        so that each routine or class forms a contract with the rest of the
        program, precisely specifying the routine's semantics; design by
        contract is said to be thought to improve the quality of software
        construction. Defensive programming means protecting a routine from
        being broken by invalid inputs, commonly by checking input parameter
        values and deciding how to handle bad inputs, with assertions often
        used for the checks. Section 4.5 adds that how errors are handled
        affects correctness, robustness and other nonfunctional attributes, and
        lists exception-handling policy principles such as including in the
        exception message all information that led to the exception, avoiding
        empty catch blocks, knowing the exceptions library code throws,
        possibly building a centralized exception reporter, and standardizing
        the program's use of exceptions.
      context: "SWEBOK Guide v4.0a Chapter 4 sections 4.4 and 4.5, printed pages 4-10 to 4-11."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The assertion, design-by-contract and defensive-programming definitions and the exception-policy principles were confirmed, with the Guide's own hedge on the quality effect preserved."
      limitations:
        - "The quality improvement of design by contract is hedged in the source ('is thought to improve') and is not an empirical finding in the inspected text."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false

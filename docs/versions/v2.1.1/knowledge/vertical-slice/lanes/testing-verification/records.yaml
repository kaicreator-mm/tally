  # --------------------------------------------------------------- practices
  practices:
    - id: se:PRA-TVV-CONTEXT-GATED-CODE-TESTING
      record_version: "0.1.0"
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      label: Context-gated executable code testing
      intent: >-
        Decide deliberately whether executable code testing should be performed
        and which types to use, then scope, design, execute and document that
        testing with recorded, triaged findings.
      description: >-
        Operationalizes NIST SSDF v1.1 PW.8: task PW.8.1 gates the decision
        (should executable code testing be performed to find vulnerabilities not
        identified by previous reviews, analysis or testing, and which types),
        and task PW.8.2 executes the decided testing end-to-end including
        documentation and issue triage. The parallel PW.7.1 decision for
        human-readable code review/analysis illustrates the same staged,
        organization-defined choice.
      preconditions:
        - "The stage of the software and the results of previous reviews, analysis or testing are known (PW.8.1 frames the new testing against those findings)."
        - "The organization has defined how such method choices are made (per PW.7.1's organization-defined determination for review versus analysis)."
        - "A development workflow or issue tracking system exists for recording and triaging discovered issues."
      steps:
        - "Determine whether executable code testing should be performed, and which testing types, informed by the stage of the software (PW.8.1; notional example)."
        - "Scope the testing (PW.8.2)."
        - "Design the tests (PW.8.2)."
        - "Perform the testing (PW.8.2)."
        - "Document the results, recording and triaging all discovered issues and recommended remediations in the development team's workflow or issue tracking system (PW.8.2)."
      expected_outcomes:
        - "An explicit, recorded testing decision rather than testing by default."
        - "A documented result set with triaged issues and recommended remediations."
      risks:
        - "Treating the tasks as a mandatory checklist or fixed sequence contradicts the framework's risk-based, non-checklist guidance."
        - "Skipping the gating decision wastes testing effort already covered by prior reviews or analysis."
      scope_description: "Secure-development context per NIST SP 800-218 v1.1 PW.8 (with PW.7.1 as the parallel review/analysis decision)."
      applicability: "NIST SP 800-218 v1.1 recommendation context; adoption is governed by risk, cost, feasibility and applicability, not presumed universal."
      evidence_refs:
        - se:EVD-TVV-0010
        - se:EVD-TVV-0012
      claim_refs:
        - se:CLM-TVV-0004
    - id: se:PRA-TVV-DEFECT-TRACKING-REPRODUCIBILITY
      record_version: "0.1.0"
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      label: Defect tracking with reproducibility
      intent: >-
        Keep defects visible and prioritizable by recording them with
        reproducibility information and triaging recommended remediations in the
        team's workflow.
      description: >-
        Combines CS2023's SE-Validation KA Core topic 8e (defect tracking and
        prioritization, including reproducibility of reported defects) with the
        NIST SSDF record-and-triage tasks (PW.7.2, PW.8.2): every discovered
        issue and its recommended remediation is recorded and triaged in the
        development team's workflow or issue tracking system.
      preconditions:
        - "An issue tracking system or workflow integrated with development exists."
        - "Defect reports capture enough information to attempt reproduction."
      steps:
        - "Record each discovered defect or vulnerability together with its recommended remediation in the team's issue tracking system or workflow."
        - "Capture reproducibility information for reported defects to support prioritization and later fix verification."
        - "Triage recorded issues to establish priority."
      expected_outcomes:
        - "Prioritized, reproducible defect records that can drive fix work and feed regression-test selection."
      risks:
        - "Unreproducible reports weaken prioritization and prevent verifying that a fix works."
        - "Recording without triage accumulates an unactionable backlog."
      scope_description: "Curriculum topic (CS2023 SE-Validation KA Core 8e) intersected with NIST SSDF record/triage tasks; secure-development and curriculum framing coexist."
      applicability: "Applies wherever defects flow into a tracking workflow; the NIST tasks are recommendations, while the curriculum presents the topic as learning content."
      evidence_refs:
        - se:EVD-TVV-0009
        - se:EVD-TVV-0010
      claim_refs: []

  # ---------------------------------------------------------------- patterns
  patterns:
    - id: se:PAT-TVV-REGRESSION-SAFETY-NET
      record_version: "0.1.0"
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      label: Regression safety net from reported defects
      problem: >-
        Defects that have been fixed can be silently reintroduced as the code
        evolves, because the knowledge that a specific failure existed is
        recorded in prose but is not executable.
      context: >-
        Evolving software where components must remain functional as the code
        changes (CS2023 SE-Validation CS Core topic 2), with discovered
        vulnerabilities and defects recorded and triaged in an issue tracking
        system (NIST PW.8.2).
      forces:
        - "Evolution pressure versus functional stability: testing matters precisely because code keeps changing."
        - "Issue records hold defect knowledge but cannot fail a build."
        - "Testing effort is finite and, in the SSDF context, risk-governed."
      solution: >-
        Turn recorded defect knowledge into executable checks by incorporating
        tests for previously reported vulnerabilities or defects into the
        project's test suite, so that the same errors are not reintroduced
        (grounded in NIST PW.8.2's notional Example 3, supported by the CS2023
        evolution rationale for testing).
      consequences:
        - "Reintroduction of previously fixed defects is caught automatically by the suite."
        - "The suite grows with every recorded defect, raising maintenance and runtime cost."
        - "Effectiveness depends on reproducible defect records and on the tests actually encoding the original failure."
      tradeoffs:
        - "Growing suite runtime versus protection against reintroduction; sits inside CS2023's coverage versus throughput/latency tradeoff (KA Core topic 8d)."
      scope_description: "Cross-source pattern record: NIST notional example plus CS2023 curriculum framing; the NIST example is explicitly neither required nor exhaustive, so this is a candidate pattern pending real-case evidence."
      evidence_refs:
        - se:EVD-TVV-0010
        - se:EVD-TVV-0006
      case_refs: []

  # ------------------------------------------------------------ anti_patterns
  anti_patterns:
    - id: se:ANT-TVV-COVERAGE-THEATER
      record_version: "0.1.0"
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      label: Coverage theater
      symptoms:
        - "A code-coverage percentage is pursued as the primary or sole testing goal."
        - "Test matrices and environment coverage go unexamined while the coverage number rises."
        - "A green suite is treated as proof of correctness or as completed validation."
      causes:
        - "Interpreting one coverage dimension (code coverage) as the whole of test coverage, contrary to the three-dimension framing."
        - "Equating test execution with correctness, and validation with acceptance or sign-off."
        - "Incentives anchored to coverage metrics rather than to testing objectives such as conformance to specification."
      consequences:
        - "Behavior and environments relevant to defects remain untested despite high coverage numbers."
        - "False confidence: specification-conformance and fitness-for-purpose problems surface late."
        - "Testing throughput is consumed by low-value tests that inflate the metric."
      remediation: >-
        Measure coverage across all three dimensions (test matrices, code
        coverage, environment coverage); select test kinds by explicit testing
        objectives (usability, reliability, conformance to specification,
        performance, security); treat coverage versus throughput/latency as an
        explicit tradeoff; and never read an executed, passing suite as a
        correctness proof or as acceptance.
      scope_description: "Lane-synthesized anti-pattern over CS2023 SE-Validation coverage/objective/tradeoff topics and NIST's defect-specific regression example; not a named concept in either source."
      evidence_refs:
        - se:EVD-TVV-0014
      case_refs: []

  # ---------------------------------------------------------- decision_models
  decision_models:
    - id: se:DM-TVV-PRE-POST-COMMIT-TESTING
      record_version: "0.1.0"
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      decision_question: "Should a given automated test run pre-commit, post-commit, or should the suite split across both gates?"
      options:
        - "Run the full suite pre-commit as a blocking gate."
        - "Run the full suite post-commit (for example in continuous integration)."
        - "Split: fast, high-value checks pre-commit and broader suites post-commit."
      criteria:
        - "Test coverage achieved at each gate."
        - "Throughput and latency of testing at each gate."
        - "Change risk and blast radius of the affected component."
        - "Feedback speed for developers."
      constraints:
        - "Available test automation and infrastructure."
        - "Commit cadence and team workflow."
      procedure: >-
        Enumerate the suite's tests and their runtimes; classify tests by
        coverage contribution and risk sensitivity; compare candidate gate
        placements against the coverage versus throughput/latency tradeoff;
        assign gates; revisit the assignment when suite runtime or the risk
        profile changes.
      tradeoffs:
        - "Higher pre-commit coverage slows every change; lower pre-commit coverage delays defect discovery."
        - "Post-commit breadth preserves commit throughput but postpones feedback."
      scope_description: "Decision framing from CS2023 SE-Validation KA Core topics 8c/8d and illustrative learning outcomes 14/15 (curriculum authority only)."
      evidence_refs:
        - se:EVD-TVV-0009
      claim_refs:
        - se:CLM-TVV-0007


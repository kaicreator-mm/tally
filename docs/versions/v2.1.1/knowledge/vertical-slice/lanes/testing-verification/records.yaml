    # NIST SP 800-218 v1.1 — page-level verified anchors
    - id: se:EVD-TVV-0010
      record_version: "0.1.0"
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      source_locator_ref: se:LOC-NIST-218-PW8
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        NIST SSDF v1.1 task PW.8.1 directs determining whether executable code
        testing should be performed to find vulnerabilities not identified by
        previous reviews, analysis or testing and, if so, which types of testing
        should be used; task PW.8.2 directs scoping the testing, designing the
        tests, performing the testing and documenting the results, including
        recording and triaging all discovered issues and recommended remediations
        in the development team's workflow or issue tracking system.
      context: "Secure-development practice PW.8 (test executable code) and its two tasks; executable code includes binaries, directly executed bytecode and source code."
      method: "Page-level inspection of the locally downloaded official NIST PDF (SHA-256 recorded in SEK-06C observation); verbatim task text anchored at printed page 15."
      result: >-
        Notional implementation examples include choosing testing methods based
        on the stage of the software, incorporating tests for previously
        reported vulnerabilities into the project's test suite to ensure errors
        are not reintroduced, and using fuzz testing tools to find issues with
        input handling.
      limitations:
        - "Recommendation-framework content: practice selection is governed by risk, cost, feasibility and applicability."
        - "Notional examples are explicitly neither required nor exhaustive."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-TVV-0011
      record_version: "0.1.0"
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      source_locator_ref: se:LOC-NIST-218-RV
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        The Respond to Vulnerabilities (RV) group of NIST SSDF v1.1 comprises
        three practices: RV.1 identify and confirm vulnerabilities on an ongoing
        basis, with task RV.1.2 reviewing, analyzing and/or testing the
        software's code to identify or confirm previously undetected
        vulnerabilities and explicitly cross-referencing PW.7 and PW.8; RV.2
        assess, prioritize and remediate vulnerabilities so that remediation
        occurs in accordance with risk, with task RV.2.1 analyzing each
        vulnerability to gather sufficient risk information to plan remediation
        or another risk response; and RV.3 analyze vulnerabilities to identify
        their root causes, with task RV.3.1 determining the root causes of each
        vulnerability.
      context: "RV group structure spanning ongoing identification, risk-based disposition and root-cause learning."
      method: "Page-level inspection of the locally downloaded official NIST PDF (SHA-256 recorded in SEK-06C observation); practices anchored at printed pages 16-18."
      limitations:
        - "Framework structure of SP 800-218 v1.1 only; not a universal vulnerability-management taxonomy."
        - "Practice order in the group does not imply implementation sequence."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false

scope_note: >-
  Deep vertical slice over software testing, verification and validation.
  Evidence base: CS2023 SE-Validation knowledge unit (curriculum authority for
  the V&V topics; heading-anchored locator, page anchors only where the source
  registry already verified them) and NIST SP 800-218 v1.1 PW.7/PW.8 and the
  RV group (secure-development cross-cutting source; page-level verified
  locators from the locally downloaded official PDF). SWEBOK v4.0a remains on
  hold (#325 not merged). No record asserts that executing tests establishes
  correctness or that validation equals acceptance.


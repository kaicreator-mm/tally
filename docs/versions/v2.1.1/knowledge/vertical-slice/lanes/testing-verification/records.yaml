      label: Software Engineering
      definition: >-
        A bounded engineering discipline concerned with the multi-person, multi-version
        construction and evolution of software, represented here through curriculum,
        secure-development and related classification views pending professional-BOK
        reconciliation.
      scope_inclusions:
        - curriculum knowledge-unit classification for software engineering
        - secure-development cross-cutting guidance
      scope_exclusions:
        - the entirety of computer science
        - unreviewed professional body-of-knowledge claims pending SEK-02R
      boundary_notes:
        - No single source is treated as a complete ontology of the discipline.

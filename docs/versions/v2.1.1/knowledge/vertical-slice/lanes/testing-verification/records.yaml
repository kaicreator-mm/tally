        aggregate coverage. On that combined basis, treating a code-coverage
        percentage as the whole of test coverage, or reading a passing test
        suite as proof of correctness or product validity, is unsupported by
        either source.
      context: "Derived anti-pattern basis for se:ANT-TVV-COVERAGE-THEATER; synthesis of CS2023 SE-Validation topics 3, 6b and 8d with NIST PW.8.2 Example 3."
      method: "Author synthesis across the two admitted evidence families; no single source states the anti-pattern."

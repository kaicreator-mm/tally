  # ---------------------------------------------------------------- concepts
  concepts:
    - id: se:CON-TVV-VERIFICATION-VALIDATION
      record_version: "0.1.0"
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      label: Verification and validation distinction
      definition: >-
        A two-question boundary from the CS2023 SE-Validation unit:
        verification asks whether the software is being built right, and
        validation asks whether the right software was built. The two questions
        target different failure modes (disagreement with a specification versus
        unsuitability of what was specified) and are answered by different
        kinds of evidence.
      concept_kind: BOUNDARY_CONCEPT
      synonyms:
        - V&V
        - verification versus validation
      scope_description: >-
        Curriculum boundary concept anchored in CS2023 CS Core topic 1 and
        learning outcome 2. Two conflations are explicitly out of scope of this
        concept: executing tests, even passing ones, is not treated as
        establishing correctness; and validation is not equated with user
        acceptance or sign-off — the curriculum's own test-kind list names
        "validation" as a test kind while its learning-outcome list names
        "acceptance" separately, so the two are not merged here.
      applicability: "Use whenever testing, review or analysis records are classified, to keep conformance-checking separate from fitness-for-purpose."
      evidence_refs:
        - se:EVD-TVV-0003
        - se:EVD-TVV-0004
      claim_refs:
        - se:CLM-TVV-0001
    - id: se:CON-TVV-TEST-COVERAGE
      record_version: "0.1.0"
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      label: Test coverage
      definition: >-
        The extent to which a test suite exercises the subject software. CS2023
        SE-Validation topics decompose it into test matrices, code coverage and
        environment coverage rather than expressing it as a single percentage;
        the same curriculum pairs coverage with testing throughput/latency as an
        explicit engineering tradeoff.
      concept_kind: MECHANISM
      synonyms: []
      scope_description: >-
        Framing from CS2023 KA Core topics 6b and 8d. Code coverage is one
        dimension of three, and rising coverage is not treated as a correctness
        guarantee.
      applicability: "Use when planning test suites or judging coverage claims; a coverage figure must identify which dimension it measures."
      evidence_refs:
        - se:EVD-TVV-0007
        - se:EVD-TVV-0009
      claim_refs:

      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        NIST SSDF v1.1 practice PW.7 addresses reviewing and/or analyzing
        human-readable code to identify vulnerabilities before release; task
        PW.7.1 determines whether code review (a person looks directly at the
        code) and/or code analysis (tools find issues in code) should be used as
        defined by the organization, and task PW.7.2 performs the chosen
        review/analysis based on the organization's secure coding standards and
        records and triages all discovered issues and recommended remediations
        in the development team's workflow or issue tracking system.
      context: "Companion static-side practice to PW.8; its task PW.7.1 carries a notional example of choosing code review and/or analysis methods based on the stage of the software."
      method: "Page-level inspection of the locally downloaded official NIST PDF (SHA-256 recorded in SEK-06C observation); verbatim task text anchored at printed page 14."
      limitations:

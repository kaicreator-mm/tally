scope_note: >-
  SEK-07G vertical-slice lane for engineering planning, estimation,
  scheduling, engineering risk management, quality management/assurance,
  measurement, technical decision models and governance of engineering
  trade-offs. Grounded in direct reinspection of SWEBOK Guide v4.0a
  Chapter 9 Software Engineering Management (Introduction, section 2
  Software Project Planning incl. 2.3 estimation, 2.5 risk, 2.6 quality,
  2.7 plan management, and section 6 Software Engineering Measurement) and
  Chapter 15 Software Engineering Economics (Introduction, section 2 The
  Engineering Decision-Making Process, section 8 Estimation) from the
  official hash-verified PDF, plus the CS2023 SE-Teamwork knowledge unit
  (team processes incl. effort estimation; distributed-team risks) and the
  SE-Requirements Non-core effort-estimation topic from the heading-anchored
  SEK-07 research extract. Boundaries: lifecycle/process model definitions
  stay in lane 07A, implementation practices in 07B, reliability/performance
  engineering and quality attributes as engineering detail in 07D, delivery
  mechanics in 07E, technical-debt lifecycle in 07F; quality MODELS stay in
  07A territory and SWEBOK KA12 (Software Quality) itself was not in this
  lane's reading plan (recorded as a CoverageGap). No numeric productivity
  or estimation-accuracy claims are invented; SWEBOK characterizations of
  external standards (PMBOK Guide, SWX, ISO/IEC/IEEE 15939) are cited only
  as SWEBOK's secondary statements because no project-management or
  measurement standard is registered as a source. All knowledge records
  remain PROPOSED or PENDING_REVIEW; none is ACCEPTED. Source entities are
  not stored in this lane file; the validation harness derives shared
  Source records from SOURCE_REGISTRY.yaml.
review_policy: "No record is ACCEPTED until a human reviewer verifies source, locator, interpretation, applicability and rights."

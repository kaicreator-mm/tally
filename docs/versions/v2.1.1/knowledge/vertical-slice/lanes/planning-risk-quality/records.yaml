  evidence_records:
    - id: se:EVD-07G-SWEBOK-SEM-INTRO
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07G-SWEBOK-KA9-INTRO
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA9 defines software engineering management as the
        collection of work activities involved with planning, estimating,
        measuring, controlling, coordinating, leading and managing risk
        factors for a software project so that software products and
        engineering services are delivered efficiently, effectively and to
        the stakeholders' benefit, and treats project management and
        measurement management together because of their close relationship.
        The introduction asserts that measurement-informed management is a
        basic principle of any true engineering discipline — that management
        without measurement (qualitative and quantitative) suggests a lack of
        discipline and measurement without management suggests a lack of
        purpose or context — and adopts working definitions of management
        (a system of processes and controls to achieve the organization's
        strategic objectives) and measurement (assigning values and labels
        to work products, processes, resources and models derived from them).
        The chapter's breakdown is activity-based, listing seven topics
        (initiation and scope definition, project planning, project
        enactment, review and evaluation, closure, measurement, management
        tools) regardless of SDLC model.
      context: "SWEBOK Guide v4.0a Chapter 9 Introduction and Breakdown of Topics, printed pages 9-1 to 9-6."
      method: "Direct inspection of the official SWEBOK v4.0a PDF (SHA-256 0c9db4da0b2425c58cf778b99131eb31bb6c188e98b67163a549a1366d96e511) on 2026-11-07; text extracted at PDF page indices 201-206 and paraphrased originally."
      result: "The SEM definition, the measurement-informed management framing, the two working definitions and the seven-topic activity-based breakdown were confirmed for the professional-BOK scoped claims, principle and lane view."
      limitations:
        - "The Guide's authority limitations apply: generally accepted knowledge, not a uniform prescription."
        - "The introduction cites an external perception that software is often delivered late, over budget and of poor quality; this lane does not adopt that perception as an empirical finding."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07G-SWEBOK-KA9-ESTIMATION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07G-SWEBOK-KA9-ESTIMATION
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA9 section 2.3 characterizes estimating costs for
        software projects as an error-prone process: the effort required
        depends almost entirely on human elements (individuals' experience
        and capabilities, team member interactions, development environment
        culture) and on dynamic environmental factors such as rapid
        technology evolution, changing and emergent requirements, and the
        intangible nature of the product. Software project managers should
        use multiple estimation approaches and reconcile the differences
        among the estimates. Where data is available, a calibrated
        estimation model based on historical size and effort data can
        determine an estimated effort range, and it is best to also use
        bottom-up estimation based on estimates from those who will
        accomplish the work. Estimation of effort, schedule and cost is an
        iterative activity negotiated and revised among affected stakeholders
        until consensus is reached; predictive SDLC projects typically
        schedule tasks during planning while adaptive SDLC projects derive
        overall effort/schedule estimates or constraints differently.
      context: "SWEBOK Guide v4.0a Chapter 9 section 2.3 (Effort, Schedule, and Cost Estimation), printed pages 9-8 to 9-9."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 208-209; original paraphrase."
      result: "The error-prone characterization, the multiple-approach-and-reconcile advice and the calibrated-model/bottom-up combination were confirmed for the estimation claim, practice and decision model."
      limitations:
        - "The section surveys generally accepted management practice; it does not rank the named approaches' accuracy."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07G-SWEBOK-KA9-RISK-QUALITY
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07G-SWEBOK-KA9-RISK-QUALITY
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA9 section 2.5 distinguishes uncertainty (a lack
        of information) from risk (the effect of uncertainty on objectives,
        with negative threats or positive opportunities), and presents risk
        management as identifying risk factors, analyzing the probability
        and potential impact of each factor, prioritizing factors and
        developing mitigation strategies that reduce the probability of a
        negative event and minimize its impact if it becomes a problem.
        Risk-management data, often kept in a risk register (a document
        serving as a repository for identified risks and additional
        information about each, usable for regulatory compliance), represents
        the project risk profile; assessment methods named include expert
        judgment, historical data, decision trees and process simulations;
        project abandonment conditions can be determined with stakeholders.
        Particular attention should be paid to risks related to software
        quality requirements such as safety or security, and risk management
        should be done not only at the beginning of a project but at
        periodic intervals throughout the project life cycle. Section 2.6
        adds that software quality requirements for the project and its work
        products should be identified perhaps both quantitatively and
        qualitatively, that thresholds for acceptable quality measurements
        should be set for each quality requirement based on stakeholder
        needs and expectations, and that procedures for ongoing software
        quality assurance and quality improvement, verification and
        validation, reviews and audits should be specified during quality
        planning. Section 2.7 notes the magnitude of the planning effort and
        a plan's content should be determined partly by the risk of not
        developing the plan.
      context: "SWEBOK Guide v4.0a Chapter 9 sections 2.5 (Risk Management), 2.6 (Quality Management) and 2.7 (Plan Management), printed pages 9-9 to 9-10."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 209-210; original paraphrase."
      result: "The uncertainty/risk distinction, the risk-management cycle with register and periodic revisits, the quality-planning directions and the plan-magnitude risk rule were confirmed for the risk and quality claims, concepts, nodes and the risk practice."
      limitations:
        - "Section 2.6 frames project quality management by reference to the PMBOK Guide's definition, which is itself not a registered source; the characterization cited here is SWEBOK's secondary statement."
        - "Quality-attribute enumeration in the section is illustrative ('not limited to'); no attribute taxonomy is adopted by this lane."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07G-SWEBOK-KA9-MEASUREMENT
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07G-SWEBOK-KA9-MEASUREMENT
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA9 section 6 states that the section follows the
        ISO/IEC/IEEE 15939 standard, which describes a process to define the
        activities and tasks necessary to implement a software measurement
        process. Establishing and sustaining measurement commitment requires
        measurement requirements guided by organizational objectives, an
        established scope (organizational unit and temporal scope, e.g. time
        series to calibrate estimation models), formally communicated team
        commitment and committed resources (responsibility allocation, funds,
        training, tools). Planning the measurement process requires
        characterizing the organizational unit, identifying information
        needs based on the unit's goals, constraints, risks and problems,
        selecting measures with clear links to those needs judged against
        criteria such as cost of collection, degree of process disruption,
        ease of obtaining accurate consistent data and ease of analysis, and
        defining data collection, analysis and reporting procedures plus
        evaluation criteria for information products. Performing the process
        integrates measurement procedures into the software processes they
        measure, collects, verifies and stores data, and communicates
        information products to users and stakeholders; evaluating the
        measurement process assesses information products and the process
        against the specified criteria and records lessons learned.
      context: "SWEBOK Guide v4.0a Chapter 9 section 6 (6.1-6.4 Software Engineering Measurement), printed pages 9-14 to 9-16."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 214-216; original paraphrase."
      result: "The four-part measurement process, the information-need-driven measure selection with its judging criteria and the ISO/IEC/IEEE 15939 attribution were confirmed for the measurement claim, concept, node and practice."
      limitations:
        - "The section characterizes ISO/IEC/IEEE 15939; the standard itself is not a registered source, so its normative text is not cited."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07G-SWEBOK-KA15-VALUE
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07G-SWEBOK-KA15-INTRO
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA15's introduction takes the position that
        software engineering must be value-based, because neutral or
        negative value from an organization's investment in software is not
        sustainable. It frames economics as the science of choice rather
        than the science of money, quotes engineering as finding the balance
        between what is technically feasible and what is economically
        acceptable, and states that software technical decisions — such as
        an organization's decision to use a preexisting library or develop
        its own — may appear easy from a purely technical perspective yet
        can have serious implications for business viability. The economic
        perspective applies to decisions across the entire software product
        life cycle (from the pre-project decision to develop through
        end-of-life decisions) and at all levels of technical detail
        (buy-or-build, requirements scope, architecture and design,
        risk-based testing sufficiency, refactor-versus-redevelop, focus of
        maintenance). The KA also broadens the traditional financial view:
        value can derive from unquantifiables like corporate citizenship,
        employee well-being, environmental friendliness and customer
        loyalty, so software engineering decisions must also consider
        relevant unquantifiable criteria.
      context: "SWEBOK Guide v4.0a Chapter 15 Introduction and Breakdown of Topics, printed pages 15-1 to 15-2."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 287-288; original paraphrase."
      result: "The value-based position, the technical-decision/business-implication framing and the unquantifiable-criteria rule were confirmed for the value-based claim and the trade-off pattern's context."
      limitations:
        - "The introduction's position statement is professional-BOK framing, not an empirical result."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07G-SWEBOK-KA15-DECISION-PROCESS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07G-SWEBOK-KA15-DECISION-PROCESS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA15 section 2 presents the engineering
        decision-making process as: understand the real problem (e.g., via
        interrogative techniques and broader context); identify all
        reasonable technically feasible solutions (the best solution must be
        in the candidate set before it can be selected; prototyping and peer
        review help verify feasibility); define the selection criteria
        (expressed as objectively as possible, accepting unquantifiable
        criteria; more criteria when the consequences of a wrong decision
        are greater); evaluate each alternative against the criteria (same
        basis for comparison, same planning horizon, same kinds of costs and
        incomes); select the preferred alternative (decision-making-under-
        risk techniques when probabilities can be assigned — expected value,
        Monte Carlo, decision trees, value of perfect information — and
        decision-making-under-uncertainty techniques when they cannot —
        Laplace, Maximin, Maximax, Hurwicz, Minimax Regret; ranges of
        estimates, sensitivity analysis and delaying final decisions address
        estimate inaccuracy); and monitor the performance of the selected
        alternative, closing the loop on estimates by comparing them to
        actual outcomes so that estimation improves over time. The time,
        effort and care spent should scale with the consequences of a wrong
        decision, and ISO 12207 and ISO 15288 are cited as recommending a
        decision-management strategy and stakeholder identification for
        high-consequence decisions.
      context: "SWEBOK Guide v4.0a Chapter 15 section 2 (2.1-2.7 The Engineering Decision-Making Process), printed pages 15-5 to 15-7."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 291-293; original paraphrase."
      result: "The six-step process, the consequence-scaled effort rule, the risk/uncertainty technique families and the close-the-loop requirement were confirmed for the decision-process claim, the trade-off pattern, and the close-the-loop principle."
      limitations:
        - "The named ISO 12207/15288 recommendations are the Guide's secondary characterization; those standards are metadata-only in the registry and their normative text is not cited."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07G-SWEBOK-KA15-ESTIMATION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07G-SWEBOK-KA15-ESTIMATION
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK Guide v4.0a KA15 section 8 defines an estimate as an
        analytical prediction of a quantity (a project's size, cost or
        schedule, among others) and states that software engineers estimate
        in order to make decisions when critical quantities are unknown —
        behind every estimate is one or more decisions. Because estimates
        are predictions, there is a nonzero probability that the actual
        outcome will differ; all estimates are inherently uncertain, and
        estimates need not be perfect but only good enough to lead the
        decision-maker to the right decision. The section quotes the
        Software Engineering Code of Ethics and Professional Practice
        clause 3.09 as requiring realistic quantitative estimates of cost,
        scheduling, personnel, quality and outcomes, with an uncertainty
        assessment of these estimates. The general techniques are: expert
        judgment (simplest, always available, least accurate; multiple
        expert estimates can feed group processes such as Wideband Delphi
        and Planning Poker); analogy (base the estimate on a similar thing's
        known actual result adjusted for listed differences; more accurate
        than expert judgment; requires a suitable analogy with known
        results); decomposition (bottom-up: break into pieces small enough
        to estimate, then sum, assuming over- and under-estimates cancel;
        fails if bottom-level estimates are biased, and cross-cutting
        factors such as integration and testing must be added); parametric
        (statistical relationship between the quantity and observable
        factors; typically most accurate, most defendable and easiest to use
        once the equation is developed and validated, which requires an
        adequate base of accurate historical data); and multiple estimates
        (estimate the same thing with different techniques and possibly
        different estimators; convergence suggests accuracy, divergence
        suggests overlooked factors and reestimation).
      context: "SWEBOK Guide v4.0a Chapter 15 section 8 (8.1-8.5 Estimation), printed pages 15-13 to 15-16."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at PDF page indices 299-302; original paraphrase."
      result: "The estimate definition, the decisions-not-certainty framing, the inherent-uncertainty statement, the quoted ethics clause and the five techniques with their trade-offs were confirmed for the uncertainty claim, the estimate concept, the decision model and the anti-pattern synthesis."
      limitations:
        - "The Code of Ethics clause is quoted by SWEBOK; the Code text itself was not independently inspected by this lane."
        - "The technique accuracy ordering is the Guide's overview characterization, not an empirical ranking cited from studies."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false

    - id: se:EVD-07G-SYNTHESIS-POINT-ESTIMATE
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07G-SWEBOK-KA15-ESTIMATION
      evidence_type: SYNTHESIS
      statement: >-
        Lane synthesis (SEK-07G): SWEBOK KA15 section 8 establishes that
        every estimate is an inherently uncertain prediction made to support
        a decision and that the quoted ethics clause requires an uncertainty
        assessment alongside quantitative estimates, while SWEBOK KA9
        section 2.3 establishes that software effort/cost estimation is
        error-prone and advises multiple approaches with reconciliation. On
        that combined reading, presenting a single-point early estimate as a
        firm commitment — no range, no uncertainty assessment, no
        reconciliation, no later comparison against actuals — discards the
        uncertainty information both sections treat as constitutive of
        estimation and invites decisions to be made on precision that does
        not exist.
      context: "Cross-section inference combining directly inspected SWEBOK KA15 section 8 and KA9 section 2.3; this is not a sentence that appears in either section."
      method: "Lane-level comparison of two verified evidence records (se:EVD-07G-SWEBOK-KA15-ESTIMATION, se:EVD-07G-SWEBOK-KA9-ESTIMATION); the locator anchors the primary (KA15 section 8) leg of the synthesis."
      result: "Provides the inference trail motivating the se:ANT-07G-POINT-ESTIMATE-COMMITMENT record."
      limitations:
        - "Synthesis inference, not a statement made by SWEBOK."
        - "No empirical case evidence in this lane supports the severity of the anti-pattern's consequences."
      uncertainty:
        - "Whether real teams that commit to point estimates always incur the listed consequences is untested in this lane."
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false


  principles:
    - id: se:PRI-07G-MEASUREMENT-INFORMED-MANAGEMENT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Pair management with measurement
      statement: >-
        The management of software engineering work should be
        measurement-informed: qualitative and quantitative measurement
        supplies the information on which management acts, and management
        supplies the purpose and context that make measurement meaningful;
        using one without the other signals a discipline gap or a purpose
        gap.
      rationale: >-
        SWEBOK Guide v4.0a KA9's introduction frames measurement-informed
        management as a basic principle of any true engineering discipline,
        asserting that management without measurement (qualitative and
        quantitative) suggests a lack of discipline and measurement without
        management suggests a lack of purpose or context, and adopts working
        definitions of both management and measurement.
      scope_description: "Professional-BOK principle as presented in the SWEBOK Guide v4.0a KA9 introduction (printed page 9-4); not an empirically validated law."
      applicability: "Software project and organizational management where measurement (qualitative or quantitative) is feasible."
      exceptions: []
      limitations:
        - "The Guide asserts the principle without evidencing it in the inspected sections; no empirical support is cited by this lane."
      evidence_refs:
        - se:EVD-07G-SWEBOK-SEM-INTRO
    - id: se:PRI-07G-CLOSE-ESTIMATION-LOOP
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Close the loop on estimates
      statement: >-
        Estimates should be compared with the actual outcomes of the work
        they sized — both to judge the decisions the estimates supported
        and to refine the estimation techniques that produced them.
      rationale: >-
        SWEBOK Guide v4.0a KA15 section 2.7 requires monitoring the
        performance of the selected alternative and closing the loop on
        estimates by comparing them to actual outcomes, stating that
        otherwise no one will ever know if the estimates were good, and
        that understanding what drives estimate-versus-actual differences
        helps refine estimation techniques over time; CS2023 teaches the
        same comparison pedagogically as the effort-estimation subtopic of
        practicing estimation and comparing it to how long tasks take.
      scope_description: "Professional-BOK guidance (SWEBOK KA15 section 2.7) with a curriculum echo (CS2023 SE-Requirements Non-core topic 9b); cross-source principle at lane fidelity."
      applicability: "Any project that bases decisions on estimates and can observe the corresponding actuals."
      exceptions: []
      limitations:
        - "The CS2023 leg rests on a Non-core (elective) topic and is pedagogical."
        - "The principle presumes access to actual outcome data; where actuals are unobservable the loop cannot close."
      evidence_refs:
        - se:EVD-07G-SWEBOK-KA15-DECISION-PROCESS
        - se:EVD-07G-CS2023-REQ-EFFORT

  practices:
    - id: se:PRA-07G-RISK-REGISTER-MAINTENANCE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Maintain a lifecycle-long risk register
      intent: >-
        Keep risk identification, analysis, prioritization and mitigation
        current across the whole project instead of treating risk
        management as a one-time startup exercise.
      description: >-
        Operate the risk-management cycle presented in SWEBOK KA9 section
        2.5: identify risk factors (supported by assessment methods such as
        expert judgment, historical data, decision trees and process
        simulations), analyze each factor's probability and potential
        impact, prioritize the factors, develop mitigation strategies that
        reduce event probability and minimize impact, and record risks
        with their information in a risk register that can also serve
        regulatory compliance; agree project abandonment conditions with
        stakeholders and pay particular attention to risks related to
        quality requirements such as safety or security.
      preconditions:
        - "An agreed risk-management procedure and an owner for the register."
        - "Access to assessment inputs (expertise, historical data or models) of usable quality."
      steps:
        - "Identify risk factors using the assessment methods available in context."
        - "Analyze each factor's probability and potential impact."
        - "Prioritize the factors by analysis results."
        - "Define mitigation strategies (probability reduction and impact minimization) per prioritized factor."
        - "Record each risk, its analysis and its mitigation status in the risk register."
        - "Revisit the risk profile and recompute risk exposures at predetermined intervals through the project life cycle, not only at initiation."
      expected_outcomes:
        - "A current project risk profile whose data lives in an auditable register."
        - "Named mitigation owners and strategies for prioritized risks."
      risks:
        - "The register goes stale between revisits; periodic revisit discipline is the practice's load-bearing element."
        - "Assessment quality depends on available expertise and history; simulations and trees inherit their input biases."
        - "Register paperwork can displace actual mitigation work."
      scope_description: "Operationalizes SWEBOK Guide v4.0a KA9 section 2.5 at BOK fidelity; the named assessment methods are the section's examples, not an exhaustive professional procedure."
      applicability: "Software projects under any SDLC; the revisit cadence is context-dependent."
      evidence_refs:
        - se:EVD-07G-SWEBOK-KA9-RISK-QUALITY
      claim_refs:
        - se:CLM-07G-SWEBOK-RISK-LIFECYCLE
    - id: se:PRA-07G-MULTI-TECHNIQUE-ESTIMATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Estimate with multiple techniques and reconcile
      intent: >-
        Counter the inherent uncertainty and error-proneness of software
        effort/cost estimation by triangulating techniques, investigating
        divergence and disclosing uncertainty instead of emitting a single
        number.
      description: >-
        Estimate the same quantity with more than one general technique —
        expert judgment (optionally via group processes), estimation by
        analogy, bottom-up decomposition, and parametric estimation where a
        validated equation and historical data exist — possibly with
        different estimators; examine the estimates for convergence or
        divergence; on divergence, look for overlooked factors and
        reestimate toward convergence; express the result as a range with
        an uncertainty assessment and negotiate revisions with affected
        stakeholders until consensus is reached.
      preconditions:
        - "At least two estimation techniques feasible in context (e.g., a known analogy or historical data for a calibrated model)."
        - "A decision whose consequences justify the extra estimation effort."
      steps:
        - "State the quantity to estimate and the decision it serves."
        - "Select the techniques feasible from available inputs (experts, analogies, historical data, work breakdown)."
        - "Produce estimates per technique, applying technique-specific care (difference lists for analogy; cross-cutting allowances for decomposition)."
        - "Compare the estimates; on divergence, identify overlooked factors and reestimate."
        - "Express the reconciled result as a range with an uncertainty assessment."
        - "Record the techniques used and revisit the estimate against actuals when the work completes."
      expected_outcomes:
        - "A reconciled estimate with explicit uncertainty, or a documented list of unresolved divergence causes."
        - "Technique provenance recorded for later estimation improvement."
      risks:
        - "Multiple biased techniques can converge on the same wrong value, suggesting false accuracy."
        - "Group estimation processes can converge on a dominant opinion rather than information."
        - "The extra effort is wasted on decisions with small consequences."
      scope_description: "Operationalizes SWEBOK KA15 section 8 (8.1-8.5) together with KA9 section 2.3 (multiple approaches and reconciliation); joining the two sections into one procedure is a lane composition disclosed here, not a procedure printed in either section."
      applicability: "Estimates feeding significant decisions (scope, staffing, bid/no-bid, go/no-go); the Guide scales effort to the consequences of a wrong decision."
      evidence_refs:
        - se:EVD-07G-SWEBOK-KA15-ESTIMATION
        - se:EVD-07G-SWEBOK-KA9-ESTIMATION
      claim_refs:
        - se:CLM-07G-SWEBOK-MULTI-ESTIMATE-RECONCILE
        - se:CLM-07G-SWEBOK-ESTIMATES-UNCERTAIN
    - id: se:PRA-07G-NEEDS-DRIVEN-MEASUREMENT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Select measures from information needs
      intent: >-
        Prevent unfocused or ritual data collection by deriving every
        measure from explicitly identified information needs of the
        organizational unit.
      description: >-
        Apply the planning part of the SWEBOK KA9 section 6 measurement
        process: characterize the organizational unit (processes,
        application domains, technology, interfaces, structure);
        identify information needs based on the unit's goals, constraints,
        risks and problems, prioritized and communicated with stakeholders;
        select candidate measures with clear links to those needs, judged
        against criteria such as cost of collection, degree of process
        disruption, ease of obtaining accurate consistent data and ease of
        analysis and reporting; define data collection, analysis and
        reporting procedures and evaluation criteria for information
        products; then integrate the procedures into the processes being
        measured.
      preconditions:
        - "Organizational commitment and resources for measurement (KA9 6.1)."
        - "Stakeholders able to articulate and prioritize information needs."
      steps:
        - "Characterize the organizational unit and its constraints."
        - "Identify and prioritize information needs from goals, constraints, risks and problems."
        - "Select measures with clear links to the needs, judging candidates by collection cost, disruption, data accuracy and analysis ease."
        - "Define collection, analysis and reporting procedures and information-product evaluation criteria."
        - "Integrate the procedures into the measured processes and communicate results."
        - "Evaluate information products and the process against the criteria; record lessons learned."
      expected_outcomes:
        - "A measurement plan in which every measure traces to a stated information need."
        - "Evaluation criteria against which information products can be judged."
      risks:
        - "Information needs drift as the unit's goals change, silently invalidating the measure set."
        - "Collection procedures can disrupt the measured processes if disruption was not a selection criterion."
        - "Measures without committed resources decay into partial, untrustworthy data."
      scope_description: "Operationalizes SWEBOK Guide v4.0a KA9 section 6 (especially 6.2) as the Guide's characterization of the ISO/IEC/IEEE 15939 process; the standard's normative text is not cited."
      applicability: "Measurement programs at project, process or work-product level; organizational-unit characterization is context-specific."
      evidence_refs:
        - se:EVD-07G-SWEBOK-KA9-MEASUREMENT
      claim_refs:
        - se:CLM-07G-SWEBOK-MEASUREMENT-PROCESS

  patterns:
    - id: se:PAT-07G-MULTI-ATTRIBUTE-TRADEOFF
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Common-basis multi-attribute trade-off evaluation
      problem: >-
        Technical alternatives — buy or build, architecture options,
        refactor versus redevelop, how much risk-based testing is enough —
        must be compared on money and on non-monetary criteria without
        smuggling in inconsistent comparisons that predetermine the winner.
      context: >-
        An engineering decision, at any level of technical detail, with
        more than one reasonable technically feasible alternative and
        selection criteria that cannot all be expressed in money
        (SWEBOK KA15 sections 2.3-2.6, with the decision examples from the
        KA15 introduction).
      forces:
        - "The best solution must be among the candidates before it can be selected; adding candidates raises the chance but also the cost."
        - "Too many criteria make the analysis unwieldy; too few fail to differentiate alternatives and can force a suboptimal choice."
        - "Some criteria (unquantifiables such as well-being or loyalty) resist objective, let alone monetary, expression."
        - "The greater the consequences of a wrong decision, the more criteria and care are warranted."
      solution: >-
        Follow the KA15 section 2 structure: enumerate all reasonable
        technically feasible solutions (using prototyping and peer review
        to verify feasibility and to surface more candidates); define the
        selection criteria as objectively as possible, explicitly carrying
        unquantifiable criteria; evaluate every alternative against every
        criterion from the same viewpoint — the same basis for comparison,
        the same planning horizon, the same kinds of costs and incomes; and
        select using compensatory techniques that collapse criteria into a
        single figure of merit (for example additive weighting or the
        analytic hierarchy process) or non-compensatory techniques that
        refuse trade-offs (dominance, satisficing, lexicography), recording
        the selected alternative and its justification when consequences
        are high, and monitoring the selected alternative's performance
        afterward.
      consequences:
        - "Alternatives are compared on a declared, common basis, making the decision auditable."
        - "Unquantifiable criteria stay in the decision instead of being silently monetized or dropped."
        - "High-consequence decisions leave a recorded justification trail."
      tradeoffs:
        - "Compensatory techniques let a low score on one criterion be offset by high scores elsewhere, which can mask a fatal weakness; non-compensatory techniques avoid that masking but discard aggregate ordering information."
        - "Common planning horizons can require arbitrary cut-offs for proposals with different natural lifespans."
      scope_description: "Structured from SWEBOK Guide v4.0a KA15 sections 2.3-2.6 and 6 (printed pages 15-5 to 15-7, 15-9 to 15-10) at BOK fidelity; the specific technique lists are the Guide's enumeration, not a comparative effectiveness study."
      evidence_refs:
        - se:EVD-07G-SWEBOK-KA15-DECISION-PROCESS

  anti_patterns:
    - id: se:ANT-07G-POINT-ESTIMATE-COMMITMENT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Single-point estimate treated as a commitment
      symptoms:
        - "An early effort, cost or schedule estimate is communicated as one number with no range and no uncertainty assessment."
        - "The estimate functions as a promise or target; deviations are treated as failures of execution rather than of prediction."
        - "Estimates from different techniques or estimators that diverge are averaged or ignored instead of investigated."
        - "The estimate is never revisited when requirements or scope evolve."
      causes:
        - "Conflating an estimate (an uncertain prediction supporting a decision) with a target, bid or commitment."
        - "Stakeholder or contractual pressure for certainty rewards a single confident number."
        - "Treating estimation as a one-time initiation artifact rather than an iterative, negotiated activity."
        - "No comparison of past estimates against actuals, so miscalibration is invisible."
      consequences:
        - "Overruns and infeasibility surface late, when correction is most expensive."
        - "Trust erodes between engineering and stakeholders as 'the number' is missed."
        - "Schedule and cost pressure is redirected into quality shortcuts, undercutting quality planning."
        - "Decisions are made on precision that never existed, invalidating their justification."
      remediation: >-
        Present estimates with an uncertainty assessment (ranges,
        sensitivity analysis) as the Code of Ethics clause quoted by SWEBOK
        KA15 section 8 requires; estimate with multiple techniques and
        reconcile divergences (KA15 section 8.5, KA9 section 2.3); delay
        final decisions where estimates diverge (KA15 section 2.6); and
        close the loop by comparing estimates to actual outcomes (KA15
        section 2.7).
      scope_description: "Lane synthesis grounded in directly inspected SWEBOK KA15 section 8 (estimates inherently uncertain; uncertainty assessment required) and KA9 section 2.3 (estimation error-prone; multiple approaches advised); the counterproductive characterization is the lane's inference (see se:EVD-07G-SYNTHESIS-POINT-ESTIMATE), not a statement made by SWEBOK."
      evidence_refs:
        - se:EVD-07G-SYNTHESIS-POINT-ESTIMATE

  decision_models:
    - id: se:DM-07G-ESTIMATION-TECHNIQUE-SELECTION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      decision_question: "Which estimation technique, or combination of techniques, should produce the estimate for a given quantity and the decision it serves?"
      options:
        - "Expert judgment alone"
        - "Expert judgment via a group process (for example Wideband Delphi or Planning Poker)"
        - "Estimation by analogy against a known similar outcome"
        - "Decomposition (bottom-up) over a work breakdown"
        - "Parametric estimation with a calibrated statistical equation"
        - "Multiple techniques with convergence/divergence reconciliation"
      criteria:
        - "Consequences of a wrong decision (higher consequences justify more techniques and effort)."
        - "Availability of accurate historical data (enables calibrated/parametric estimation)."
        - "Availability of a suitable analogy with known actual results."
        - "Availability of estimators or experts."
        - "Time and effort budget for the estimation activity itself."
        - "Need for defensibility of the estimate to third parties."
      constraints:
        - "Every estimate is inherently uncertain and must carry an uncertainty assessment (Code of Ethics clause 3.09 as quoted in SWEBOK KA15 section 8)."
        - "Decomposition requires explicit allowances for cross-cutting factors (requirements, integration, testing, documentation work)."
        - "Parametric estimation presumes a developed and validated equation over an adequate historical data base."
      procedure: >-
        State the quantity and the decision it serves; inventory the
        available inputs (experts, analogies with known results, historical
        data, work breakdown); shortlist the feasible techniques from
        SWEBOK KA15 section 8.1-8.4; select a single technique only when
        the consequences of a wrong decision are small and inputs are rich,
        otherwise estimate with multiple techniques and examine convergence
        (agreement suggests accuracy; divergence suggests overlooked
        factors — investigate and reestimate, per section 8.5 and KA9
        section 2.3's reconciliation advice); express the result as a range
        with an uncertainty assessment; record the technique choice and
        compare against actuals afterward.
      tradeoffs:
        - "Expert judgment is always available but least accurate; analogy is quicker and more accurate but needs a known analogue; decomposition is thorough but laborious and fails under correlated bottom-level bias; parametric is most accurate and defendable when validated but expensive to develop."
      scope_description: "Structured from SWEBOK Guide v4.0a KA15 section 8 (8.1-8.5) plus the multiple-approach reconciliation of KA9 section 2.3; the accuracy ordering among techniques is the Guide's overview characterization, not an independent empirical ranking."
      evidence_refs:
        - se:EVD-07G-SWEBOK-KA15-ESTIMATION
        - se:EVD-07G-SWEBOK-KA9-ESTIMATION
      claim_refs:
        - se:CLM-07G-SWEBOK-ESTIMATES-UNCERTAIN


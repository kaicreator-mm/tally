      label: Estimate (SWEBOK KA15 section 8 sense)
      definition: >-
        An analytical prediction of some quantity — such as a project's
        size, cost or schedule — made because the actual value cannot be
        precisely known until the work is done; inherently uncertain and
        existing to support decisions rather than to be right in itself.
      concept_kind: TERM
      synonyms:

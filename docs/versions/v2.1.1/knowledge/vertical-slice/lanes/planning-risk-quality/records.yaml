    - id: se:CON-07G-RISK-VS-UNCERTAINTY
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Risk versus uncertainty (SWEBOK KA9 section 2.5 distinction)
      definition: >-
        The SWEBOK KA9 distinction that uncertainty results from a lack of
        information, while risk is the effect of uncertainty on objectives
        and can carry negative (threats) or positive (opportunities)
        consequences; risk management operates on this effect, not on
        ignorance in general.
      concept_kind: BOUNDARY_CONCEPT
      synonyms: []
      scope_description: "Boundary concept as stated in SWEBOK Guide v4.0a KA9 section 2.5; other frameworks may draw the boundary differently."

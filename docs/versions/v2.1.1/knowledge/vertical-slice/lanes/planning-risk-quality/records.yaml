        estimates of cost, scheduling, personnel, quality and outcomes
        together with an uncertainty assessment of these estimates.
      claim_kind: LIMITATION
      scope_description: "SWEBOK Guide v4.0a Chapter 15 section 8 (printed pages 15-13 to 15-14); a limitation claim about estimation itself, including the Guide's quotation of the Code of Ethics (not an independent inspection of the Code)."

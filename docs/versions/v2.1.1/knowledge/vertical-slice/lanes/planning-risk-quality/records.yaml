        entirely on human elements and on dynamic factors such as changing
        and emergent requirements — and advises that software project
        managers use multiple estimation approaches and reconcile the
        differences among the estimates, combining (where data is
        available) calibrated estimation models based on historical size
        and effort data with bottom-up estimates from those who will
        accomplish the work, and negotiating estimates iteratively with
        affected stakeholders until consensus is reached.

scope_note: >-
  Security Engineering vertical-slice lane (SEK-07C) covering software security
  engineering across threat/risk analysis, security requirements linkage, secure
  architecture/design, secure implementation, security verification, vulnerability
  handling and security assurance, with emphasis on traceable applicability, threat
  assumptions and lifecycle integration. Grounded in directly inspected sections of
  SWEBOK Guide v4.0a KA13 Software Security (official PDF SHA-256
  0c9db4da0b2425c58cf778b99131eb31bb6c188e98b67163a549a1366d96e511), NIST SP 800-218
  v1.1 SSDF (verified PDF SHA-256
  617746e553a9e2da49bfbd4eef0dfc3094758a39b869314e4173ac36605cde22) and the CS2023
  Security (SEC) knowledge-area units SEC-Engineering and SEC-Foundations (verified
  full-text extract of the official Body of Knowledge PDF). Professional guidance
  (SWEBOK), government recommendation (NIST SSDF) and curriculum framing (CS2023) are
  kept distinct with no authority inflation; SSDF practices are recorded as risk-based
  recommendations, not a universal mandatory sequence. Source entities are not stored
  in this lane file; the validation harness derives shared Source records from
  SOURCE_REGISTRY.yaml. All knowledge records remain PROPOSED or PENDING_REVIEW; none
  is ACCEPTED.
review_policy: "No record is ACCEPTED until a human reviewer verifies source, locator, interpretation, applicability and rights."

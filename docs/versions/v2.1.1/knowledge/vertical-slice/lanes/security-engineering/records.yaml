        - "No empirical case evidence in this lane supports the severity of the anti-pattern's consequences."
      uncertainty:
        - "Whether real teams that defer security always incur the listed consequences is untested in this lane."
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false


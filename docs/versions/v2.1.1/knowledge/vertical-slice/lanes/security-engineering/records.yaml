    # --- NIST SP 800-218 v1.1 SSDF evidence (direct inspection 2026-11-07) ---
    - id: se:EVD-07C-NIST-PO1-REQUIREMENTS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07C-NIST218-PO1
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        NIST SSDF v1.1 practice PO.1 recommends ensuring that security requirements for
        software development are known at all times so they can be taken into account
        throughout the SDLC and so duplication of effort is minimized, drawing on
        requirements from internal sources (the organization's policies, business
        objectives and risk management strategy) and external sources (applicable laws
        and regulations). Its tasks include identifying and documenting security
        requirements for development infrastructure and processes and for
        organization-developed software and maintaining them over time (with examples
        such as risk-based architecture and design requirements, compliance verification
        at key SDLC points, and at least annual reviews), and communicating requirements
        to third parties providing commercial software components, including requiring
        provenance data and integrity verification mechanisms.
      context: "NIST SP 800-218 v1.1 Section 2, Table 1, practice PO.1 and tasks PO.1.1-PO.1.3, printed pages 5-6."
      method: "Direct inspection of the official NIST PDF (SHA-256 617746e553a9e2da49bfbd4eef0dfc3094758a39b869314e4173ac36605cde22) on 2026-11-07; text extracted at the verified page indices and paraphrased originally."
      result: "The continuous-availability intent, the internal/external source split, the maintenance tasks and the third-party communication task were confirmed."
      limitations:
        - "A government recommendation addressed to software producers and acquirers; adoption is risk-based, not mandatory."
        - "Notional implementation examples are illustrative; none is required by the publication."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07C-NIST-PW1-SECURE-BY-DESIGN
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07C-NIST218-PW1
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        NIST SSDF v1.1 practice PW.1 recommends designing software to meet security
        requirements and mitigate security risks: identify and evaluate the security
        requirements for the software, determine what security risks the software is
        likely to face during operation and how its design and architecture should
        mitigate those risks, and justify any cases where risk-based analysis indicates
        that security requirements should be relaxed or waived; the practice states that
        addressing security requirements and risks during software design (secure by
        design) is key for improving software security and also helps improve
        development efficiency. Task PW.1.1 names threat modeling, attack modeling and
        attack surface mapping as forms of risk modeling; task PW.1.2 tracks and
        maintains the software's security requirements, risks and design decisions,
        recording the response to each risk and the rationales for approved exceptions
        and periodically re-evaluating them.
      context: "NIST SP 800-218 v1.1 Section 2, Table 1, practice PW.1 and tasks PW.1.1-PW.1.3, printed page 11."
      method: "Direct inspection of the official NIST PDF on 2026-11-07 at the verified page index; original paraphrase."
      result: "The secure-by-design intent, the named risk-modeling forms, and the requirements/risks/design-decision tracking with re-evaluated exceptions were confirmed."
      limitations:
        - "A recommendation framed for voluntary adoption; the publication's own ordering note states table order does not imply implementation sequence or relative importance."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07C-NIST-PW2-DESIGN-REVIEW
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07C-NIST218-PW2
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        NIST SSDF v1.1 practice PW.2 recommends reviewing the software design to verify
        compliance with security requirements and risk information so the software will
        meet the security requirements and satisfactorily address the identified risks.
        Task PW.2.1 assigns this review to 1) a qualified person (or people) who were
        not involved with the design and/or 2) automated processes instantiated in the
        toolchain, to confirm and enforce that the design meets all the security
        requirements and satisfactorily addresses the identified risk information; the
        notional examples include having the designer correct failures to meet the
        requirements, changing the design or the risk response strategy when security
        requirements cannot be met, and recording design-review findings to serve as
        artifacts.
      context: "NIST SP 800-218 v1.1 Section 2, Table 1, practice PW.2 and task PW.2.1, printed page 12."
      method: "Direct inspection of the official NIST PDF on 2026-11-07 at the verified page index; original paraphrase."

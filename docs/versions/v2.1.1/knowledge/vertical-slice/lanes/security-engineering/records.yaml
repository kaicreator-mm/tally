  principles:
    - id: se:PRI-07C-DESIGN-SECURITY-IN
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Design security in across the lifecycle
      statement: >-
        Security should be treated as a design-time concern carried through every
        development life cycle stage — with defined security requirements and
        properties, threat-informed design and architecture, and maintained traceability
        into implementation and verification — rather than something patched in only
        after development.
      rationale: >-
        SWEBOK KA13 section 1 reports the design-in-over-patch preference as a
        generally accepted belief and requires every life cycle stage to be considered;
        SSDF PW.1 describes secure-by-design attention during design as key for
        improving software security, and PO.1 expects security requirements to be known
        at all times throughout the SDLC; the CS2023 SEC-Foundations security-mindset
        topic converges on lifecycle-crosscutting security thinking. The three
        authorities are kept distinct: belief, recommendation and curriculum framing.
      scope_description: "Grounded in SWEBOK KA13 section 1, SSDF practices PO.1 and PW.1, and CS2023 SEC-Foundations at their respective authority levels; not asserted as an empirical law."
      applicability: "Software under active development with evolving requirements and a maintainable requirements/design record."
      exceptions:
        - "Already-released legacy software where only post-hoc vulnerability management is feasible; the sources' own maintenance and vulnerability-handling provisions cover that path."
      limitations:
        - "No empirical effectiveness evidence is cited in this lane; the SWEBOK grounding is explicitly a 'generally accepted belief'."
        - "Security remains one design goal among others (privacy, performance), to be optimized rather than maximized without tradeoff analysis."

  practices:
    - id: se:PRA-07C-SECURITY-REQUIREMENTS-BASELINE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Maintained security-requirements baseline
      intent: >-
        Keep a documented, current baseline of security requirements that informs every
        SDLC stage and links requirements to design, implementation and verification.
      description: >-
        Identify and document security requirements for the software and its
        development from internal sources (policies, business objectives, risk
        management strategy) and external sources (laws, regulations), informed by
        threat analysis (misuse and abuse cases), maintain them over time, verify
        compliance at key SDLC points, and communicate them to third-party component
        suppliers including provenance and integrity expectations — per SSDF PO.1 with
        the SWEBOK 4.1 activity framing.
      preconditions:
        - "Access to internal policy and external regulatory requirement sources."
        - "A named owner responsible for maintaining the baseline."
        - "Threat and risk inputs available for elicitation (misuse/abuse cases, risk assessments)."
      steps:
        - "Elicit security requirements from internal and external sources, including misuse- and abuse-case threat analysis."
        - "Document and prioritize the requirements with source provenance."
        - "Verify compliance with the baseline at key SDLC checkpoints and record results."
        - "Communicate the requirements to third-party component suppliers, including provenance and integrity verification expectations."
        - "Review the baseline at least periodically and on major vulnerability or incident events; revisit on software product revision."
      expected_outcomes:
        - "A living security-requirements baseline traceable into design, implementation and verification."
        - "Reduced duplicated requirements effort through a shared, collected-once requirements record."
      risks:
        - "The baseline drifts without an owner or periodic review."
        - "Over-broad baselines are ignored or waived informally."
        - "Approved exceptions accumulate without periodic re-evaluation."
      scope_description: "Operationalizes SSDF practice PO.1 (tasks PO.1.1-PO.1.3) and the SWEBOK KA13 4.1 activity framing at recommendation fidelity; not a mandated process."
      applicability: "Organizations and projects able to maintain a requirements record; practice depth remains risk-based."
      evidence_refs:
        - se:EVD-07C-NIST-PO1-REQUIREMENTS
        - se:EVD-07C-SWEBOK-SECURITY-REQUIREMENTS
      claim_refs:
        - se:CLM-07C-NIST-SSDF-REQUIREMENTS-CONTINUOUS
        - se:CLM-07C-SWEBOK-SECURITY-REQUIREMENTS-SCOPE
    - id: se:PRA-07C-THREAT-MODELING-AT-DESIGN
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Design-time threat modeling with recorded risk responses
      intent: >-
        Surface likely operational security risks early and drive the design and
        architecture to mitigate them, with an auditable record of risks and design
        decisions.
      description: >-
        During design, model how the software is likely to be attacked — threat
        modeling, attack modeling or attack surface mapping — determine how the design
        and architecture should mitigate the identified risks (including access control
        and cryptographic material handling), justify and record any relaxation or
        waiver of security requirements, and periodically re-evaluate approved
        exceptions — per SSDF PW.1 with the SWEBOK 4.2 design concerns and
        threat-modeling purpose.
      preconditions:
        - "A security-requirements baseline to design against."
        - "Knowledge of the data types the software will interact with (data classification)."
        - "Stakeholder capacity to act on identified risks during design."
      steps:
        - "Classify the data the software interacts with and identify high-risk areas (sensitive data, identification, authentication, access control, credential management)."
        - "Build the threat/attack-surface model of how the system is attacked."
        - "Determine design and architecture mitigations for the identified risks."
        - "Record the response to each risk, mitigation rationales and any approved requirement exceptions with their justifications."
        - "Re-evaluate all approved exceptions periodically and after design changes."
      expected_outcomes:
        - "A threat-informed security design whose risk responses and design decisions are recorded for later review and maintenance."
      risks:
        - "Models go stale after design changes unless re-evaluation is scheduled."
        - "Unrecorded threat assumptions create false confidence."
        - "Modeling effort can exceed the value of the decisions it informs."
      scope_description: "Operationalizes SSDF practice PW.1 (tasks PW.1.1-PW.1.2) and the SWEBOK KA13 4.2 threat-modeling-to-design path at recommendation fidelity."
      applicability: "Design-stage security work where risks can be modeled before implementation; depth of modeling remains risk-based."
      evidence_refs:
        - se:EVD-07C-NIST-PW1-SECURE-BY-DESIGN
        - se:EVD-07C-SWEBOK-SECURITY-DESIGN
      claim_refs:
        - se:CLM-07C-NIST-SECURE-BY-DESIGN
    - id: se:PRA-07C-SECURITY-TESTING-DUAL-CHECK
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Dual-purpose security verification
      intent: >-
        Verify both that implemented software meets its security requirements and that
        it contains none of the known vulnerabilities, using expertise-governed static
        and authorized dynamic methods.
      description: >-
        Derive security checks from the security-requirements baseline (general testing
        methods) and complement them with security-specific methods: static analysis of
        source code and compiled binaries, and authorized dynamic testing such as
        vulnerability assessment or penetration testing — operated and configured by
        security-skilled people, with results verified rather than trusted, and with
        dynamic testing kept within legal boundaries and proper authorization — per
        SWEBOK KA13 4.5, triaging findings through the vulnerability knowledge bases
        named in 4.6.
      preconditions:
        - "A security-requirements baseline providing the compliance target."
        - "Access to static analysis tooling (source and binary) and security expertise to operate it."
        - "Explicit authorization and legal clearance for dynamic testing."
      steps:
        - "Derive requirements-compliance security checks from the baseline."
        - "Run static analysis on source and compiled binaries; configure tools with security expertise and verify results."
        - "Conduct authorized dynamic testing (vulnerability assessment, penetration testing) where the risk context warrants."
        - "Triage findings against known-vulnerability knowledge bases (CVE, CWE, CAPEC) and record severity (e.g., CVSS-style scoring)."
        - "Feed confirmed findings into vulnerability handling and, where requirements fail, back into the baseline and design record."
      expected_outcomes:
        - "Evidence at release that security requirements are met and known vulnerabilities were checked for."
        - "A recorded trail from requirements to verification results."
      risks:
        - "Checking tools cannot find all vulnerabilities (for example those in hard-to-produce states); automation alone yields false confidence."
        - "Unauthorized dynamic testing is unlawful; authorization boundaries must be explicit."
        - "Requirements compliance and vulnerability absence are different checks; doing one does not cover the other."
      scope_description: "Operationalizes the SWEBOK KA13 4.5 dual-purpose framing and 4.6 knowledge bases at professional-BOK fidelity; test-execution mechanics are SEK-06C territory."
      applicability: "Verification stages of software with a maintained security-requirements baseline."
      evidence_refs:
        - se:EVD-07C-SWEBOK-SECURITY-TESTING
        - se:EVD-07C-SWEBOK-VULNERABILITY-DATABASES
      claim_refs:
        - se:CLM-07C-SWEBOK-SECURITY-TESTING-PURPOSES

  patterns:
    - id: se:PAT-07C-SECURITY-PATTERN-REUSE
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Security-pattern-based design
      problem: >-
        Recurring security problems in software design need proven, reviewable
        solutions rather than ad hoc re-derivation for every project.
      context: >-
        Secure design work where prevention and tolerance concerns (unauthorized
        disclosure or access, damage limitation, failing and recovering securely,
        access control, cryptographic material handling) must be specified, per the
        SWEBOK KA13 4.2 design concerns.
      forces:
        - "Provenness of a documented solution versus fit to the specific context."
        - "Reviewability: a named pattern gives reviewers a shared reference."
        - "Threat specificity: a pattern mitigates the threats it was proven against, not all threats."
        - "Adoption cost of a pattern catalog versus ad hoc design."
      solution: >-
        Express recurring security problems and their well-proven generic solutions as
        security patterns (recurring problem in a specific context plus well-proven
        generic solution, per SWEBOK KA13 4.3), and select and adapt documented
        patterns when specifying the security design, recording the fit decision with
        the threat model so reviewers can check pattern-to-threat alignment.
      consequences:
        - "Design decisions are anchored to documented problem/solution pairs, easing independent design review (SSDF PW.2-style)."
        - "Selected patterns must still be validated against the software's actual threats; a pattern is not a guarantee."
      tradeoffs:
        - "Pattern generality trades against exact context fit; adaptation must be recorded or the pattern's provenness claim breaks."
      scope_description: "Grounded in the SWEBOK KA13 4.3 security-pattern definition at professional-BOK fidelity; the selection workflow is lane operationalization, not a source-prescribed procedure."
      evidence_refs:
        - se:EVD-07C-SWEBOK-SECURITY-PATTERNS
        - se:EVD-07C-SWEBOK-SECURITY-DESIGN

  anti_patterns:
    - id: se:ANT-07C-SECURITY-AFTERTHOUGHT
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Security as a post-development afterthought
      symptoms:
        - "No security requirements exist at design time; security work surfaces as patch requests after release."
        - "Threat assumptions are nowhere recorded, so design changes cannot be checked against them."
        - "Verification has no security-requirements baseline to verify against; only reactive vulnerability fixes occur."
      causes:
        - "Treating security as a separable technical add-on rather than a lifecycle-crosscutting concern."
        - "Lifecycle stages owned without security linkage between requirements, design, implementation and verification."
        - "Mistaking patch capacity and incident response for a security practice."
      consequences:
        - "Reactive patching replaces design mitigation; the same root causes recur because requirements, risks and design decisions were never recorded."
        - "Known-vulnerability checking has no requirements anchor, so compliance violations surface late or never."
        - "Maintenance cost grows as fixes bypass the design rationale that a design-in approach would have provided."
      remediation: >-
        Adopt design-in security: maintain a security-requirements baseline through the
        SDLC, threat-model at design, review the design against requirements and risk
        information, and treat vulnerability management as the handling of residual
        risk rather than the primary security mechanism.
      scope_description: "Lane-level characterization derived by marked synthesis (se:EVD-07C-SYNTHESIS-AFTERTHOUGHT) from SWEBOK KA13 section 1 and SSDF PO.1/PW.1; the sources assert the positive practice, the anti-pattern framing is this lane's inference."
      evidence_refs:
        - se:EVD-07C-SYNTHESIS-AFTERTHOUGHT

  decision_models:
    - id: se:DM-07C-DESIGN-REVIEW-DEPTH
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      decision_question: "How should a software design be reviewed for security, and how deeply, given its risk context?"
      options:
        - "Independent qualified-person design review (reviewers not involved with the design)"
        - "Automated toolchain-enforced design checks"
        - "Combined independent review plus automated enforcement"
        - "No formal design review, as a documented and periodically re-evaluated exception"
      criteria:
        - "Security risk level of the software and the data it handles."
        - "Sensitivity of data and security functionality involved (identification, authentication, access control, credential management)."
        - "Cost and availability of qualified reviewers."
        - "Feasibility of automating requirement and risk checks in the toolchain."
        - "Time constraints, risk tolerance, risk acceptance and return on investment (explicit tradeoff analysis)."
      constraints:
        - "Where review is performed, it must confirm meeting all security requirements and satisfactorily addressing identified risks (SSDF PW.2.1)."
        - "Any exception to security requirements must be justified and periodically re-evaluated (SSDF PW.1.2)."
      procedure: >-
        Assess the software's security risk profile (data classification and high-risk
        areas per the PW.1.1 examples), weigh the review options against the criteria
        using explicit engineering tradeoff analysis (time, cost, risk tolerance, risk
        acceptance, return on investment, per the CS2023 SEC-Engineering tradeoff
        topic), select the review depth, record the decision and its rationale, and
        record the review findings as artifacts.
      tradeoffs:
        - "Independent review brings judgment but costs scarce expert time; automated enforcement scales but only checks what it is configured to check; the combined option costs more upfront and covers both gaps."
      scope_description: "Structured from SSDF practice PW.2 and the CS2023 SEC-Engineering tradeoff topics at their respective authority levels; a decision aid, not an automatic decision."
      evidence_refs:
        - se:EVD-07C-NIST-PW2-DESIGN-REVIEW
        - se:EVD-07C-CS2023-SEC-ENGINEERING
      claim_refs:
        - se:CLM-07C-NIST-INDEPENDENT-DESIGN-REVIEW
        - se:CLM-07C-CS2023-SECURITY-TRADEOFFS


  evidence_records:
    # --- SWEBOK v4.0a KA13 evidence (direct inspection 2026-11-07) ---
    - id: se:EVD-07C-SWEBOK-SECURITY-BY-DESIGN
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07C-SWEBOK-KA13-FUNDAMENTALS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA13 reports a generally accepted belief that it is much better to
        design security into software than to patch it in after the software is
        developed, and that designing security in requires considering every development
        life cycle stage — software requirements, design, construction and testing
        security — with security also considered during maintenance, where security
        faults and loopholes can be and often are introduced; the same introduction adds
        that security vulnerabilities are not only introduced during development but
        also by third-party components such as libraries, COTS and operating systems.
      context: "SWEBOK Guide v4.0a Chapter 13 section 1 Software Security Fundamentals (with 1.1/1.2), printed page 13-1."
      method: "Direct inspection of the official SWEBOK v4.0a PDF (SHA-256 0c9db4da0b2425c58cf778b99131eb31bb6c188e98b67163a549a1366d96e511) on 2026-11-07; text extracted at the verified page index and paraphrased originally."
      result: "The design-in preference, the every-stage scope and the third-party introduction of vulnerabilities were confirmed for the professional-BOK scoped claim."
      limitations:
        - "The Guide reports this as a generally accepted belief, not as an empirical finding; no effectiveness evidence is cited by this lane."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07C-SWEBOK-SECURITY-PROPERTIES
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07C-SWEBOK-KA13-FUNDAMENTALS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA13 section 1.1 defines security as a product quality
        characteristic — the degree to which a product or system protects information
        and data so that persons or other products have data access appropriate to
        their types and levels of authorization — and section 1.2 characterizes
        information security as preserving confidentiality, integrity and availability,
        with authenticity, accountability, non-repudiation and reliability possibly also
        involved; it states software engineers should define the security properties of
        their software and maintain them throughout the software development life cycle.
      context: "SWEBOK Guide v4.0a Chapter 13 sections 1.1 and 1.2, printed page 13-1."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page index; original paraphrase."
      result: "The security quality-characteristic definition, the CIA property set with named additional properties, and the maintain-throughout-lifecycle expectation were confirmed."
      limitations:
        - "The section names the properties without prescribing measurement procedures."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07C-SWEBOK-SECURITY-REQUIREMENTS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07C-SWEBOK-KA13-SECURITY-REQUIREMENTS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA13 section 4.1 characterizes security requirements engineering
        as including elicitation, specification and prioritization; it considers
        threats, illustrated by misuse and abuse cases, threat actors, and security
        risk assessments, and notes that the selection of life cycle models may impact
        the order of activities and that software product revision implies a need to
        revisit security requirements. It states that traceability of security
        requirements throughout the development process is important and that security
        teams may include specialists in security requirements.
      context: "SWEBOK Guide v4.0a Chapter 13 section 4.1, printed pages 13-3 to 13-4."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."
      result: "The activity triple, the threat/risk inputs, the lifecycle-order and revisiting qualifications, and the traceability expectation were confirmed."
      limitations:
        - "The subsection names methods and considerations without prescribing one elicitation or prioritization technique."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07C-SWEBOK-SECURITY-DESIGN
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07C-SWEBOK-KA13-SECURITY-DESIGN
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA13 section 4.2 frames security design as concerning how to
        prevent unauthorized disclosure, creation, change, deletion or denial of access
        to information and other resources, and how to tolerate security-related attacks
        or violations by limiting damage, continuing service, speeding repair and
        recovery, and failing and recovering securely; it names access control a
        fundamental concept of security, notes that most controls build on
        cryptographic algorithms and cryptographic material like keys whose selection,
        creation, distribution and management must be chosen carefully, and describes
        threat modeling — illustrating how a system is being attacked — as the means by
        which developers specify a security design for the mitigation.
      context: "SWEBOK Guide v4.0a Chapter 13 section 4.2, printed page 13-4."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page index; original paraphrase."
      result: "The prevention/tolerance duality, the access-control and cryptography fundamentals, and the threat-modeling-to-design path were confirmed."
      limitations:
        - "The subsection describes concerns and a modeling activity; it does not prescribe a specific threat-modeling notation."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07C-SWEBOK-SECURITY-PATTERNS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07C-SWEBOK-KA13-SECURITY-DESIGN
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA13 section 4.3 defines a security pattern as describing a
        particular recurring security problem that arises in a specific context and
        presenting a well-proven generic solution.
      context: "SWEBOK Guide v4.0a Chapter 13 section 4.3, printed page 13-4."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page index; original paraphrase."
      result: "The security-pattern definition (recurring problem in context plus well-proven generic solution) was confirmed."
      limitations:
        - "The subsection gives the definition only; cataloguing specific named patterns is outside this lane's admitted content."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-07C-SWEBOK-CONSTRUCTION-RULES
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07C-SWEBOK-KA13-CONSTRUCTION-TESTING
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA13 section 4.4 states that, in its current state, software
        construction security mostly refers to the coding of security into software,
        achieved by following recommended rules: structure the process so that sections
        requiring extra privileges are modules as small as possible performing only the
        tasks that require those privileges; ensure assumptions in the program are
        validated, or document them for installers and maintainers so they know the
        assumptions attackers will try to invalidate; ensure the program does not share
        objects in memory with other programs; and check every function's error status,
        recovering only when neither the error's cause nor its effects affect security
        considerations. It also lists the CERT top ten software security practices,
        which include validating input, heeding compiler warnings, architecting and
        designing for security policies, keeping it simple, default deny, adhering to
        least privilege, sanitizing data sent to other software, practicing defense in
        depth, using effective quality assurance techniques, and adopting a software
        construction security standard.
      context: "SWEBOK Guide v4.0a Chapter 13 section 4.4, printed pages 13-4 to 13-5."

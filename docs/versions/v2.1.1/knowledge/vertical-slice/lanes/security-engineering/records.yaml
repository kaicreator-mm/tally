    - id: se:NODE-07C-SECURITY-VERIFICATION
      record_version: 0.1.0
      lifecycle_status: PROPOSED
      created_on: "2026-11-07"
      label: Security verification, vulnerability handling and assurance
      definition: >-
        Verifying that implemented software meets its security requirements and contains
        none of the known vulnerabilities (static analysis and authorized dynamic testing),
        handling residual vulnerabilities (categorized weakness knowledge bases, severity
        scoring, disclosure processes), and the tool-limit boundary that checking tools
        cannot find all vulnerabilities — per SWEBOK KA13 4.5-4.6 and 5.1.
      node_kind: CONCERN
      view_ref: se:VIEW-07C-SECURITY-ENGINEERING
      evidence_refs:

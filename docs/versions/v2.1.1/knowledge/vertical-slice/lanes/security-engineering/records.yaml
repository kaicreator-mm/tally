      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA13 section 4.6 names the Common Vulnerabilities and Exposures
        (CVE), Common Weakness Enumeration (CWE) and Common Attack Pattern Enumeration
        and Classification (CAPEC) databases as the shared categorization of common
        security defects, with the Common Vulnerability Scoring System (CVSS) expressing
        characteristics and severity of software vulnerabilities; security maintenance
        encompasses mitigating the effects of vulnerabilities in a system and in the
        third-party components it uses, often accompanied by a vulnerability disclosure
        process allowing vulnerabilities to be reported. Section 5.1 adds that security
        vulnerability checking tools — source code analyzers and binary analysis tools —
        significantly aid detection but cannot find all vulnerabilities, for example
        those that manifest only in hard-to-produce software states or unusual
        circumstances.
      context: "SWEBOK Guide v4.0a Chapter 13 sections 4.6 and 5.1, printed pages 13-5 to 13-6."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page indices; original paraphrase."

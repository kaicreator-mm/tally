    - id: se:EVD-07C-SWEBOK-SECURITY-TESTING
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07C-SWEBOK-KA13-CONSTRUCTION-TESTING
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA13 section 4.5 gives security testing two purposes: ensuring that
        the implemented software meets the security requirements, and verifying that the
        software implementation contains none of the known vulnerabilities. Whereas
        general software testing methods can handle the former, the latter requires
        security-specific methods: static analysis, conducted on source code or compiled
        binaries, where automation plays a significant role but the expertise of
        security professionals is required to properly operate and configure the tools
        and verify the results; and dynamic testing, typically vulnerability assessment
        or penetration testing (also called ethical hacking), which should always be
        conducted within legal boundaries and with proper authorization so as to remain
        distinguishable from illegal hacking.
      context: "SWEBOK Guide v4.0a Chapter 13 section 4.5, printed page 13-5."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-07 at the verified page index; original paraphrase."
      result: "The dual purpose (requirements compliance and known-vulnerability absence), the static/dynamic method split, the expertise requirement and the authorization boundary were confirmed."
      limitations:
        - "The subsection names method families; it does not compare their detection effectiveness."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false

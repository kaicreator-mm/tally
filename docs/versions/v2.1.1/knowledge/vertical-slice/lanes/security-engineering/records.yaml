    - id: se:EVD-07C-SYNTHESIS-AFTERTHOUGHT
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-07"
      source_locator_ref: se:LOC-07C-SWEBOK-KA13-FUNDAMENTALS
      evidence_type: SYNTHESIS
      statement: >-
        Lane synthesis (SEK-07C): SWEBOK KA13 section 1 reports designing security in
        as much better than patching after development, SSDF PW.1 describes
        secure-by-design attention during design as key for improving software security,
        and SSDF PO.1 expects security requirements to be known at all times throughout
        the SDLC; on that combined reading, treating security as a post-development
        afterthought inverts all three authorities at once — the security-requirements
        baseline, the threat-informed design record and the requirements-compliance
        anchor for verification are all missing when security is deferred, which is the
        defining characteristic of the anti-pattern this lane records. This is not a
        sentence that appears in any of the three sources.
      context: "Cross-source inference combining SWEBOK KA13 section 1 with SSDF practices PO.1 and PW.1; lane-marked synthesis."
      method: "Lane-level comparison of three verified evidence records from two directly inspected sources."

  principles:
    - id: se:PRI-ARC-SEPARATION-OF-CONCERNS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      label: Separation of concerns as a guiding design principle
      statement: >-
        A software design should be divided so that distinct parts address distinct
        concerns, and a design that violates this should be adapted toward it.
      rationale: >-
        CS2023 SE-Design lists separation of concerns among system design principles (CS
        Core topic 1b) and its CS Core illustrative learning outcome 3 expects students to
        adapt a flawed system design to better follow principles such as separation of
        concerns or information hiding.
      scope_description: "CS2023 SE-Design curriculum scope; curriculum-taught guidance, not professional consensus."
      applicability: "Software design education and curriculum-scoped design reasoning."
      exceptions:
        - "The curriculum does not state that separation of concerns always dominates other goals; design-tradeoff evaluation is a separate Non-core topic (13)."
      limitations:
        - Name-level curriculum anchor; the extracted text provides no detailed treatment of the principle.
        - Not a universal prescription; SWEBOK professional-consensus status is unavailable under the source-identity hold.
      evidence_refs:
        - se:EVD-ARC-0002
      claim_refs: []
  practices:
    - id: se:PRA-ARC-BOUNDARY-IDENTIFICATION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      label: Identifying component boundaries and dependencies
      intent: >-
        Identify the component boundaries and the dependency relationships among components
        in an architectural design.
      description: >-
        Work from an architectural design description to enumerate components, mark the
        boundaries between them, and identify which components depend on which. CS2023
        SE-Design lists this as CS Core topic 2c and its CS Core learning outcome 4 expects
        students to identify the dependencies among a set of software components in an
        architectural design.
      preconditions:
        - "An architectural design description at a suitable abstraction level exists."
        - "Components are identifiable as design-level entities (not yet implementation modules)."
      steps:
        - "Enumerate the components visible in the design description."
        - "Mark the boundary of each component: what it owns and what lies outside it."
        - "Identify dependencies among the components (learning outcome 4)."
        - "Record the boundary and dependency decisions for review."
      expected_outcomes:
        - "A documented list of component boundaries and inter-component dependencies."
        - "Dependencies are explicit enough to support later design-impact analysis."
      risks:
        - "Boundaries drawn without regard to concerns may couple unrelated responsibilities."
        - "Dependencies inferred from implementation details rather than the architectural design may overstate coupling."
      scope_description: "CS2023 SE-Design curriculum scope (CS Core topics 2c and learning outcome 4)."
      applicability: "Architectural-design-level analysis in a curriculum or educational context."
      evidence_refs:
        - se:EVD-ARC-0004
        - se:EVD-ARC-0002
      claim_refs:
        - se:CLM-ARC-0003
    - id: se:PRA-ARC-API-CONTRACT-DOCUMENTATION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      label: Documenting API contracts and error conditions
      intent: >-
        Document each API operation's contract and error conditions so callers can use the
        operation without knowing its implementation.
      description: >-
        For each API operation, describe its effect on the system rather than generally its
        implementation; state preconditions, postconditions and invariants; keep error
        reporting clear, predictable and actionable; produce an error for input that does
        not match the contract; and manage without reporting only those errors that can be
        reliably managed. CS2023 SE-Design KA Core topic 5 and learning outcome 5 anchor
        this practice.
      preconditions:
        - "An API surface with identified operations exists."
        - "Each operation's valid input domain can be characterized."
      steps:
        - "For each operation, write its effect-on-system description and avoid documenting internal implementation."
        - "State preconditions, postconditions and invariants for the operation."
        - "Define error reports to be clear, predictable and actionable."
        - "Ensure input that does not match the contract produces an error; reliably manageable errors may be managed without reporting."
      expected_outcomes:
        - "Each operation carries a documented contract (effect, preconditions, postconditions, invariants) and error conditions."
        - "Callers can distinguish contract-matching from contract-violating input."
      risks:
        - "Documenting implementation details locks callers to internals and hurts expandability."
        - "Silently absorbing contract-violating input hides defects, contrary to the curriculum's error-reporting expectation."
      scope_description: "CS2023 SE-Design curriculum scope (KA Core topic 5, learning outcome 5)."
      applicability: "API design in a curriculum or educational context; not a professional standard."
      evidence_refs:
        - se:EVD-ARC-0005
      claim_refs:
        - se:CLM-ARC-0004
  patterns:
    - id: se:PAT-ARC-LAYERED-ARCHITECTURE
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      label: Layered architecture
      problem: >-
        A system must be organized so that responsibilities at different levels of
        abstraction can be described and reasoned about separately.
      context: >-
        Software architecture design as framed by CS2023 SE-Design: top-down functional
        decomposition/layered design is listed as a design paradigm (CS Core topic 2a.i)
        and n-layer is listed among the standard architectures (CS Core topic 2b). The
        curriculum anchors the pattern at the architecture abstraction level, distinct from
        detailed design.
      forces:
        - "Separation of concerns across levels of abstraction (CS Core topic 1b)."
        - "Component boundaries and dependencies must be identifiable (CS Core topic 2c)."
      solution: >-
        Organize the system as an ordered set of layers in which each layer addresses a
        level of abstraction and depends on the layers below it, following the layered
        design paradigm named by the curriculum.
      consequences:
        - "The curriculum lists layered design as one paradigm among four and n-layer as one standard architecture; it does not elaborate consequences, so none are asserted beyond that framing."
      tradeoffs:
        - "Design tradeoffs such as efficiency vs reliability are evaluated separately (Non-core topic 13); the curriculum attributes no specific tradeoffs to layered design."
      scope_description: "CS2023 SE-Design curriculum scope; pattern shape assembled from curriculum topic names plus boundary-concept reasoning."
      evidence_refs:
        - se:EVD-ARC-0003
        - se:EVD-ARC-0004
      case_refs: []
  anti_patterns:
    - id: se:ANT-ARC-INCONSISTENT-API-SURFACE
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      label: Inconsistent API surface
      symptoms:
        - "Analogous operations in different portions of an API follow divergent conventions."
        - "The API ignores common external API patterns that its users already know."
        - "Callers must relearn conventions for each portion of the API and make avoidable mistakes."
      causes:
        - "API portions designed or evolved independently without a shared consistency review."
        - "No external-pattern baseline was adopted when the API surface was defined."
      consequences:
        - "The benefits the curriculum attributes to consistency - being easier to learn and less error-prone - are forfeited."
      remediation: >-
        Apply API design consistency: align conventions across internal portions of the API
        and follow common external API patterns, per CS2023 SE-Design KA Core topic 5a.
      scope_description: "CS2023 SE-Design curriculum scope; anti-pattern shape is a synthesis of the curriculum's consistency principle, not a curriculum-named anti-pattern."
      evidence_refs:
        - se:EVD-ARC-0010
      case_refs: []
  decision_models:
    - id: se:DM-ARC-DESIGN-TRADEOFF-EVALUATION
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      decision_question: >-
        When two design goals conflict (for example efficiency vs reliability or security
        vs usability), how should a design decision be evaluated and recorded?
      options:
        - "Prioritize the first quality goal of the conflicting pair."
        - "Prioritize the second quality goal of the conflicting pair."
        - "Adopt an intermediate design that partially satisfies both goals."
      criteria:
        - "Efficiency"
        - "Reliability"
        - "Security"
        - "Usability"
      constraints:
        - "The example tradeoff pairs and quality goals are limited to those named in CS2023 SE-Design Non-core topic 13."
        - "Design-tradeoff evaluation is Non-core curriculum content in CS2023."
      procedure: >-
        Identify the conflicting design goals; state each option's effect on the named
        criteria; record the chosen tradeoff and its rationale; and record which
        requirements remain satisfied by the chosen design, per the requirement-traceability
        competency (KA Core topic 9).
      tradeoffs:
        - "The curriculum's example pairs are efficiency vs reliability and security vs usability; other pairs are outside the extracted scope."
      scope_description: "CS2023 SE-Design curriculum scope (Non-core topic 13 with KA Core topic 9); option scaffolding is lane-level structure, not curriculum content."
      evidence_refs:
        - se:EVD-ARC-0007
        - se:EVD-ARC-0006
      claim_refs:
        - se:CLM-ARC-0005

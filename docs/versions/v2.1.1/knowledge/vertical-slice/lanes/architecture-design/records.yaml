      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        CS2023 SE-Design covers API design principles in KA Core topic 5: consistency, where
        consistent APIs are easier to learn and less error-prone and consistency is both
        internal (between different portions of the API) and external (following common API
        patterns); composability; documenting contracts, where API operations should
        describe their effect on the system but not generally their implementation,
        including preconditions, postconditions and invariants; expandability; and error
        reporting, where errors should be clear, predictable and actionable, input that does
        not match the contract should produce an error, and errors that can be reliably
        managed without reporting should be managed. A KA Core illustrative learning outcome
        asks students to design an API for a single component of a large software system,
        including identifying and documenting each operation's invariants, contract and
        error conditions.

    - id: se:NODE-CS2023-SE-SOFTWARE-DESIGN
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      label: SE-Design Software Design CS2023 knowledge unit
      definition: >-
        The Software Design knowledge unit of the CS2023 Software Engineering area. Per the
        SE Overview, while Product Requirements focus on the user-facing functionality of a
        software system, Software Design focuses on the engineer-facing design of internal
        software components, spanning concerns as large as software architecture and
        choices as small as API design. Its topics cover system design principles, software
        architecture, programming in the large vs small and code quality indicators
        (CS Core), API design principles, data invariants, design models, data design and
        requirement traceability (KA Core), plus non-core design modeling, design-quality
        measurement, secure design principles and design-tradeoff evaluation.
      node_kind: KNOWLEDGE_UNIT
      view_ref: se:VIEW-CS2023-SE
      evidence_refs:

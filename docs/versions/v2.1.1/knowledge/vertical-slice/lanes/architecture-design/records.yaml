    # --- SWEBOK v4.0a KA2/KA3 evidence (2026-11-06 P2 repair reinspection) ---
    - id: se:EVD-ARC-SWEBOK-DESCRIPTION-VIEWS
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      source_locator_ref: se:LOC-SWEBOK-KA2-ARCH-DESCRIPTION
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA2 distinguishes a software system's architecture from its
        architecture description: for large, team-developed systems a tangible
        representation is needed, and architecture descriptions are the work
        products that document the architecture for stakeholders whose concerns
        the architecture answers. Descriptions commonly use multiple
        architecture views, each addressing specific concerns, with the
        conventions for each view documented as an architecture viewpoint;
        architectural styles and patterns are documented solution forms (an
        architectural style expresses a system's global organization and can be
        expressed as an architectural pattern; pattern catalogs coordinate
        them), and a reference architecture is an architecture constraining or
        guiding other architectures that provides a common basis for developing
        architectures for individual systems, product lines, families of
        systems and application domains, capturing commonalities to promote
        ease of development, integration, interoperability and other kinds of
        standardization.
      context: "SWEBOK Guide v4.0a Chapter 2 section 2 (2.1, 2.2), printed pages 2-4 to 2-7 (the reference-architecture passage spans the 2-6/2-7 page break)."
      method: "Direct inspection of the official SWEBOK v4.0a PDF (SHA-256 0c9db4da0b2425c58cf778b99131eb31bb6c188e98b67163a549a1366d96e511) on 2026-11-06; original paraphrase."
      result: "The description/views/viewpoints vocabulary and the style/pattern/reference-architecture definitions were confirmed for the professional-BOK scoped claim, including the reference-architecture definition completing on printed page 2-7."
      limitations:
        - "The section surveys generally accepted description practice; it does not prescribe a mandatory viewpoint set."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-ARC-SWEBOK-DECISIONS-DEBT
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      source_locator_ref: se:LOC-SWEBOK-KA2-ARCH-DECISIONS-PROCESS
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA2 frames architectural design as a creative process whose
        outcome is a network of significant decisions: decisions affect quality
        attributes and trade-offs, their rationale (assumptions, alternatives
        considered, selection and rejection criteria) can be documented, and
        decisions deferred today can accumulate architectural technical debt
        that later work must pay. The chapter's process model situates
        architectural design across life-cycle contexts — traditional stages,
        product lines, Agile settings where architecture may only "emerge", and
        enterprise/system-of-systems baselines — and separates architecture's
        concern (shaping requirements and wide-ranging concerns) from design's
        focus on an established requirement set.
      context: "SWEBOK Guide v4.0a Chapter 2 sections 2.4 and 3 (3.1, 3.1.1, 3.2), printed pages 2-7 to 2-9."
      method: "Direct inspection of the official SWEBOK v4.0a PDF on 2026-11-06; original paraphrase."
      result: "The decision/rationale/technical-debt framing and the architecture-versus-design contrast were confirmed."
      limitations:
        - "The contexts are described qualitatively; the Guide asserts no quantitative measure of architectural debt here."
      uncertainty: []
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false
    - id: se:EVD-ARC-SWEBOK-DESIGN-STAGES
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      source_locator_ref: se:LOC-SWEBOK-KA3-DESIGN-PROCESSES
      evidence_type: DIRECT_SOURCE_PARAPHRASE
      statement: >-
        SWEBOK v4.0a KA3 presents software design as a life-cycle activity with
        three stages — architectural design (treated in the Software
        Architecture KA), high-level or external-facing design, and detailed or
        internal-facing design. High-level design specifies the interaction of
        major components with one another and the environment (external events
        and messages, data formats and protocols, ordering and timing,
        end-to-end transactions, data persistence) within the envelope
        established by the architecture; detailed design proceeds within the
        high-level design's constraints and specifies components' internal

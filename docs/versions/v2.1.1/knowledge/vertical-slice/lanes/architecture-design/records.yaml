    - id: se:EVD-ARC-0010
      record_version: 0.1.0
      lifecycle_status: PENDING_REVIEW
      created_on: "2026-11-06"
      source_locator_ref: se:LOC-CS2023-SE-DESIGN-KU
      evidence_type: SYNTHESIS
      statement: >-
        Synthesis for anti-pattern formulation: because CS2023 SE-Design states that
        consistent APIs are easier to learn and less error-prone and that API consistency is
        both internal (between different portions of the API) and external (following common
        API patterns), an API surface whose portions follow divergent conventions or that
        ignores common external API patterns negates those stated benefits and is formulated
        here as an inconsistent API surface anti-pattern.
      context: "Lane-level synthesis derived only from CS2023 SE-Design KA Core topic 5a sub-topics."
      method: "Inversion of the curriculum's stated consistency benefits into a counterproductive-structure formulation."
      result: "An anti-pattern shape (inconsistent API surface) is derived without any external case evidence."
      limitations:
        - Synthesis of a curriculum teaching principle into an anti-pattern shape; CS2023 does not itself name or describe an anti-pattern.
        - No real-world case evidence is admitted; see the architecture and design real-case coverage gap.
        - "Inferred attribution: the anti-pattern's symptoms/causes/consequences are interpretations, not extracted source statements."
      uncertainty:
        - Whether reviewers accept deriving an anti-pattern record from a single curriculum principle is an open review question.
      extraction_status: EXTRACTED_PENDING_REVIEW
      synthetic: false

id: https://github.com/kaicreator-mm/tally
name: tally_software_engineering_knowledge_model
title: Tally Software Engineering Knowledge Model
description: >-
  Experimental full-domain knowledge model for Tally v2.1.1. It separates
  authority/provenance, domain content, taxonomy views, review events and typed
  relationship assertions. It is not a production ontology or runtime dependency.
version: "0.3.0"
prefixes:
  linkml: https://w3id.org/linkml/
  se: https://github.com/kaicreator-mm/tally#
  schema: http://schema.org/
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
default_prefix: se
default_range: string
imports:
  - linkml:types

classes:
  KnowledgeEntity:
    abstract: true
    description: >-
      Common identity and lifecycle contract. Every entity is a stable resource
      with an explicit record revision; changes create a new record revision,
      not a new identity, unless the conceptual identity itself changes.
    slots:
      - id
      - record_version
      - lifecycle_status
      - created_on
      - updated_on
      - aliases

  Domain:
    is_a: KnowledgeEntity
    class_uri: se:Domain
    description: A bounded discipline or application domain.
    slots:
      - label
      - definition
      - scope_inclusions
      - scope_exclusions
      - boundary_notes
      - evidence_refs

  Subdomain:
    is_a: KnowledgeEntity
    class_uri: se:Subdomain
    description: A named specialization or bounded part of a Domain.
    slots:
      - label
      - definition
      - domain_ref
      - boundary_notes
      - evidence_refs

  TaxonomyView:
    is_a: KnowledgeEntity
    class_uri: se:TaxonomyView
    description: >-
      One classification lens. Discipline, curriculum, lifecycle, quality,
      architecture and application views remain separate questions.
    slots:
      - label
      - view_kind
      - purpose
      - coverage_state
      - limitations
      - evidence_refs

  TaxonomyNode:
    is_a: KnowledgeEntity
    class_uri: se:TaxonomyNode
    description: >-
      A node belonging to exactly one taxonomy view. The same topic may have
      separate nodes in different views; cross-view semantics are expressed by
      typed RelationshipAssertion records rather than a forced universal tree.
    slots:
      - label
      - definition
      - node_kind
      - view_ref
      - evidence_refs

  Source:
    is_a: KnowledgeEntity
    class_uri: se:Source
    description: Bibliographic identity and authority/access metadata for a source.
    slots:
      - title
      - source_class
      - source_roles
      - organization
      - authors
      - edition
      - publication_date
      - official_url
      - stable_identifier
      - authority_fit
      - authority_limitations
      - rights_handling
      - verification_state

  SourceLocator:
    is_a: KnowledgeEntity
    class_uri: se:SourceLocator
    description: An exact inspected location within one identified source.
    slots:
      - source_ref
      - locator_type
      - locator
      - verified_content_summary
      - verification_state
      - accessed_on
    unique_keys:
      source_and_locator:
        unique_key_slots:
          - source_ref
          - locator

  Evidence:
    is_a: KnowledgeEntity
    class_uri: se:Evidence
    description: A source-grounded observation, extraction or explicitly synthetic fixture.
    slots:
      - source_locator_ref
      - evidence_type
      - statement
      - context
      - method
      - result
      - limitations
      - uncertainty
      - extraction_status
      - synthetic

  Concept:
    is_a: KnowledgeEntity
    class_uri: se:Concept
    description: A defined domain idea, term or abstraction.
    slots:
      - label
      - definition
      - concept_kind
      - synonyms
      - scope_description
      - applicability
      - evidence_refs
      - claim_refs

  KnowledgeClaim:
    is_a: KnowledgeEntity
    class_uri: se:KnowledgeClaim
    description: An atomic, scoped, falsifiable or reviewable statement about the domain.
    slots:
      - statement
      - claim_kind
      - scope_description
      - applicability
      - assumptions
      - exceptions
      - limitations
      - uncertainty
      - evidence_refs
      - review_status

  Principle:
    is_a: KnowledgeEntity
    class_uri: se:Principle
    description: A generalizable rationale or guiding proposition, not a universal prescription.
    slots:
      - label
      - statement
      - rationale
      - scope_description
      - applicability
      - exceptions
      - limitations
      - evidence_refs
      - claim_refs

  Practice:
    is_a: KnowledgeEntity
    class_uri: se:Practice
    description: An actionable engineering activity with context and trade-offs.
    slots:
      - label
      - intent
      - description
      - preconditions
      - steps
      - expected_outcomes
      - risks
      - scope_description
      - applicability
      - evidence_refs
      - claim_refs

  Pattern:
    is_a: KnowledgeEntity
    class_uri: se:Pattern
    description: A recurring problem/context/solution structure with documented trade-offs.
    slots:
      - label
      - problem
      - context
      - forces
      - solution
      - consequences
      - tradeoffs
      - scope_description
      - evidence_refs
      - case_refs
    slot_usage:
      context:
        required: true

  AntiPattern:
    is_a: KnowledgeEntity
    class_uri: se:AntiPattern
    description: A recurring counterproductive approach with symptoms, causes and remediation.
    slots:
      - label
      - symptoms
      - causes
      - consequences
      - remediation
      - scope_description
      - evidence_refs
      - case_refs
    slot_usage:
      symptoms:
        required: true
      causes:
        required: true
      consequences:
        required: true

  DecisionModel:
    is_a: KnowledgeEntity
    class_uri: se:DecisionModel
    description: A reusable decision question, options, criteria and trade-off procedure.
    slots:
      - decision_question
      - options
      - criteria
      - constraints
      - procedure
      - tradeoffs
      - scope_description
      - evidence_refs
      - claim_refs

  Case:
    is_a: KnowledgeEntity
    class_uri: se:Case
    description: A real, source-grounded engineering example, incident or case study.
    slots:
      - label
      - case_kind
      - context
      - problem
      - intervention
      - outcome
      - lessons
      - synthetic
      - evidence_refs
    slot_usage:
      context:
        required: true

  Counterexample:
    is_a: Case
    class_uri: se:Counterexample
    description: A case explicitly challenging a claim, principle, practice or model.
    slots:
      - counterexample_to_refs
      - contrary_observation

  ReviewDecision:
    is_a: KnowledgeEntity
    class_uri: se:ReviewDecision
    description: An auditable human review event bound to an exact record revision and digest.
    slots:
      - target_ref
      - target_record_version
      - target_digest_sha256
      - reviewer_role
      - reviewer_ref
      - decision
      - rationale
      - reviewed_on
      - review_policy_ref

  CoverageGap:
    is_a: KnowledgeEntity
    class_uri: se:CoverageGap
    description: An explicit missing, weak, disputed or out-of-scope coverage item.
    slots:
      - label
      - target_scope_ref
      - gap_kind
      - description
      - severity
      - coverage_status
      - impact
      - resolution_notes
      - evidence_refs
    slot_usage:
      label:
        required: false

  RelationshipAssertion:
    is_a: KnowledgeEntity
    class_uri: rdf:Statement
    description: >-
      A directed, typed, versioned and reviewable edge. The predicate catalog
      supplies endpoint classes and evidence requirements; it is not a free string.
    slots:
      - subject_ref
      - predicate
      - object_ref
      - qualifiers
      - context
      - rationale
      - evidence_refs
    slot_usage:
      context:
        required: true

  KnowledgeGraph:
    tree_root: true
    class_uri: se:KnowledgeGraph
    description: Versioned collection root for the experimental corpus.
    slots:
      - id
      - graph_version
      - generated_on
      - domain_ref
      - domains
      - subdomains
      - taxonomy_views
      - taxonomy_nodes
      - sources
      - source_locators
      - evidence_records
      - concepts
      - knowledge_claims
      - principles
      - practices
      - patterns
      - anti_patterns
      - decision_models
      - cases
      - counterexamples
      - review_decisions
      - coverage_gaps
      - relationship_assertions

slots:
  id:
    description: "Stable canonical identifier for this record."
    identifier: true
    required: true
    range: uriorcurie
    id_prefixes:
      - se
    slot_uri: schema:identifier
  record_version:
    required: true
    range: string
    description: Revision of this record under a stable ID, using MAJOR.MINOR.PATCH.
  lifecycle_status:
    description: "Lifecycle state of the record."
    required: true
    range: LifecycleStatus
  created_on:
    description: "Date when the record was created."
    required: true
    range: date
  updated_on:
    description: "Date when the record was last updated."
    range: date
  aliases:
    range: string
    multivalued: true
    description: Non-canonical legacy identifiers; never used as relationship targets.
  label:
    description: "Human-readable name of the record."
    required: true
    range: string
    slot_uri: rdfs:label
  definition:
    description: "Definition of the named subject."
    required: true
    range: string
    slot_uri: schema:description
  scope_inclusions:
    description: "Subjects included in the stated scope."
    range: string
    multivalued: true
  scope_exclusions:
    description: "Subjects excluded from the stated scope."
    range: string
    multivalued: true
  boundary_notes:
    description: "Notes describing the boundary of the scope."
    range: string
    multivalued: true
  domain_ref:
    description: "Reference to the associated domain."
    required: true
    range: Domain
    inlined: false
  view_kind:
    description: "Kind of classification view."
    required: true
    range: TaxonomyViewKind
  purpose:
    description: "Purpose of the record or view."
    required: true
    range: string
  coverage_state:
    description: "State of coverage under the specified profile."
    required: true
    range: CoverageState
  node_kind:
    description: "Kind of taxonomy node."
    required: true
    range: TaxonomyNodeKind
  view_ref:
    description: "Reference to the taxonomy view containing the node."
    required: true
    range: TaxonomyView
    inlined: false
  source_class:
    description: "Classification of the source."
    required: true
    range: SourceClass
  source_roles:
    description: "Roles attributed to the source."
    required: true
    range: SourceRole
    multivalued: true
  organization:
    description: "Organization associated with the source."
    range: string
  authors:
    description: "Authors associated with the source."
    range: string
    multivalued: true
  title:
    description: "Title of the source."
    required: true
    range: string
  edition:
    description: "Edition or version of the source."
    range: string
  publication_date:
    description: "Publication date as reported for the source."
    range: string
  official_url:
    description: "Official URL of the source."
    range: uri
  stable_identifier:
    description: "Persistent bibliographic or source identifier."
    range: string
  authority_fit:
    description: "Purposes for which the source has relevant authority."
    range: string
    multivalued: true
  authority_limitations:
    description: "Limits on the source's authority or applicability."
    range: string
    multivalued: true
  rights_handling:
    description: "Rights and access handling for the source."
    required: true
    range: string
  verification_state:
    description: "Recorded state of source or locator verification."
    required: true
    range: VerificationState
  source_ref:
    description: "Reference to the source containing the locator."
    required: true
    range: Source
    inlined: false
    slot_uri: dcterms:source
  locator_type:
    description: "Kind of source location."
    required: true
    range: LocatorType
  locator:
    description: "Location within the referenced source."
    required: true
    range: string
  verified_content_summary:
    description: "Summary of content verified at the locator."
    range: string
  accessed_on:
    description: "Date on which the source location was accessed."
    required: true
    range: date
  source_locator_ref:
    description: "Reference to the source location supporting the evidence."
    required: true
    range: SourceLocator
    inlined: false
    slot_uri: prov:wasDerivedFrom
  evidence_type:
    description: "Kind of evidence record."
    required: true
    range: EvidenceType
  statement:
    description: "Statement expressed by the record."
    required: true
    range: string
    slot_uri: schema:text
  context:
    description: "Context in which the record or assertion applies."
    range: string
  method:
    description: "Method used to obtain the observation."
    range: string
  result:
    description: "Result of the observation or method."
    range: string
  limitations:
    description: "Known limits of the record or observation."
    range: string
    multivalued: true
  uncertainty:
    description: "Recorded uncertainties relevant to the record."
    range: string
    multivalued: true
  extraction_status:
    description: "Review state of the evidence extraction."
    required: true
    range: EvidenceStatus
  synthetic:
    description: "Whether the record is a synthetic fixture."
    required: true
    range: boolean
  concept_kind:
    description: "Kind of concept represented."
    required: true
    range: ConceptKind
  synonyms:
    description: "Alternative terms for the concept."
    range: string
    multivalued: true
  scope_description:
    description: "Description of the applicable scope."
    required: true
    range: string
  applicability:
    description: "Conditions under which the record applies."
    range: string
  evidence_refs:
    description: "References to evidence supporting the record."
    range: Evidence
    multivalued: true
    inlined: false
    slot_uri: prov:wasDerivedFrom
  claim_refs:
    description: "References to related knowledge claims."
    range: KnowledgeClaim
    multivalued: true
    inlined: false
  claim_kind:
    description: "Kind of knowledge claim."
    required: true
    range: ClaimKind
  assumptions:
    description: "Assumptions associated with the claim."
    range: string
    multivalued: true
  exceptions:
    description: "Known exceptions to the record."
    range: string
    multivalued: true
  review_status:
    description: "Review status of the knowledge claim."
    required: true
    range: ReviewStatus
  rationale:
    description: "Reasoning supporting the record or decision."
    required: true
    range: string
  intent:
    description: "Intended purpose of the practice."
    required: true
    range: string
  description:
    description: "Description of the record's subject."
    required: true
    range: string
  preconditions:
    description: "Conditions expected before applying the practice."
    range: string
    multivalued: true
  steps:
    description: "Steps in the practice."
    range: string
    multivalued: true
  expected_outcomes:
    description: "Outcomes expected from applying the practice."
    range: string
    multivalued: true
  risks:
    description: "Risks associated with the practice."
    range: string
    multivalued: true
  problem:
    description: "Problem addressed by the pattern or case."
    required: true
    range: string
  forces:
    description: "Forces influencing the pattern's solution."
    range: string
    multivalued: true
  solution:
    description: "Solution proposed by the pattern."
    required: true
    range: string
  consequences:
    description: "Consequences associated with the pattern or anti-pattern."
    range: string
    multivalued: true
  tradeoffs:
    description: "Trade-offs associated with the pattern."
    range: string
    multivalued: true
  symptoms:
    description: "Observable symptoms of the anti-pattern."
    range: string
    multivalued: true
  causes:
    description: "Causes associated with the anti-pattern."
    range: string
    multivalued: true
  remediation:
    description: "Approach for addressing the anti-pattern."
    required: true
    range: string
  decision_question:
    description: "Question addressed by the decision model."
    required: true
    range: string
  options:
    description: "Options considered by the decision model."
    range: string
    multivalued: true
  criteria:
    description: "Criteria used to compare decision options."
    range: string
    multivalued: true
  constraints:
    description: "Constraints on the decision."
    range: string
    multivalued: true
  procedure:
    description: "Procedure for applying the decision model."
    required: true
    range: string
  case_kind:
    description: "Kind of case or counterexample."
    required: true
    range: CaseKind
  case_refs:
    description: "References to cases associated with the record."
    range: Case
    multivalued: true
    inlined: false
  intervention:
    description: "Intervention described by the case."
    range: string
  outcome:
    description: "Observed or stated outcome of the case."
    range: string
  lessons:
    description: "Lessons recorded from the case."
    range: string
    multivalued: true
  counterexample_to_refs:
    description: "References to claims challenged by the counterexample."
    required: true
    range: KnowledgeEntity
    multivalued: true
    inlined: false
  contrary_observation:
    description: "Observation that challenges a referenced claim."
    required: true
    range: string
  target_ref:
    description: "Reference to the record reviewed by a decision."
    required: true
    range: KnowledgeEntity
    inlined: false
  target_record_version:
    description: "Revision of the target record covered by the review."
    required: true
    range: string
  target_digest_sha256:
    description: "SHA-256 digest binding the review to the target record."
    required: true
    range: string
  reviewer_role:
    description: "Role of the reviewer."
    required: true
    range: ReviewerRole
  reviewer_ref:
    description: "Identifier of the reviewer."
    required: true
    range: string
  decision:
    description: "Outcome of the review decision."
    required: true
    range: ReviewOutcome
  reviewed_on:
    description: "Date on which the review was performed."
    required: true
    range: date
  review_policy_ref:
    description: "Reference to the policy used for the review."
    required: true
    range: string
  target_scope_ref:
    description: "Reference to the scope affected by the coverage gap."
    required: true
    range: KnowledgeEntity
    inlined: false
  gap_kind:
    description: "Kind of coverage gap."
    required: true
    range: GapKind
  severity:
    description: "Severity assigned to the coverage gap."
    required: true
    range: GapSeverity
  coverage_status:
    description: "Status of the coverage gap."
    required: true
    range: GapStatus
  impact:
    description: "Impact of the coverage gap."
    required: true
    range: string
  resolution_notes:
    description: "Notes on resolution or disposition of the gap."
    range: string
    multivalued: true
  subject_ref:
    description: "Reference to the subject of the relationship assertion."
    required: true
    range: KnowledgeEntity
    inlined: false
    slot_uri: rdf:subject
  predicate:
    description: "Controlled predicate of the relationship assertion."
    required: true
    range: RelationshipPredicate
    slot_uri: rdf:predicate
  object_ref:
    description: "Reference to the object of the relationship assertion."
    required: true
    range: KnowledgeEntity
    inlined: false
    slot_uri: rdf:object
  qualifiers:
    description: "Qualifiers constraining the relationship assertion."
    range: string
    multivalued: true
  graph_version:
    description: "Version of the knowledge graph snapshot."
    required: true
    range: string
  generated_on:
    description: "Date on which the graph snapshot was generated."
    required: true
    range: date
  domains:
    description: "Domain records included in the graph."
    range: Domain
    multivalued: true
    inlined: true
    inlined_as_list: true
  subdomains:
    description: "Subdomain records included in the graph."
    range: Subdomain
    multivalued: true
    inlined: true
    inlined_as_list: true
  taxonomy_views:
    description: "Taxonomy view records included in the graph."
    range: TaxonomyView
    multivalued: true
    inlined: true
    inlined_as_list: true
  taxonomy_nodes:
    description: "Taxonomy node records included in the graph."
    range: TaxonomyNode
    multivalued: true
    inlined: true
    inlined_as_list: true
  sources:
    description: "Source records included in the graph."
    range: Source
    multivalued: true
    inlined: true
    inlined_as_list: true
  source_locators:
    description: "Source locator records included in the graph."
    range: SourceLocator
    multivalued: true
    inlined: true
    inlined_as_list: true
  evidence_records:
    description: "Evidence records included in the graph."
    range: Evidence
    multivalued: true
    inlined: true
    inlined_as_list: true
  concepts:
    description: "Concept records included in the graph."
    range: Concept
    multivalued: true
    inlined: true
    inlined_as_list: true
  knowledge_claims:
    description: "Knowledge claim records included in the graph."
    range: KnowledgeClaim
    multivalued: true
    inlined: true
    inlined_as_list: true
  principles:
    description: "Principle records included in the graph."
    range: Principle
    multivalued: true
    inlined: true
    inlined_as_list: true
  practices:
    description: "Practice records included in the graph."
    range: Practice
    multivalued: true
    inlined: true
    inlined_as_list: true
  patterns:
    description: "Pattern records included in the graph."
    range: Pattern
    multivalued: true
    inlined: true
    inlined_as_list: true
  anti_patterns:
    description: "Anti-pattern records included in the graph."
    range: AntiPattern
    multivalued: true
    inlined: true
    inlined_as_list: true
  decision_models:
    description: "Decision model records included in the graph."
    range: DecisionModel
    multivalued: true
    inlined: true
    inlined_as_list: true
  cases:
    description: "Case records included in the graph."
    range: Case
    multivalued: true
    inlined: true
    inlined_as_list: true
  counterexamples:
    description: "Counterexample records included in the graph."
    range: Counterexample
    multivalued: true
    inlined: true
    inlined_as_list: true
  review_decisions:
    description: "Review decision records included in the graph."
    range: ReviewDecision
    multivalued: true
    inlined: true
    inlined_as_list: true
  coverage_gaps:
    description: "Coverage gap records included in the graph."
    range: CoverageGap
    multivalued: true
    inlined: true
    inlined_as_list: true
  relationship_assertions:
    description: "Relationship assertion records included in the graph."
    range: RelationshipAssertion
    multivalued: true
    inlined: true
    inlined_as_list: true

enums:
  LifecycleStatus:
    description: "Lifecycle states for knowledge records."
    permissible_values:
      DRAFT: {}
      PROPOSED: {}
      PENDING_REVIEW: {}
      ACCEPTED: {}
      DISPUTED: {}
      REJECTED: {}
      DEPRECATED: {}
      SUPERSEDED: {}
      ACTIVE: {}
      WITHDRAWN: {}
      RETRACTED: {}
  SourceClass:
    description: "Classes of knowledge sources."
    permissible_values:
      PROFESSIONAL_BOK: {}
      CURRICULUM_FRAMEWORK: {}
      NORMATIVE_STANDARD: {}
      GOVERNMENT_FRAMEWORK: {}
      GOVERNMENT_GUIDANCE: {}
      PEER_REVIEWED_RESEARCH: {}
      TEXTBOOK: {}
      OFFICIAL_TECHNICAL_DOCUMENTATION: {}
      EMPIRICAL_CASE: {}
      OTHER: {}
  SourceRole:
    description: "Roles a source can serve."
    permissible_values:
      PRIMARY: {}
      SECONDARY: {}
      COMPARATOR: {}
      CONTEXT: {}
  VerificationState:
    description: "Verification states for sources and locators."
    permissible_values:
      IDENTITY_VERIFIED: {}
      CONTENT_PARTIAL_VERIFIED: {}
      CONTENT_VERIFIED: {}
      ABSTRACT_VERIFIED: {}
      METADATA_ONLY: {}
      LOCATOR_VERIFIED: {}
      LOCATOR_UNKNOWN: {}
      NOT_VERIFIED: {}
  LocatorType:
    description: "Kinds of locations within a source."
    permissible_values:
      TITLE_PAGE: {}
      SECTION: {}
      CHAPTER: {}
      PAGE: {}
      TABLE: {}
      FIGURE: {}
      ABSTRACT: {}
      DOI: {}
      URL_FRAGMENT: {}
      OTHER: {}
  EvidenceType:
    description: "Kinds of evidence records."
    permissible_values:
      DIRECT_SOURCE_PARAPHRASE: {}
      OBSERVATION: {}
      EMPIRICAL_RESULT: {}
      SYNTHESIS: {}
      COUNTEREVIDENCE: {}
      NEGATIVE_FINDING: {}
      SYNTHETIC_FIXTURE: {}
  EvidenceStatus:
    description: "Extraction and review states for evidence."
    permissible_values:
      EXTRACTED_PENDING_REVIEW: {}
      REVIEWED: {}
      REJECTED: {}
      SUPERSEDED: {}
      DISPUTED: {}
  TaxonomyViewKind:
    description: "Kinds of taxonomy views."
    permissible_values:
      DISCIPLINE: {}
      CURRICULUM: {}
      LIFECYCLE: {}
      PROCESS: {}
      QUALITY: {}
      ARCHITECTURE: {}
      TESTING: {}

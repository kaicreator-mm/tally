open_questions:
  - "Are all 18 SWEBOK KAs retained as top-level nodes, or should selected foundations be modeled as a linked foundation layer?"
  - "Which quality dimensions should be modeled as stable concepts versus sourced quality-model members?"
  - "How should lifecycle process and discipline knowledge be joined without encoding a single SDLC sequence?"
  - "What is the correct boundary between Software Engineering, AI Engineering and Data Engineering?"
  - "Which application contexts justify specialized subdomain views?"

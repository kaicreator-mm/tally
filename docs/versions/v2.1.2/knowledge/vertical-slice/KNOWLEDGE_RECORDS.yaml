evidence_records:
  - evidence_id: SE-EVD-0001
    evidence_type: DIRECT_SOURCE_PARAPHRASE
    source_locator_ref: SE-LOC-SWEBOK-KA-TABLE
    paraphrase: "SWEBOK v4.0a lists 18 Knowledge Areas and classifies the first 15 as Software Engineering KAs and the last three as foundation KAs."
    context: "The claim describes the Guide's own taxonomy, not an independently exhaustive classification of the discipline."
    limitations: ["Professional guide taxonomy; not the entire body of knowledge."]
    extraction_status: EXTRACTED_PENDING_REVIEW
  - evidence_id: SE-EVD-0002
    evidence_type: DIRECT_SOURCE_PARAPHRASE
    source_locator_ref: SE-LOC-SWEBOK-RELATED-DISCIPLINES
    paraphrase: "SWEBOK identifies eleven related disciplines and states that characterizing their knowledge is not an objective of the Guide."
    context: "Boundary statement made by the Guide itself."
    limitations: ["Does not provide detailed definitions of the related disciplines."]
    extraction_status: EXTRACTED_PENDING_REVIEW
  - evidence_id: SE-EVD-0003
    evidence_type: DIRECT_SOURCE_PARAPHRASE
    source_locator_ref: SE-LOC-SWEBOK-GUIDE-LIMIT
    paraphrase: "The Guide describes itself as a guide to the body of knowledge and explicitly says it does not present the entire Software Engineering body of knowledge."
    context: "Scope limitation in the foreword to the 2014 edition reproduced in the v4.0a PDF."
    limitations: ["This is the Guide's scope statement, not a completeness measurement."]
    extraction_status: EXTRACTED_PENDING_REVIEW
  - evidence_id: SE-EVD-0004
    evidence_type: DIRECT_SOURCE_PARAPHRASE
    source_locator_ref: SE-LOC-SWEBOK-CITATION-LIMIT
    paraphrase: "SWEBOK says it does not attempt to be comprehensive in its citations and that suitable material may be unreferenced."
    context: "Reference Material and Matrix section."
    limitations: ["A missing citation cannot be interpreted as absence of authoritative material."]
    extraction_status: EXTRACTED_PENDING_REVIEW
  - evidence_id: SE-EVD-0005
    evidence_type: DIRECT_SOURCE_PARAPHRASE
    source_locator_ref: SE-LOC-SWEBOK-DEPTH
    paraphrase: "SWEBOK says generally accepted knowledge should not be uniformly applied to all software engineering endeavors; project needs determine what knowledge to apply and how."
    context: "Depth of Treatment section."
    limitations: ["The statement is a context/applicability qualification, not a claim that all practices are optional."]
    extraction_status: EXTRACTED_PENDING_REVIEW
  - evidence_id: SE-EVD-0006
    evidence_type: DIRECT_SOURCE_PARAPHRASE
    source_locator_ref: SE-LOC-CS2023-BOK-TABLE
    paraphrase: "CS2023's curriculum Body of Knowledge lists 17 Knowledge Areas; Software Engineering is one area and has nine Knowledge Units."
    context: "Curriculum classification, not professional domain completeness."
    limitations: ["The count is specific to CS2023's curriculum model and edition."]
    extraction_status: EXTRACTED_PENDING_REVIEW
  - evidence_id: SE-EVD-0007
    evidence_type: DIRECT_SOURCE_PARAPHRASE
    source_locator_ref: SE-LOC-CS2023-CROSS-KA
    paraphrase: "CS2023 says Knowledge Areas are not insular; cross-area references connect topics and a topic appearing in more than one area may be presented from different perspectives."
    context: "Knowledge Model explanation."
    limitations: ["Curriculum cross-references do not prove a universal Software Engineering ontology."]
    extraction_status: EXTRACTED_PENDING_REVIEW
  - evidence_id: SE-EVD-0008
    evidence_type: DIRECT_SOURCE_PARAPHRASE
    source_locator_ref: SE-LOC-NIST-218-GROUPS
    paraphrase: "NIST SP 800-218 v1.1 organizes SSDF practices into Prepare the Organization (PO), Protect the Software (PS), Produce Well-Secured Software (PW), and Respond to Vulnerabilities (RV)."
    context: "Section 2, SSDF practice-group structure."
    limitations: ["This is the structure of SP 800-218 v1.1, not a universal security taxonomy."]
    extraction_status: EXTRACTED_PENDING_REVIEW
  - evidence_id: SE-EVD-0009
    evidence_type: DIRECT_SOURCE_PARAPHRASE
    source_locator_ref: SE-LOC-NIST-218-ABSTRACT
    paraphrase: "NIST recommends that high-level SSDF practices be integrated into each SDLC implementation; the abstract describes intended vulnerability-risk reduction outcomes."
    context: "NIST recommendation and stated intended outcomes."
    limitations: ["The abstract does not itself establish a measured causal effect or guarantee of vulnerability reduction."]
    extraction_status: EXTRACTED_PENDING_REVIEW
  - evidence_id: SE-EVD-0010
    evidence_type: DIRECT_SOURCE_PARAPHRASE
    source_locator_ref: SE-LOC-NIST-218-RISK
    paraphrase: "NIST says practice selection and implementation effort should consider risk, cost, feasibility and applicability; practices are to be customized and the framework is not intended as a checklist."
    context: "Section 1 risk-based adoption guidance."
    limitations: ["The recommendation requires organization- and use-case-specific judgment."]
    extraction_status: EXTRACTED_PENDING_REVIEW
  - evidence_id: SE-EVD-0011
    evidence_type: DIRECT_SOURCE_PARAPHRASE
    source_locator_ref: SE-LOC-NIST-218-ORDER
    paraphrase: "NIST says the order of practices, tasks and notional implementation examples does not imply implementation sequence or relative importance."
    context: "Section 2 explanation of Table 1."
    limitations: ["Does not imply that dependencies between particular tasks never exist."]
    extraction_status: EXTRACTED_PENDING_REVIEW
  - evidence_id: SE-EVD-0012
    evidence_type: DIRECT_SOURCE_PARAPHRASE
    source_locator_ref: SE-LOC-NIST-218A-ABSTRACT
    paraphrase: "NIST describes SP 800-218A as a companion profile that adds AI-model-specific practices to SSDF 1.1 and is intended to be used with SP 800-218."
    context: "Official NIST CSRC abstract."
    limitations: ["Only abstract/metadata verified; detailed practice content remains unreviewed."]
    extraction_status: EXTRACTED_PENDING_REVIEW
knowledge_claims:
  - claim_id: SE-CLM-0001
    claim_type: TAXONOMY_STATEMENT
    statement: "SWEBOK Guide v4.0a lists 18 Knowledge Areas; the first 15 are Software Engineering KAs and the final three are foundation KAs."
    scope: "The taxonomy as defined by SWEBOK Guide v4.0a."
    applicability: "Use as a reference mapping for domain discovery; do not claim it is the only valid taxonomy."
    assumptions: []
    limitations: ["Guide scope is not the entire body of knowledge."]
    review_status: PENDING
    source_refs: [SE-SRC-SWEBOK-GUIDE-4-0A]
    taxonomy_refs: [SE-TAXONOMY-0.1.0]
  - claim_id: SE-CLM-0002
    claim_type: DOMAIN_BOUNDARY
    statement: "SWEBOK identifies eleven related disciplines but does not aim to characterize the knowledge of those related disciplines."
    scope: "The boundary stated by SWEBOK v4.0a."
    applicability: "Use to distinguish software engineering knowledge from adjacent/shared disciplines."
    assumptions: []
    limitations: ["The Guide still expects software engineers to be knowledgeable about related disciplines."]
    review_status: PENDING
    source_refs: [SE-SRC-SWEBOK-GUIDE-4-0A]
    taxonomy_refs: [SE-TAXONOMY-0.1.0]
  - claim_id: SE-CLM-0003
    claim_type: SOURCE_SCOPE_LIMITATION
    statement: "SWEBOK Guide v4.0a explicitly does not present the entire Software Engineering body of knowledge."
    scope: "The Guide's own stated scope."
    applicability: "Do not use SWEBOK alone as proof of corpus completeness."
    assumptions: []
    limitations: ["This claim describes the Guide, not the completeness of any alternative corpus."]
    review_status: PENDING
    source_refs: [SE-SRC-SWEBOK-GUIDE-4-0A]
    taxonomy_refs: [SE-TAXONOMY-0.1.0]
  - claim_id: SE-CLM-0004
    claim_type: SOURCE_COVERAGE_LIMITATION
    statement: "SWEBOK v4.0a does not attempt to provide comprehensive citations."
    scope: "The Guide's reference coverage."
    applicability: "Treat SWEBOK references as research leads rather than an exhaustive authority registry."
    assumptions: []
    limitations: ["No quantitative coverage percentage is stated."]
    review_status: PENDING
    source_refs: [SE-SRC-SWEBOK-GUIDE-4-0A]
    taxonomy_refs: [SE-TAXONOMY-0.1.0]
  - claim_id: SE-CLM-0005
    claim_type: APPLICABILITY_QUALIFICATION
    statement: "SWEBOK's generally accepted knowledge should not be uniformly applied to all software engineering endeavors; project needs determine what knowledge to apply and how."
    scope: "SWEBOK v4.0a's Depth of Treatment discussion."
    applicability: "Use as a qualification against universal best-practice assertions."
    assumptions: []
    limitations: ["This does not mean engineering decisions need no justification or that all practices are optional."]
    review_status: PENDING
    source_refs: [SE-SRC-SWEBOK-GUIDE-4-0A]
    taxonomy_refs: [SE-TAXONOMY-0.1.0]
  - claim_id: SE-CLM-0006
    claim_type: CURRICULUM_BOUNDARY
    statement: "CS2023's curriculum model contains 17 Knowledge Areas; Software Engineering is one of them and is represented by nine Knowledge Units."
    scope: "ACM/IEEE-CS/AAAI Computer Science Curricula 2023."
    applicability: "Use as a curriculum comparator, not as a professional domain-completeness claim."
    assumptions: []
    limitations: ["The count is specific to this curriculum model and publication."]
    review_status: PENDING
    source_refs: [SE-SRC-CS2023]
    taxonomy_refs: [SE-TAXONOMY-0.1.0]
  - claim_id: SE-CLM-0007
    claim_type: CROSS_AREA_RELATIONSHIP
    statement: "CS2023 states that Knowledge Areas are not insular and that topics referenced in multiple areas may be presented from different perspectives."
    scope: "CS2023's curriculum knowledge model."
    applicability: "Supports testing typed cross-area relationships rather than assuming mutually exclusive topic ownership."
    assumptions: []
    limitations: ["A curriculum model is not a universal ontology."]
    review_status: PENDING
    source_refs: [SE-SRC-CS2023]
    taxonomy_refs: [SE-TAXONOMY-0.1.0]
  - claim_id: SE-CLM-0008
    claim_type: FRAMEWORK_STRUCTURE
    statement: "NIST SP 800-218 v1.1 organizes its SSDF practices into four groups: PO, PS, PW and RV."
    scope: "NIST SP 800-218 v1.1 Section 2."
    applicability: "Use as the SSDF v1.1 framework grouping only."
    assumptions: []
    limitations: ["Not a universal security taxonomy."]
    review_status: PENDING
    source_refs: [SE-SRC-NIST-SP-800-218-V1-1]
    taxonomy_refs: [SE-TAXONOMY-0.1.0]
  - claim_id: SE-CLM-0009
    claim_type: PRACTICE_RECOMMENDATION
    statement: "NIST recommends integrating high-level SSDF practices throughout the selected software development life cycle."
    scope: "NIST SP 800-218 v1.1 abstract and Section 1."
    applicability: "Security practice mapping must be related to the target SDLC and organization."
    assumptions: []
    limitations: ["This is a recommendation and stated intended outcome, not a measured causal guarantee."]
    review_status: PENDING
    source_refs: [SE-SRC-NIST-SP-800-218-V1-1]
    taxonomy_refs: [SE-TAXONOMY-0.1.0]
  - claim_id: SE-CLM-0010
    claim_type: APPLICABILITY_QUALIFICATION
    statement: "NIST says SSDF practice selection should consider risk, cost, feasibility and applicability; the practices are to be customized and the framework is not intended as a checklist."
    scope: "NIST SP 800-218 v1.1 Section 1."
    applicability: "Use when modeling practice applicability and decision context."
    assumptions: []
    limitations: ["Selection still requires documented risk and context judgment."]
    review_status: PENDING
    source_refs: [SE-SRC-NIST-SP-800-218-V1-1]
    taxonomy_refs: [SE-TAXONOMY-0.1.0]
  - claim_id: SE-CLM-0011
    claim_type: PROCESS_QUALIFICATION
    statement: "NIST states that the order of SSDF practices, tasks and notional examples does not imply implementation sequence or relative importance."
    scope: "NIST SP 800-218 v1.1 Section 2 and Table 1 explanation."
    applicability: "Do not derive a mandatory linear workflow from the presentation order of SSDF practices."
    assumptions: []
    limitations: ["Specific practice/task dependencies may still exist and need separate evidence."]
    review_status: PENDING
    source_refs: [SE-SRC-NIST-SP-800-218-V1-1]
    taxonomy_refs: [SE-TAXONOMY-0.1.0]
  - claim_id: SE-CLM-0012
    claim_type: COMPANION_FRAMEWORK_SCOPE
    statement: "NIST SP 800-218A augments SSDF 1.1 with AI-model-specific secure-development practices and is intended to be used in conjunction with SP 800-218."
    scope: "NIST SP 800-218A official abstract."
    applicability: "AI-model development requires checking the companion profile in addition to baseline SSDF 1.1."
    assumptions: []
    limitations: ["Only the abstract and publication metadata are verified; detailed practice content is not yet reviewed."]
    review_status: PENDING_LIMITED_EVIDENCE
    source_refs: [SE-SRC-NIST-SP-800-218A-2024, SE-SRC-NIST-SP-800-218-V1-1]
    taxonomy_refs: [SE-TAXONOMY-0.1.0]

name: v2-dh-v0103-released-tag-qualification
on:
  pull_request:
    paths:
      - 'experiments/v2/dh-v0103-candidate/**'
      - '.github/workflows/v2-dh-v0103-candidate-compatibility.yml'
permissions:
  contents: read
  issues: read
jobs:
  candidate-v0102-runtime-compat:
    name: DH v0.10.3 exact source tag / ${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scope: [selected-native-github-k-sqlite, host-physical-cas-wal]
    steps:
      - name: Check out exact authored Tally source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: tally
          persist-credentials: false
      - name: Immutable verified released DH v0.10.2 baseline
        uses: actions/checkout@v4
        with:
          repository: kaicreator-mm/domain-harness
          ref: cee14399d9d0af4e20e34b9111861b16a465b690
          path: dh-stable
          persist-credentials: false
      - name: Pinned published v0.10.3 source tag SHA
        uses: actions/checkout@v4
        with:
          repository: kaicreator-mm/domain-harness
          ref: 061376f4a023070f215f9feffad5c24d96d503cb
          path: domain-harness
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Released exact SHA, stable K/SQLite ABI and new provider contract gate
        shell: bash
        env:
          TALLY: ${{ github.workspace }}/tally
          DH: ${{ github.workspace }}/domain-harness
          DH_STABLE: ${{ github.workspace }}/dh-stable
        run: |
          set -Eeuo pipefail
          test "$(git -C "$TALLY" rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C "$DH" rev-parse HEAD)" = 061376f4a023070f215f9feffad5c24d96d503cb
          test "$(git -C "$DH_STABLE" rev-parse HEAD)" = cee14399d9d0af4e20e34b9111861b16a465b690
          # The released tag changes Contracts LLM and Host Provider surfaces.
          # Compare only the unchanged, load-bearing Tally-selected K/SQLite/BUILD
          # seams; new public Provider behavior is exercised separately below.
          for path in packages/microkernel tooling/build domain-packages/kernel/basic domain-packages/standard/basic packages/host-node/src/sqlite-cas.ts packages/host-node/src/sqlite-adapter.ts; do
            if ! git diff --no-index --quiet "$DH_STABLE/$path" "$DH/$path"; then
              echo "DH_V0103_SELECTED_RUNTIME_ABI_CHANGED_IMPACT_REVIEW_REQUIRED:$path"
              exit 14
            fi
          done
          test -f "$DH/packages/contracts/src/llm-generate-v1.ts"
          test -f "$DH/packages/host-node/src/verified-provider-bundle.ts"
          test -f "$DH/tests/hosts/node/v0103-verified-provider-bundle.test.ts"
          test -f "$DH/tests/contracts/v0103-llm-generate-v1.test.ts"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const root=process.env.DH;
            for(const folder of ["packages/contracts","packages/microkernel","packages/host-node","tooling/build"]){
              const p=JSON.parse(readFileSync(root+"/"+folder+"/package.json","utf8"));
              if(p.version!=="0.10.2-rc.0")throw Error("IN_PROGRESS_CANDIDATE_PACKAGE_VERSION_CHANGED:"+folder+":"+p.version);
              console.log(folder+"="+p.version);
            }
          '
          echo DH_V0103_RELEASE_SOURCE_PUBLIC_RUNTIME_SEAMS_COMPARED=PASS
          echo DH_V0103_GIT_TAG_SOURCE_VERIFIED=YES
          echo DH_V0103_PUBLIC_NPM_0103_MANIFEST=NOT_CLAIMED
      - name: Exercise actual Tally consumer and released DomainHarness provider contracts
        shell: bash
        env:
          TALLY: ${{ github.workspace }}/tally
          TALLY_B: ${{ github.workspace }}/tally
          DH: ${{ github.workspace }}/domain-harness
          T04B_NATIVE: '1'
          TALLY_NATIVE_EXPECTED_SHA: 6356c96a45fcc2b7ee91642b1d87080f940b15af
          TALLY_GITHUB_READ_TOKEN: ${{ github.token }}
          WCX_WAL_STRESS: '1'
          WCX_WAL_ROUNDS: '5'
          TEST_SCOPE: ${{ matrix.scope }}
        run: |
          set -Eeuo pipefail
          # Prior v0.10.2 receipts stay immutable. A transient copy replaces
          # only the old source SHA guard with this exact Git-tagged SHA.
          # This is NOT an npm package version rewrite or Task authorization.
          case "$TEST_SCOPE" in
            selected-native-github-k-sqlite)
              original="$TALLY/experiments/v2/selected-business-build/run-clean.sh"
              ;;
            host-physical-cas-wal)
              original="$TALLY/experiments/v2/host-sqlite-cas/run-clean.sh"
              ;;
            *) exit 12;;
          esac
          stable='cee14399d9d0af4e20e34b9111861b16a465b690'
          candidate='061376f4a023070f215f9feffad5c24d96d503cb'
          test "$(grep -o "$stable" "$original" | wc -l)" -eq 1
          scoped="$RUNNER_TEMP/tally-dh-candidate-$TEST_SCOPE.sh"
          sed "s/$stable/$candidate/g" "$original" > "$scoped"
          test "$(grep -o "$candidate" "$scoped" | wc -l)" -eq 1
          test "$(grep -c "$stable" "$scoped" || true)" -eq 0
          chmod +x "$scoped"
          bash "$scoped"
          if [[ "$TEST_SCOPE" == "selected-native-github-k-sqlite" ]]; then
            # New v0.10.3-specific contract/integrity negative tests run
            # from the actual installed and freshly built SDK source.
            cd "$DH"
            node --import tsx --test tests/contracts/v0103-llm-generate-v1.test.ts tests/hosts/node/v0103-verified-provider-bundle.test.ts
            echo DH_V0103_PROVIDER_INTEGRITY_CONTRACT_NEGATIVES=PASS
          fi
          case "$TEST_SCOPE" in
            selected-native-github-k-sqlite) echo TALLY_V2_DH_V0103_TAG_GITHUB_K_SQLITE=PASS;;
            host-physical-cas-wal) echo TALLY_V2_DH_V0103_TAG_HOST_CAS_WAL=PASS;;
          esac
          echo TALLY_V2_DH_V0103_TAG_CONSUMER_ONLY_NOT_TASK_CLAIM=PASS

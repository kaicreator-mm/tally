name: quality

# Legacy Go v1.5 maintenance only. Tally v2 on version/v2 is validated by
# the separate Node24/DomainHarness source and selected-host workflows.
# Do not run Go/PostgreSQL checks on v2 PRs; preserve main maintenance.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Repository hygiene
        run: go run ./scripts/repohealth
      - name: Current documentation consistency
        run: go run ./scripts/docscheck
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Architecture, domain, runtime, CLI and tooling tests
        run: |
          go test ./test/arch/...
          go test ./internal/...
          go test ./cmd/...
          go test ./runtimes/...
          go test ./test/runtimeconformance/...
          go test ./scripts/...
      - name: Build production binaries
        run: make build
      - name: Safe Export exact-HEAD self-check
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          go test ./scripts/export -count=1
          go run ./scripts/export -ref HEAD -out "$RUNNER_TEMP/tally-export"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tally
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tally"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tally?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Migrate
        run: go run ./cmd/tally migrate
      - name: Integration tests
        run: go test -tags=integration ./...

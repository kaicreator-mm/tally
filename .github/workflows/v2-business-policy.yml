# SUSPENDED for version/v2 (#173, 2026-10-30): self-hosted Woodpecker is the sole
# v2 validation carrier. `version/v2` is excluded from every trigger below; this
# file is retained as historical provenance of pre-#173 v2 runs and its historical
# results are not rewritten. main/master legacy maintenance is unaffected.
name: v2-business-policy
on:
  pull_request:
    # #173: never execute for version/v2 PRs (Woodpecker-only v2 carrier).
    branches:
      - '**'
      - '!version/v2'
    paths:
      - 'packages/tally-engineering-business/**'
      - '.github/workflows/v2-business-policy.yml'
  push:
    branches:
      - 'feat/v2-t02a-engineering-business-readiness'
    paths:
      - 'packages/tally-engineering-business/**'
      - '.github/workflows/v2-business-policy.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          git rev-parse HEAD
          node --version
          npm --prefix packages/tally-engineering-business test

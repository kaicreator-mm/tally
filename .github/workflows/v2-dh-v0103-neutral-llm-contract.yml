name: v2-dh-v0103-neutral-llm-contract
on:
  pull_request:
    paths:
      - 'packages/tally-llm-contract/**'
      - '.github/workflows/v2-dh-v0103-neutral-llm-contract.yml'
permissions:
  contents: read
jobs:
  explicit-llm-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact authored Tally source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Frozen DomainHarness v0.10.3 L2 source, not released SDK
        uses: actions/checkout@v4
        with:
          repository: kaicreator-mm/domain-harness
          ref: e86f2c9450b962812fc03e1494aaad402490258e
          path: pinned-dh-contract
          persist-credentials: false
      - name: Node24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact reviewed neutral LLM L2 contract source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C pinned-dh-contract rev-parse HEAD)" = e86f2c9450b962812fc03e1494aaad402490258e
          source=pinned-dh-contract/docs/architecture/v0.10.3/L2_DESIGN_R0.en.md
          test "$(git hash-object "$source")" = be6c1e346d4eb6a0b7ade9960da37f30204d0661
          grep -Fq "dh.llm.generate/1" "$source"
          grep -Fq "llm.openai.generate" "$source"
          grep -Fq "llm.anthropic.generate" "$source"
          echo TALLY_DH_V0103_EXPLICIT_LLM_CONTRACT_SOURCE=PASS
      - name: Node24 explicit selected LLM intent and provenance negatives
        run: |
          npm --prefix packages/tally-llm-contract test
          echo TALLY_V2_DH_V0103_NEUTRAL_LLM_CONTRACT_FIRST=PASS

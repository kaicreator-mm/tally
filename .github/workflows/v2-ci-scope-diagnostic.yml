name: v2-ci-scope-diagnostic
on:
  pull_request:
permissions:
  contents: read
jobs:
  diagnose-source-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source and history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Node24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fail-closed source path cases
        run: node --test .github/scripts/v2-change-scope.test.mjs
      - name: Report source scope, without CI waiver
        run: |
          node .github/scripts/v2-change-scope.mjs \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
          echo "Legacy quality and other provider verdicts remain unchanged."

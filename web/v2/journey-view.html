<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Tally v2 · Agent-native ALM workspace</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#edf2ff;font-size:15px;line-height:1.5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0%,#1c2a4a 0,#0b1020 48%,#080c17 100%);min-height:100vh}
a{color:#8ec5ff;text-decoration-thickness:1px;text-underline-offset:3px}a:hover{color:#c3e2ff}code{font-family:"SFMono-Regular",Consolas,monospace;font-size:.84em;color:#b8c8e8}
.workspace{max-width:1440px;margin:0 auto;padding:42px 30px}.workspace-header{display:flex;justify-content:space-between;gap:28px;align-items:flex-end;margin-bottom:32px}
.eyebrow{color:#75a7e8;font-size:11px;font-weight:700;letter-spacing:.16em;margin:0 0 8px}h1{font-size:36px;letter-spacing:-.03em;margin:0}h1 span{color:#8ea9d8;font-weight:500}h2{font-size:19px;margin:0}p{margin:8px 0}.subtitle,.quiet{color:#94a6c8}.source-meta{display:grid;justify-items:end;gap:7px;text-align:right}.source-meta time{color:#93a7c9;font-size:12px}
.pill{display:inline-flex;align-items:center;border:1px solid #3a527c;border-radius:999px;padding:3px 9px;font-size:10px;font-weight:750;letter-spacing:.035em;white-space:nowrap;background:#182640;color:#bed6ff}.pill.observed{border-color:#2d7664;background:#123a34;color:#a4f3d3}.pill.start_eligible_claim,.pill.start_eligible_independent_review,.pill.start_eligible_validator{border-color:#3777b9}.pill.wait_external{border-color:#6c7d9e;background:#222e43;color:#bdcbe5}.pill.repair_eligible{border-color:#a2763c;background:#35291a;color:#f3d49e}.pill.needs_human_host,.pill.needs_user_decision{border-color:#b4773f;background:#3b2519;color:#ffd7a8}.pill.no_valid_action,.pill.conflict{border-color:#a34b5b;background:#3c1b27;color:#ffb8c6}
.workspace-header,.section-head{gap:16px}.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}.section-head .quiet{font-size:12px;max-width:620px;text-align:right}
.table-section,.workspace>section{margin-bottom:30px}.table-scroll{overflow-x:auto;border:1px solid #263452;border-radius:14px;background:#111a2d;box-shadow:0 12px 40px #03061155}table{width:100%;border-collapse:collapse;min-width:1080px}th{text-align:left;color:#86a3d0;font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;background:#16223a;padding:13px 14px;border-bottom:1px solid #2a3a5d}td{padding:14px;border-bottom:1px solid #22304c;vertical-align:top;font-size:12px;color:#d8e3f8}tbody tr:last-child td{border-bottom:0}td code{display:block;margin-top:5px}td small{display:block;color:#91a5c9;margin-top:5px;max-width:210px}
.action-grid,.inbox-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.action-card,.inbox-card{background:linear-gradient(145deg,#152139,#101a2c);border:1px solid #2a3c61;border-radius:14px;padding:18px;box-shadow:0 8px 24px #050a1630}.action-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.authority{font-size:10px;color:#93a8ce;text-align:right}.action-card p,.inbox-card p{color:#a6b8d7;font-size:13px}dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}dt{color:#7f96bd;font-size:10px;text-transform:uppercase;letter-spacing:.06em}dd{margin:2px 0 0;color:#d9e6fb;font-size:12px}.inbox-card{border-color:#765531;background:linear-gradient(145deg,#2b211b,#17171c)}.empty{padding:22px;border:1px dashed #354667;border-radius:14px;color:#98accb;background:#10192a}footer{border-top:1px solid #25334f;padding-top:18px;color:#738bad;font-size:11px}.error-panel{max-width:720px;margin:60px auto;padding:28px;border:1px solid #944b5b;border-radius:16px;background:#321826}
@media(max-width:800px){.workspace{padding:24px 16px}.workspace-header{display:block}.source-meta{justify-items:start;text-align:left;margin-top:18px}h1{font-size:29px}.section-head{display:block}.section-head .quiet{display:block;text-align:left;margin-top:5px}table{min-width:0;display:block}thead{display:none}tbody,tr,td{display:block;width:100%}tr.task-row{border-bottom:1px solid #2a3a5d;padding:12px 14px}td{border:0;padding:4px 0;font-size:12px}td:before{content:attr(data-label);display:block;color:#7f96bd;font-size:9px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}td:first-child{padding-top:8px}td:last-child{padding-bottom:8px}.action-grid,.inbox-grid{grid-template-columns:1fr}}
</style>
</head>
<body><main id="app"></main>
<script type="module">
import {renderJourneyWorkspace} from './journey-view.mjs';
const sourceSha='ec9820c3a67e387d5ca51f736be0d6f316f36c12';
const observedAt='2026-10-30T19:00:00.000Z';
const task=(sourceRef,changes={})=>({sourceRef,sourceSha,observedAsOf:observedAt,
  currentness:'OBSERVED_AT_QUERY_COMPLETION',status:'AWAITING_HOST_ADMISSION',
  reason:'NATIVE_READY_NO_ACCEPTED_CLAIM',dependencyState:'CLEAR',claimState:'NOT_VERIFIED',
  kernelTaskState:'NOT_VERIFIED',agentAttemptState:'NOT_VERIFIED',reviewState:'NOT_VERIFIED',
  ciState:'NOT_VERIFIED',hostState:'NOT_VERIFIED',releaseState:'NOT_VERIFIED',
  authorized:false,admitted:false,taskPass:false,releasePass:false,...changes});
const snapshot={status:'OBSERVED',project:'tally',version:'v2',sourceSha,observedAsOf:observedAt,
  currentness:'OBSERVED_AT_QUERY_COMPLETION',tasks:[
    task('https://github.com/kaicreator-mm/tally/issues/172'),
    task('https://github.com/kaicreator-mm/tally/issues/177',{status:'AWAITING_REVIEW',reason:'LOCAL_CANDIDATE_READY',agentAttemptState:'LOCAL_CANDIDATE_READY'}),
    task('https://github.com/kaicreator-mm/tally/issues/179',{status:'REVIEW_CANDIDATE_EVIDENCE',reason:'REVIEW_JOINED',reviewState:'REVIEW_JOINED',hostState:'REVIEW_JOINED'}),
    task('https://github.com/kaicreator-mm/tally/issues/999',{requiredHostEvidence:{kind:'WINDOWS_CODEX_HOST',available:false,reason:'CODEX_HOST_UNREACHABLE'}})
  ],progressSignals:{candidates:1,reviewed:1,released:0,comparison:'COUNTS_NOT_PERCENTAGES'},authorized:false,admitted:false,taskPass:false,releasePass:false};
const actions=[{authorizationType:'START_ELIGIBLE_CLAIM',reason:'NATIVE_READY_NO_ACCEPTED_CLAIM',actorRole:'builder',requiredCapability:'HOST_CLAIM_WRITER',approvalNeeded:true,costRisk:'LOW',authorization:'HOST_AND_ADS_REQUIRED',currentness:snapshot.currentness,evidence:{sourceRef:snapshot.tasks[0].sourceRef,sourceSha,observedAsOf:observedAt}},
{authorizationType:'START_ELIGIBLE_INDEPENDENT_REVIEW',reason:'LOCAL_CANDIDATE_READY',actorRole:'reviewer',requiredCapability:'INDEPENDENT_REVIEWER',approvalNeeded:true,costRisk:'LOW',authorization:'HOST_AND_ADS_REQUIRED',currentness:snapshot.currentness,evidence:{sourceRef:snapshot.tasks[1].sourceRef,sourceSha,observedAsOf:observedAt}},
{authorizationType:'START_ELIGIBLE_VALIDATOR',reason:'REVIEW_JOINED',actorRole:'validator',requiredCapability:'VALIDATOR',approvalNeeded:true,costRisk:'LOW',authorization:'HOST_AND_ADS_REQUIRED',currentness:snapshot.currentness,evidence:{sourceRef:snapshot.tasks[2].sourceRef,sourceSha,observedAsOf:observedAt}},
{authorizationType:'NEEDS_HUMAN_HOST',reason:'CODEX_HOST_UNREACHABLE',actorRole:'human',requiredCapability:'WINDOWS_CODEX_HOST',approvalNeeded:true,costRisk:'HIGH',authorization:'ADVISORY_ONLY',currentness:snapshot.currentness,evidence:{sourceRef:snapshot.tasks[3].sourceRef,sourceSha,observedAsOf:observedAt}}];
const humanActionInbox=[{kind:'NEEDS_HUMAN_HOST',reason:'CODEX_HOST_UNREACHABLE',expectedEvidence:'WINDOWS_CODEX_HOST',readback:snapshot.tasks[3].sourceRef,sourceSha}];
for(const action of actions)Object.freeze(action);
document.querySelector('#app').innerHTML=renderJourneyWorkspace(snapshot,{actions,humanActionInbox});
</script>
</body>
</html>
